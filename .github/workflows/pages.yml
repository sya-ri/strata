name: Documentation
'on':
  push:
    branches:
    - master
    paths:
    - api/**
    - runtime/**
    - paper-api/**
    - velocity-api/**
    - examples/**
    - integration/docs/**
    - docs/**
    - skills/**
    - README.md
    - build.gradle.kts
    - settings.gradle.kts
    - build-logic/**
    - .github/workflows/pages.yml
    - .github/actions/setup-strata-java/**
    - release/pages-archive.py
    - gradle/libs.versions.toml
    - gradle/wrapper/**
    - gradle.properties
  workflow_dispatch:
    inputs:
      release_tag:
        description: Add documentation for this signed release tag
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: strata-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-strata-java
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Restore rendered versions
      run: |-
        if git ls-remote --exit-code --heads origin gh-pages; then
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach build/pages-store origin/gh-pages
        else
          git worktree add --detach build/pages-store HEAD
          git -C build/pages-store switch --orphan gh-pages
          python3 release/pages-archive.py bootstrap --store build/pages-store
        fi
        if [[ -n "$RELEASE_TAG" ]]; then
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$commit"
          if [[ ! -d "build/pages-store/older/${RELEASE_TAG#v}" ]]; then echo 'build_release=true' >> "$GITHUB_OUTPUT"; fi
        fi
      id: archive
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
    - uses: actions/checkout@v7
      if: steps.archive.outputs.build_release == 'true'
      with:
        ref: ${{ inputs.release_tag }}
        path: product
        persist-credentials: false
    - name: Generate the new release documentation once
      run: |-
        commit=$(git rev-parse HEAD)
        bash ./gradlew :integration:docs:checkDokkaPagesStaging -Pstrata.sourceRevision="$RELEASE_TAG" -Pstrata.sourceCommit="$commit" -Pstrata.webDemoInstallSystemDependencies=true
      if: steps.archive.outputs.build_release == 'true'
      working-directory: product
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
    - name: Archive the new release
      run: python3 release/pages-archive.py snapshot --store build/pages-store --source product/build/dokka/html --tag "$RELEASE_TAG"
      if: steps.archive.outputs.build_release == 'true'
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
    - name: Generate and check development documentation
      run: bash ./gradlew :integration:docs:checkDokkaPagesStaging -Pstrata.sourceRevision=master -Pstrata.sourceCommit="$GITHUB_SHA" -Pstrata.olderDocs=build/pages-store/older
        -Pstrata.webDemoInstallSystemDependencies=true
    - name: Save rendered documentation
      run: |-
        python3 release/pages-archive.py check --store build/dokka/html
        python3 release/pages-archive.py save --store build/pages-store --source build/dokka/html
        git -C build/pages-store config user.name 'github-actions[bot]'
        git -C build/pages-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git -C build/pages-store add --all
        if ! git -C build/pages-store diff --cached --quiet; then
          git -C build/pages-store commit -m 'Update rendered documentation'
          git -C build/pages-store push origin HEAD:gh-pages
        fi
    - uses: actions/upload-pages-artifact@v5
      with:
        path: build/dokka/html
        retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@v5
      id: deployment
