name: Documentation

on:
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Select documentation source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == v* ]] || { echo 'Documentation tags must begin with v.' >&2; exit 1; }
            echo "revision=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Documentation branches must be master.' >&2; exit 1; }
            echo 'revision=master' >> "$GITHUB_OUTPUT"
          fi
      - name: Check reader documentation and public skill
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          gradle_options=(--no-parallel --max-workers=2)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gradle_options+=(--no-build-cache)
          fi
          bash ./gradlew "${gradle_options[@]}" \
            :integration:docs:checkStrataSkill \
            :integration:docs:checkStrataSkillExampleClasspath \
            :integration:docs:checkDocumentationLinks \
            -Pstrata.sourceRevision="$SOURCE_REVISION" \
            -Pstrata.sourceCommit="$SOURCE_COMMIT"
      - name: Generate and validate Dokka API site
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          gradle_options=(--no-parallel --max-workers=2)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gradle_options+=(--no-build-cache)
          fi
          bash ./gradlew "${gradle_options[@]}" \
            :integration:docs:checkDokkaPagesStaging \
            -Pstrata.sourceRevision="$SOURCE_REVISION" \
            -Pstrata.sourceCommit="$SOURCE_COMMIT"
      - name: Preserve immutable release documentation
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          bash -n release/stage-versioned-pages.sh
          for release_tag in v0.1.0 v0.1.1 v0.1.2; do
            bash release/stage-versioned-pages.sh \
              "$release_tag" build/dokka/html "$SOURCE_REVISION"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
