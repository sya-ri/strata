name: Publish release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release once, or run final verification after Modrinth approval
        required: true
        type: choice
        default: release
        options:
          - release
          - verify
      tag:
        description: Exact release tag
        required: true
        type: string
        default: v0.1.2
      modrinth_project_id:
        description: Optional cross-check of the committed immutable Modrinth project ID
        required: false
        type: string
      confirmation:
        description: Type "release v0.1.2" or "verify v0.1.2"
        required: true
        type: string

permissions:
  contents: read

# The sealed v0.1.1 workflow uses this exact group for legitimate runs. Sharing it
# prevents either release from observing or changing the shared Modrinth body while
# the other release is verifying it.
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.operation == 'release'
    permissions:
      actions: read
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      controller_commit: ${{ steps.source.outputs.controller_commit }}
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      pages_record: ${{ steps.pages.outputs.pages_record }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pinned workflow topology
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-release.yml
          sealed_previous_workflow=.github/workflows/release-v0.1.1.yml
          sealed_initial_workflow=.github/workflows/release.yml
          [[ -f "$workflow" && -f "$sealed_previous_workflow" && -f "$sealed_initial_workflow" && \
            -f release/verify-controller-tools.sh ]] || { echo 'A release workflow or controller tool guard is missing.' >&2; exit 1; }
          grep --fixed-strings 'default: v0.1.2' "$workflow" >/dev/null
          grep --fixed-strings 'group: release-v0.1.0' "$workflow" >/dev/null
          grep --fixed-strings 'default: v0.1.1' "$sealed_previous_workflow" >/dev/null
          grep --fixed-strings 'group: release-v0.1.0' "$sealed_previous_workflow" >/dev/null
          grep --fixed-strings 'default: v0.1.0' "$sealed_initial_workflow" >/dev/null
          expected_initial_group='group: release-$''{{ inputs.tag }}'
          grep --fixed-strings "$expected_initial_group" "$sealed_initial_workflow" >/dev/null
          grep --fixed-strings "if: steps.central.outputs.public_state == 'absent' && steps.central.outputs.portal_state == 'absent'" "$workflow" >/dev/null
          central_write='publishAndReleaseToMaven''Central'
          [[ "$(grep --fixed-strings -c "$central_write" "$workflow")" == "1" ]] || { echo 'Current Central write topology differs.' >&2; exit 1; }
          [[ "$(grep --fixed-strings -c "$central_write" "$sealed_previous_workflow")" == "1" ]] || { echo 'The sealed v0.1.1 Central write topology differs.' >&2; exit 1; }
          [[ "$(grep --fixed-strings -c "$central_write" "$sealed_initial_workflow" || true)" == "0" ]] || { echo 'The sealed v0.1.0 workflow gained a Central write.' >&2; exit 1; }
          for sealed_workflow in "$sealed_previous_workflow" "$sealed_initial_workflow"; do
            [[ "$(grep --fixed-strings -c 'v0.1.2' "$sealed_workflow" || true)" == "0" ]] || { echo 'A sealed workflow was repurposed for v0.1.2.' >&2; exit 1; }
          done
          [[ "$(grep --fixed-strings -c 'release/github-release-tag-ruleset.json' "$workflow")" == "2" && \
            "$(grep --fixed-strings -c 'release/github-release-tag-ruleset-receipt.json' "$workflow")" == "2" ]] || { echo 'Current controller ruleset inputs are not bounded to the controller preflight.' >&2; exit 1; }
          controller_loader='run_controller_tool_''guard() {'
          controller_materializer="git --no-replace-objects cat-file blob \"\$blob\""
          controller_revalidator='verify_controller_''tools() {'
          controller_ruleset_call="bash \"\$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh\""
          controller_cleanup_output='steps.controller_''tools.outputs.directory'
          legacy_controller_path='CONTROLLER_TAG_RULESET_''VERIFIER'
          raw_controller_show="git show \"\$GITHUB_SHA:release/"
          [[ "$(grep --fixed-strings -c "$controller_loader" "$workflow")" == "2" && \
            "$(grep --fixed-strings -c "$controller_materializer" "$workflow")" == "2" && \
            "$(grep --fixed-strings -c "$controller_revalidator" "$workflow")" == "7" && \
            "$(grep --fixed-strings -c "$controller_ruleset_call" "$workflow")" == "5" && \
            "$(grep --fixed-strings -c "$legacy_controller_path" "$workflow" || true)" == "0" && \
            "$(grep --fixed-strings -c "$raw_controller_show" "$workflow" || true)" == "0" ]] || { echo 'Controller tool loading topology differs.' >&2; exit 1; }
          [[ "$(grep --fixed-strings -c "$controller_cleanup_output" "$workflow")" == "4" ]] || { echo 'Controller tool cleanup is not bound to the initialization step output.' >&2; exit 1; }
          predecessor_line="$(grep -n -m 1 --extended-regexp '^      - name: Verify complete v0\.1\.1 release before Modrinth body finalization$' "$workflow" | cut -d: -f1)"
          finalize_line="$(grep -n -m 1 --extended-regexp '^      - name: Finalize v0\.1\.2 Modrinth body and verify approved release$' "$workflow" | cut -d: -f1)"
          [[ -n "$predecessor_line" && -n "$finalize_line" && "$predecessor_line" -lt "$finalize_line" ]] || { echo 'Modrinth predecessor/finalization ordering differs.' >&2; exit 1; }
          public_skills_name='  public_''skills:'
          verify_name='  ver''ify:'
          public_skills_line="$(grep -n -m 1 --fixed-strings "$public_skills_name" "$workflow" | cut -d: -f1)"
          verify_line="$(grep -n -m 1 --fixed-strings "$verify_name" "$workflow" | cut -d: -f1)"
          [[ -n "$public_skills_line" && -n "$verify_line" && "$public_skills_line" -lt "$verify_line" ]] || { echo 'Public Skill job isolation differs.' >&2; exit 1; }
          grep --fixed-strings 'needs: public_skills' "$workflow" >/dev/null
          skill_preview='gh skill pre''view'
          skill_install='npx --yes skills ''add'
          [[ "$(grep --fixed-strings -c "$skill_preview" "$workflow")" == "1" && \
            "$(grep --fixed-strings -c "$skill_install" "$workflow")" == "1" ]] || { echo 'Public Skill execution topology differs.' >&2; exit 1; }
      - name: Validate immutable release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Release must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v0.1.2" ]] || { echo 'This workflow is pinned to v0.1.2.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "release $RELEASE_TAG" ]] || { echo 'Release confirmation does not match.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Checked-out controller differs from the workflow commit.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller SHA is not the exact origin/master head.' >&2; exit 1; }
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$tag_commit" == "b541fc5492b798b6805c0c4d24e09f43ceff938a" ]] || { echo 'The v0.1.2 tag commit differs from the reviewed release source.' >&2; exit 1; }
          read -r tag_object verified_commit <<< "$(bash release/verify-release-tag.sh "$RELEASE_TAG" "$tag_commit")"
          [[ "$verified_commit" == "$tag_commit" ]] || { echo 'Signed tag verification returned a different commit.' >&2; exit 1; }
          bash release/verify-github-tag-ruleset.sh \
            release/github-release-tag-ruleset.json \
            release/github-release-tag-ruleset-receipt.json >/dev/null
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed during tag verification.' >&2; exit 1; }
          git merge-base --is-ancestor "$tag_commit" origin/master || { echo 'The release tag is not contained in controller master.' >&2; exit 1; }
          root_version="$(git show "${tag_commit}:build.gradle.kts" | sed -nE 's/^version = "([^"]+)"$/\1/p')"
          [[ "$root_version" == "${RELEASE_TAG#v}" ]] || { echo "Root version $root_version does not match $RELEASE_TAG." >&2; exit 1; }
          {
            echo "controller_commit=$GITHUB_SHA"
            echo "tag_commit=$tag_commit"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful exact-SHA CI and Pages provenance
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ steps.source.outputs.tag_commit }}
        run: |
          set -euo pipefail
          mapfile -t required_commits < <(printf '%s\n' "$GITHUB_SHA" "$TAG_COMMIT" | sort --unique)
          for workflow in jvm.yml qodana.yml; do
            for required_commit in "${required_commits[@]}"; do
              runs="$(gh run list --workflow "$workflow" --commit "$required_commit" --status completed --limit 100 --json conclusion,event,headBranch,headSha)"
              jq -e --arg commit "$required_commit" \
                'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $commit)' \
                <<< "$runs" >/dev/null || {
                echo "No successful $workflow master push exists for $required_commit." >&2
                exit 1
              }
            done
          done
          release_pages="$(gh run list --workflow pages.yml --commit "$TAG_COMMIT" --event push --status completed --limit 100 --json conclusion,databaseId,event,headBranch,headSha)"
          release_pages_run_id="$(jq -er --arg tag "$RELEASE_TAG" --arg sha "$TAG_COMMIT" '
            [.[] | select(.conclusion == "success" and .event == "push" and .headBranch == $tag and .headSha == $sha)] |
            select(length == 1) | .[0].databaseId | select(type == "number" and . > 0 and . == floor) | tostring
          ' <<< "$release_pages")" || { echo 'Expected one successful tag-triggered Pages run.' >&2; exit 1; }
          controller_pages="$(gh run list --workflow pages.yml --commit "$GITHUB_SHA" --event push --status completed --limit 100 --json conclusion,databaseId,event,headBranch,headSha)"
          controller_pages_run_id="$(jq -er --arg sha "$GITHUB_SHA" '
            [.[] | select(.conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $sha)] |
            select(length == 1) | .[0].databaseId | select(type == "number" and . > 0 and . == floor) | tostring
          ' <<< "$controller_pages")" || { echo 'Expected one successful controller Pages run.' >&2; exit 1; }
          bash -n release/verify-pages-deployment-source.sh
          bash -n release/wait-for-pages-source-receipt.sh
          pages_record="$(bash release/verify-pages-deployment-source.sh \
            "$release_pages_run_id" "$RELEASE_TAG" "$TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")"
          bash release/wait-for-pages-source-receipt.sh "$RELEASE_TAG" "$TAG_COMMIT" "$GITHUB_SHA"
          [[ "$(bash release/verify-pages-deployment-source.sh \
            "$release_pages_run_id" "$RELEASE_TAG" "$TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")" == "$pages_record" ]] || {
            echo 'Pages provenance changed while polling public receipts.' >&2
            exit 1
          }
          echo "pages_record=$pages_record" >> "$GITHUB_OUTPUT"

  release:
    if: inputs.operation == 'release'
    needs: preflight
    permissions:
      actions: read
      contents: write
      deployments: read
    environment:
      name: release
      url: https://github.com/sya-ri/strata/releases/tag/${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.tag_commit }}
      - name: Revalidate protected release request
        id: controller_tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
          EXPECTED_PAGES_RECORD: ${{ needs.preflight.outputs.pages_record }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Release must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v0.1.2" && "$CONFIRMATION" == "release $RELEASE_TAG" ]] || { echo 'Protected release request differs.' >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Protected controller differs from preflight.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Checked-out release source differs from preflight.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller is no longer the exact master head.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source is no longer contained in master.' >&2; exit 1; }
          run_controller_tool_guard() {
            local operation="$1"
            local controller_commit="$2"
            local tool_directory="$3"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git --no-replace-objects ls-tree --full-tree "$controller_commit" -- release/verify-controller-tools.sh)"
            [[ "$record" != *$'\n'* ]] || { echo 'The controller tool guard tree entry is ambiguous.' >&2; exit 1; }
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "release/verify-controller-tools.sh" ]] || {
              echo 'The controller tool guard is not the expected regular Git blob.' >&2
              exit 1
            }
            git --no-replace-objects cat-file blob "$blob" | \
              bash -s -- "$operation" "$controller_commit" "$tool_directory"
          }
          controller_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-release-controller-tools.XXXXXX")"
          [[ -d "$controller_tool_directory" && ! -L "$controller_tool_directory" ]] || {
            echo 'Failed to create a regular release controller tool directory.' >&2
            exit 1
          }
          echo "CONTROLLER_TOOL_DIRECTORY=$controller_tool_directory" >> "$GITHUB_ENV"
          echo "directory=$controller_tool_directory" >> "$GITHUB_OUTPUT"
          controller_ruleset_verifier="$controller_tool_directory/verify-github-tag-ruleset.sh"
          controller_ruleset_contract="$controller_tool_directory/github-release-tag-ruleset.json"
          controller_ruleset_receipt="$controller_tool_directory/github-release-tag-ruleset-receipt.json"
          controller_pages_verifier="$controller_tool_directory/verify-pages-deployment-source.sh"
          controller_pages_waiter="$controller_tool_directory/wait-for-pages-source-receipt.sh"
          run_controller_tool_guard materialize "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_ruleset_verifier" "$controller_ruleset_contract" "$controller_ruleset_receipt" >/dev/null
          root_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)"
          [[ "$root_version" == "${RELEASE_TAG#v}" ]] || { echo 'Root version differs from the release tag.' >&2; exit 1; }
          read -r release_pages_run_id _ _ controller_pages_run_id _ _ <<< "$EXPECTED_PAGES_RECORD"
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          pages_record="$(bash "$controller_pages_verifier" \
            "$release_pages_run_id" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")"
          [[ "$pages_record" == "$EXPECTED_PAGES_RECORD" ]] || { echo 'Protected Pages evidence differs from preflight.' >&2; exit 1; }
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_pages_waiter" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$GITHUB_SHA"
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          [[ "$(bash "$controller_pages_verifier" \
            "$release_pages_run_id" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")" == "$EXPECTED_PAGES_RECORD" ]] || {
            echo 'Protected Pages provenance changed while polling public receipts.' >&2
            exit 1
          }
          {
            echo "RELEASE_SOURCE_COMMIT=$EXPECTED_TAG_COMMIT"
          } >> "$GITHUB_ENV"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Resolve immutable release credentials
        id: modrinth
        shell: bash
        env:
          REQUESTED_PROJECT_ID: ${{ inputs.modrinth_project_id }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          tracked="$(jq -r '.projectId // empty' release/modrinth-project.json)"
          [[ -n "$tracked" ]] || { echo 'The immutable Modrinth project ID is not tracked.' >&2; exit 1; }
          [[ -z "$REQUESTED_PROJECT_ID" || "$REQUESTED_PROJECT_ID" == "$tracked" ]] || { echo 'Requested Modrinth project ID differs from tracked ID.' >&2; exit 1; }
          [[ -n "$MODRINTH_TOKEN" ]] || { echo 'MODRINTH_TOKEN is missing.' >&2; exit 1; }
          [[ -n "$SIGNING_KEY" && -n "$SIGNING_PASSWORD" ]] || { echo 'Release signing credentials are missing.' >&2; exit 1; }
          [[ -n "$MAVEN_CENTRAL_USERNAME" && -n "$MAVEN_CENTRAL_PASSWORD" ]] || { echo 'Maven Central credentials are missing.' >&2; exit 1; }
          echo "project_id=$tracked" >> "$GITHUB_OUTPUT"
      - name: Rerun release quality, documentation, and Skill gates
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            :check :api:check :integration:api:check :integration:docs:check \
            :integration:docs:checkDokkaPagesStaging \
            :quality:benchmarks:check :quality:detekt-rules:check \
            :runtime:core:check :runtime:headless:check :runtime:minecraft:check \
            :runtime:minecraft-fonts-lwjgl:check :runtime:minecraft-fonts-lwjgl:verifyOfflineFontParity \
            :koverJvmTests :koverHtmlReport :koverXmlReport -Pkover \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          git diff --quiet -- . || { echo 'Release gates changed tracked source.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Release gates changed the index.' >&2; exit 1; }
      - name: Build the 26-coordinate consumer and 21-artifact manifest
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            verifyReleasePublicationMatrix verifyPublishedConsumer modrinthReleaseManifest \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
          [[ "$(grep -cve '^[[:space:]]*$' release/maven-coordinates.txt)" == "26" ]] || { echo 'Maven coordinate count differs.' >&2; exit 1; }
          jq -e '.releaseVersion == "0.1.2" and (.artifacts | length) == 21' build/release/modrinth/manifest.json >/dev/null || { echo 'Modrinth manifest inventory differs.' >&2; exit 1; }
      - name: Run representative clients from Maven Local
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for task in \
            :integration:minecraft-fabric-1.20:runPublishedCoordinateClientGameTest \
            :integration:minecraft-fabric-1.21.11:runPublishedCoordinateClientGameTest \
            :integration:minecraft-fabric-26.2:runPublishedCoordinateClientGameTest; do
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache "$task" \
              -Pstrata.releaseRepository="file://$HOME/.m2/repository" \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          done
      - name: Preflight Maven Central and Publisher Portal
        id: central
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            mavenCentralReleasePreflight mavenCentralPortalPreflight \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          public_state="$(jq -r '.state' build/release/maven-central/preflight.json)"
          portal_state="$(jq -r '.state' build/release/maven-central/portal-preflight.json)"
          [[ "$(jq -r '.coordinateCount' build/release/maven-central/preflight.json)" == "26" ]] || { echo 'Central coordinate count differs.' >&2; exit 1; }
          case "$public_state" in
            absent)
              jq -e '.verifiedFileCount == 0 and .verifiedChecksumCount == 0' build/release/maven-central/preflight.json >/dev/null
              ;;
            exact)
              jq -e '.verifiedFileCount == 260 and .verifiedChecksumCount == 520' build/release/maven-central/preflight.json >/dev/null
              ;;
            *) echo "Unexpected public Central state: $public_state" >&2; exit 1 ;;
          esac
          case "$portal_state" in
            absent)
              jq -e '.verifiedContentFileCount == 0 and .verifiedChecksumCount == 0' build/release/maven-central/portal-preflight.json >/dev/null
              ;;
            exact)
              jq -e '.verifiedContentFileCount == 260 and .verifiedChecksumCount == 520' build/release/maven-central/portal-preflight.json >/dev/null
              ;;
            *) echo "Unexpected Central Portal state: $portal_state" >&2; exit 1 ;;
          esac
          [[ "$public_state" != "exact" || "$portal_state" == "exact" ]] || { echo 'Public Central is exact but the authenticated deployment is absent.' >&2; exit 1; }
          {
            echo "public_state=$public_state"
            echo "portal_state=$portal_state"
          } >> "$GITHUB_OUTPUT"
      - name: Preflight Modrinth without mutation
        id: modrinth_preflight
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
