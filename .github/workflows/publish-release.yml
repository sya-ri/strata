name: Publish release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release once, or run final verification after Modrinth approval
        required: true
        type: choice
        default: release
        options:
          - release
          - verify
      tag:
        description: Exact release tag
        required: true
        type: string
      modrinth_project_id:
        description: Optional cross-check of the committed immutable Modrinth project ID
        required: false
        type: string
      confirmation:
        description: Type the selected operation followed by the exact tag
        required: true
        type: string

permissions:
  contents: read

# Historical release controllers use this legacy group too, serializing every
# operation that may observe or change the shared Modrinth project body.
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.operation == 'release'
    permissions:
      actions: read
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      controller_commit: ${{ steps.source.outputs.controller_commit }}
      current_tag: ${{ steps.source.outputs.current_tag }}
      current_commit: ${{ steps.source.outputs.current_commit }}
      current_object: ${{ steps.source.outputs.current_object }}
      representative_minecraft_versions: ${{ steps.source.outputs.representative_minecraft_versions }}
      predecessor_tag: ${{ steps.source.outputs.predecessor_tag }}
      predecessor_commit: ${{ steps.source.outputs.predecessor_commit }}
      predecessor_object: ${{ steps.source.outputs.predecessor_object }}
      pages_record: ${{ steps.pages.outputs.pages_record }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Release must be dispatched from master.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "release $RELEASE_TAG" ]] || { echo 'Release confirmation does not match.' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'A canonical stable semantic release tag is required.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Checked-out controller differs from the workflow commit.' >&2; exit 1; }
          git fetch --force origin '+refs/heads/master:refs/remotes/origin/master'
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller SHA is not the exact origin/master head.' >&2; exit 1; }
          run_controller_tool_guard() {
            local operation="$1"
            local controller_commit="$2"
            local tool_directory="$3"
            local record mode object_type blob verified_path
            record="$(git --no-replace-objects ls-tree --full-tree "$controller_commit" -- release/verify-controller-tools.sh)"
            [[ "$record" != *$'\n'* ]] || { echo 'Controller guard entry is ambiguous.' >&2; exit 1; }
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "release/verify-controller-tools.sh" ]] || {
              echo 'Controller guard is not the expected regular Git blob.' >&2
              exit 1
            }
            git --no-replace-objects cat-file blob "$blob" | bash -s -- "$operation" "$controller_commit" "$tool_directory"
          }
          controller_directory="$(mktemp -d "$RUNNER_TEMP/strata-preflight-controller-tools.XXXXXX")"
          cleanup() {
            chmod -R u+w -- "$controller_directory" >/dev/null 2>&1 || true
            rm -rf -- "$controller_directory"
          }
          trap cleanup EXIT INT TERM
          run_controller_tool_guard materialize "$GITHUB_SHA" "$controller_directory"
          metadata="$controller_directory/current-controller.json"
          current_tag="$(portable_jq -er '.current.tag' "$metadata")"
          current_commit="$(portable_jq -er '.current.commit' "$metadata")"
          current_object="$(portable_jq -er '.current.tagObject' "$metadata")"
          representative_minecraft_versions="$(portable_jq -cer '.current.representativeMinecraftVersions' "$metadata")"
          predecessor_tag="$(portable_jq -er '.predecessor.tag' "$metadata")"
          predecessor_commit="$(portable_jq -er '.predecessor.commit' "$metadata")"
          predecessor_object="$(portable_jq -er '.predecessor.tagObject' "$metadata")"
          [[ "$RELEASE_TAG" == "$current_tag" ]] || { echo 'Requested tag does not match current-controller metadata.' >&2; exit 1; }
          [[ "$predecessor_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Predecessor tag is not canonical stable semantic syntax.' >&2; exit 1; }
          [[ "$(printf '%s\n' "${predecessor_tag#v}" "${current_tag#v}" | sort -V | head -n 1)" == "${predecessor_tag#v}" && \
            "$predecessor_tag" != "$current_tag" ]] || { echo 'Predecessor semantic version must be earlier than current.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/tags/*:refs/tags/*'
          [[ "$(git rev-parse --verify "refs/tags/$current_tag^{commit}")" == "$current_commit" && \
            "$(git rev-parse "refs/tags/$current_tag")" == "$current_object" ]] || { echo 'Current release identity differs from controller metadata.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$predecessor_tag^{commit}")" == "$predecessor_commit" && \
            "$(git rev-parse "refs/tags/$predecessor_tag")" == "$predecessor_object" ]] || { echo 'Predecessor identity differs from controller metadata.' >&2; exit 1; }
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_directory"
          bash "$controller_directory/verify-release-tag.sh" "$current_tag" "$current_commit" "$current_object" >/dev/null
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_directory"
          bash "$controller_directory/verify-release-tag.sh" "$predecessor_tag" "$predecessor_commit" "$predecessor_object" >/dev/null
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_directory"
          bash "$controller_directory/verify-current-controller-release-order.sh" "$metadata" >/dev/null
          jq -e '.conditions.ref_name.include == ["refs/tags/v*"]' "$controller_directory/github-release-tag-ruleset.json" >/dev/null
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_directory"
          bash "$controller_directory/verify-github-tag-ruleset.sh" \
            "$controller_directory/github-release-tag-ruleset.json" \
            "$controller_directory/github-release-tag-ruleset-receipt.json" >/dev/null
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed during tag verification.' >&2; exit 1; }
          git merge-base --is-ancestor "$predecessor_commit" "$current_commit" || { echo 'Predecessor is not an ancestor of the current release.' >&2; exit 1; }
          git merge-base --is-ancestor "$current_commit" origin/master || { echo 'Current release is not contained in controller master.' >&2; exit 1; }
          for identity in \
            "$current_tag|$current_commit" \
            "$predecessor_tag|$predecessor_commit"; do
            tag="${identity%%|*}"
            commit="${identity#*|}"
            root_version="$(git show "${commit}:build.gradle.kts" | sed -nE 's/^version = "([^"]+)"$/\1/p')"
            [[ "$root_version" == "${tag#v}" ]] || { echo "Root version does not match $tag." >&2; exit 1; }
          done
          while IFS= read -r minecraft_version; do
            for project_kind in runtime integration; do
              project_path="$project_kind/minecraft-fabric-$minecraft_version/build.gradle.kts"
              record="$(git --no-replace-objects ls-tree --full-tree "$current_commit" -- "$project_path")"
              [[ -n "$record" && "$record" != *$'\n'* ]] || { echo "Representative Minecraft project is missing or ambiguous: $project_path" >&2; exit 1; }
              read -r mode object_type blob verified_path <<< "$record"
              [[ "$mode" == '100644' && "$object_type" == 'blob' && "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$project_path" ]] || { echo "Representative Minecraft project is not a regular blob: $project_path" >&2; exit 1; }
            done
          done < <(portable_jq -er '.current.representativeMinecraftVersions[]' "$metadata")
          {
            echo "controller_commit=$GITHUB_SHA"
            echo "current_tag=$current_tag"
            echo "current_commit=$current_commit"
            echo "current_object=$current_object"
            echo "representative_minecraft_versions=$representative_minecraft_versions"
            echo "predecessor_tag=$predecessor_tag"
            echo "predecessor_commit=$predecessor_commit"
            echo "predecessor_object=$predecessor_object"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful exact-SHA CI and Pages provenance
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ steps.source.outputs.current_commit }}
        run: |
          set -euo pipefail
          mapfile -t required_commits < <(printf '%s\n' "$GITHUB_SHA" "$TAG_COMMIT" | sort --unique)
          for workflow in jvm.yml qodana.yml; do
            for required_commit in "${required_commits[@]}"; do
              runs="$(gh run list --workflow "$workflow" --commit "$required_commit" --status completed --limit 100 --json conclusion,event,headBranch,headSha)"
              jq -e --arg commit "$required_commit" \
                'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $commit)' \
                <<< "$runs" >/dev/null || {
                echo "No successful $workflow master push exists for $required_commit." >&2
                exit 1
              }
            done
          done
          controller_pages="$(gh run list --workflow pages.yml --commit "$GITHUB_SHA" --event push --status completed --limit 100 --json conclusion,databaseId,event,headBranch,headSha)"
          controller_pages_run_id="$(jq -er --arg sha "$GITHUB_SHA" '
            [.[] | select(.conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $sha)] |
            select(length == 1) | .[0].databaseId | select(type == "number" and . > 0 and . == floor) | tostring
          ' <<< "$controller_pages")" || { echo 'Expected one successful controller Pages run.' >&2; exit 1; }
          release_pages_run_id="$controller_pages_run_id"
          bash -n release/verify-pages-deployment-source.sh
          bash -n release/wait-for-pages-source-receipt.sh
          pages_record="$(bash release/verify-pages-deployment-source.sh \
            "$release_pages_run_id" "$RELEASE_TAG" "$TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")"
          bash release/wait-for-pages-source-receipt.sh "$RELEASE_TAG" "$TAG_COMMIT" "$GITHUB_SHA"
          [[ "$(bash release/verify-pages-deployment-source.sh \
            "$release_pages_run_id" "$RELEASE_TAG" "$TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")" == "$pages_record" ]] || {
            echo 'Pages provenance changed while polling public receipts.' >&2
            exit 1
          }
          echo "pages_record=$pages_record" >> "$GITHUB_OUTPUT"

  release:
    if: inputs.operation == 'release'
    needs: preflight
    permissions:
      actions: read
      contents: write
      deployments: read
    environment:
      name: release
      url: https://github.com/sya-ri/strata/releases/tag/${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.current_commit }}
      - name: Revalidate protected release request
        id: controller_tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG: ${{ needs.preflight.outputs.current_tag }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.current_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.current_object }}
          EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS: ${{ needs.preflight.outputs.representative_minecraft_versions }}
          EXPECTED_PREDECESSOR_TAG: ${{ needs.preflight.outputs.predecessor_tag }}
          EXPECTED_PREDECESSOR_COMMIT: ${{ needs.preflight.outputs.predecessor_commit }}
          EXPECTED_PREDECESSOR_OBJECT: ${{ needs.preflight.outputs.predecessor_object }}
          EXPECTED_PAGES_RECORD: ${{ needs.preflight.outputs.pages_record }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Release must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "$EXPECTED_TAG" && "$CONFIRMATION" == "release $RELEASE_TAG" ]] || { echo 'Protected release request differs.' >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Protected controller differs from preflight.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/tags/*:refs/tags/*'
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Checked-out release source differs from preflight.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller is no longer the exact master head.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_TAG_COMMIT" && \
            "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$EXPECTED_TAG_OBJECT" ]] || { echo 'Current tag identity differs from preflight.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$EXPECTED_PREDECESSOR_TAG^{commit}")" == "$EXPECTED_PREDECESSOR_COMMIT" && \
            "$(git rev-parse "refs/tags/$EXPECTED_PREDECESSOR_TAG")" == "$EXPECTED_PREDECESSOR_OBJECT" ]] || { echo 'Predecessor tag identity differs from preflight.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_PREDECESSOR_COMMIT" "$EXPECTED_TAG_COMMIT" || { echo 'Predecessor ancestry differs from preflight.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source is no longer contained in master.' >&2; exit 1; }
          run_controller_tool_guard() {
            local operation="$1"
            local controller_commit="$2"
            local tool_directory="$3"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git --no-replace-objects ls-tree --full-tree "$controller_commit" -- release/verify-controller-tools.sh)"
            [[ "$record" != *$'\n'* ]] || { echo 'The controller tool guard tree entry is ambiguous.' >&2; exit 1; }
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "release/verify-controller-tools.sh" ]] || {
              echo 'The controller tool guard is not the expected regular Git blob.' >&2
              exit 1
            }
            git --no-replace-objects cat-file blob "$blob" | \
              bash -s -- "$operation" "$controller_commit" "$tool_directory"
          }
          controller_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-release-controller-tools.XXXXXX")"
          [[ -d "$controller_tool_directory" && ! -L "$controller_tool_directory" ]] || {
            echo 'Failed to create a regular release controller tool directory.' >&2
            exit 1
          }
          echo "CONTROLLER_TOOL_DIRECTORY=$controller_tool_directory" >> "$GITHUB_ENV"
          echo "directory=$controller_tool_directory" >> "$GITHUB_OUTPUT"
          controller_ruleset_verifier="$controller_tool_directory/verify-github-tag-ruleset.sh"
          controller_ruleset_contract="$controller_tool_directory/github-release-tag-ruleset.json"
          controller_ruleset_receipt="$controller_tool_directory/github-release-tag-ruleset-receipt.json"
          controller_pages_verifier="$controller_tool_directory/verify-pages-deployment-source.sh"
          controller_pages_waiter="$controller_tool_directory/wait-for-pages-source-receipt.sh"
          run_controller_tool_guard materialize "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          metadata="$controller_tool_directory/current-controller.json"
          jq -e \
            --arg current_tag "$EXPECTED_TAG" --arg current_commit "$EXPECTED_TAG_COMMIT" --arg current_object "$EXPECTED_TAG_OBJECT" \
            --argjson representative_versions "$EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS" \
            --arg predecessor_tag "$EXPECTED_PREDECESSOR_TAG" --arg predecessor_commit "$EXPECTED_PREDECESSOR_COMMIT" --arg predecessor_object "$EXPECTED_PREDECESSOR_OBJECT" '
              .current == {tag: $current_tag, commit: $current_commit, tagObject: $current_object, representativeMinecraftVersions: $representative_versions} and
              .predecessor == {tag: $predecessor_tag, commit: $predecessor_commit, tagObject: $predecessor_object}
            ' "$metadata" >/dev/null || { echo 'Materialized controller identities differ from frozen preflight outputs.' >&2; exit 1; }
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_tool_directory/verify-release-tag.sh" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_tool_directory/verify-release-tag.sh" "$EXPECTED_PREDECESSOR_TAG" "$EXPECTED_PREDECESSOR_COMMIT" "$EXPECTED_PREDECESSOR_OBJECT" >/dev/null
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_tool_directory/verify-current-controller-release-order.sh" "$metadata" >/dev/null
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_ruleset_verifier" "$controller_ruleset_contract" "$controller_ruleset_receipt" >/dev/null
          root_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)"
          [[ "$root_version" == "${RELEASE_TAG#v}" ]] || { echo 'Root version differs from the release tag.' >&2; exit 1; }
          read -r release_pages_run_id _ _ controller_pages_run_id _ _ <<< "$EXPECTED_PAGES_RECORD"
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          pages_record="$(bash "$controller_pages_verifier" \
            "$release_pages_run_id" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")"
          [[ "$pages_record" == "$EXPECTED_PAGES_RECORD" ]] || { echo 'Protected Pages evidence differs from preflight.' >&2; exit 1; }
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          bash "$controller_pages_waiter" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$GITHUB_SHA"
          run_controller_tool_guard verify "$EXPECTED_CONTROLLER_COMMIT" "$controller_tool_directory"
          [[ "$(bash "$controller_pages_verifier" \
            "$release_pages_run_id" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")" == "$EXPECTED_PAGES_RECORD" ]] || {
            echo 'Protected Pages provenance changed while polling public receipts.' >&2
            exit 1
          }
          {
            echo "RELEASE_SOURCE_COMMIT=$EXPECTED_TAG_COMMIT"
            echo "RELEASE_TAG_OBJECT=$EXPECTED_TAG_OBJECT"
            echo "RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS=$EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS"
            echo "PREDECESSOR_TAG=$EXPECTED_PREDECESSOR_TAG"
            echo "PREDECESSOR_RELEASE_COMMIT=$EXPECTED_PREDECESSOR_COMMIT"
            echo "PREDECESSOR_RELEASE_OBJECT=$EXPECTED_PREDECESSOR_OBJECT"
          } >> "$GITHUB_ENV"
      - name: Resolve Java toolchains from the release catalog
        id: java
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects cat-file blob "$GITHUB_SHA:release/verify-controller-tools.sh" | \
            bash -s -- verify "$GITHUB_SHA" "$CONTROLLER_TOOL_DIRECTORY"
          {
            echo 'versions<<STRATA_JAVA_TOOLCHAINS'
            bash "$CONTROLLER_TOOL_DIRECTORY/list-java-toolchains.sh" gradle/libs.versions.toml
            echo 'STRATA_JAVA_TOOLCHAINS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.versions }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Resolve immutable release credentials
        id: modrinth
        shell: bash
        env:
          REQUESTED_PROJECT_ID: ${{ inputs.modrinth_project_id }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          tracked="$(jq -r '.projectId // empty' release/modrinth-project.json)"
          [[ -n "$tracked" ]] || { echo 'The immutable Modrinth project ID is not tracked.' >&2; exit 1; }
          [[ -z "$REQUESTED_PROJECT_ID" || "$REQUESTED_PROJECT_ID" == "$tracked" ]] || { echo 'Requested Modrinth project ID differs from tracked ID.' >&2; exit 1; }
          [[ -n "$MODRINTH_TOKEN" ]] || { echo 'MODRINTH_TOKEN is missing.' >&2; exit 1; }
          [[ -n "$SIGNING_KEY" && -n "$SIGNING_PASSWORD" ]] || { echo 'Release signing credentials are missing.' >&2; exit 1; }
          [[ -n "$MAVEN_CENTRAL_USERNAME" && -n "$MAVEN_CENTRAL_PASSWORD" ]] || { echo 'Maven Central credentials are missing.' >&2; exit 1; }
          echo "project_id=$tracked" >> "$GITHUB_OUTPUT"
      - name: Rerun release quality, documentation, and Skill gates
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            :check :api:check :integration:api:check :integration:docs:check \
            :integration:docs:checkDokkaPagesStaging \
            :quality:benchmarks:check :quality:detekt-rules:check \
            :runtime:core:check :runtime:headless:check :runtime:minecraft:check \
            :runtime:minecraft-fonts-lwjgl:check :runtime:minecraft-fonts-lwjgl:verifyOfflineFontParity \
            :koverJvmTests :koverHtmlReport :koverXmlReport -Pkover \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          git diff --quiet -- . || { echo 'Release gates changed tracked source.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Release gates changed the index.' >&2; exit 1; }
      - name: Build the release inventory and manifest
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            verifyReleasePublicationMatrix verifyPublishedConsumer modrinthReleaseManifest \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
          maven_inventory=''
          for candidate in build/release/maven-coordinates.txt release/maven-coordinates.txt; do
            if [[ -f "$candidate" && ! -L "$candidate" ]]; then
              [[ -z "$maven_inventory" ]] || { echo 'Multiple Maven artifact inventories are present.' >&2; exit 1; }
              maven_inventory="$candidate"
            fi
          done
          [[ -n "$maven_inventory" ]] || { echo 'No Maven artifact inventory was generated or supplied by the immutable release.' >&2; exit 1; }
          coordinate_count="$(grep -cve '^[[:space:]]*$' "$maven_inventory")"
          artifact_count="$(jq -er '.artifacts | length | select(. > 0)' build/release/modrinth/manifest.json)"
          [[ "$coordinate_count" =~ ^[1-9][0-9]*$ ]] || { echo 'Maven coordinate inventory is empty.' >&2; exit 1; }
          [[ "$(sort "$maven_inventory" | uniq -d | wc -l | tr -d '[:space:]')" == "0" ]] || { echo 'Maven coordinate inventory contains duplicates.' >&2; exit 1; }
          jq -e --arg release_version "${RELEASE_TAG#v}" --argjson artifact_count "$artifact_count" '
            .releaseVersion == $release_version and (.artifacts | length) == $artifact_count
          ' build/release/modrinth/manifest.json >/dev/null || { echo 'Modrinth manifest inventory differs.' >&2; exit 1; }
          mapfile -t representative_minecraft_versions < <(portable_jq -er '.[]' <<< "$RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS")
          for minecraft_version in "${representative_minecraft_versions[@]}"; do
            artifact="strata-runtime-minecraft-fabric-$minecraft_version"
            inventory_matches="$(awk -F: -v artifact="$artifact" '$2 == artifact { count++ } END { print count + 0 }' "$maven_inventory")"
            [[ "$inventory_matches" == '1' ]] || { echo "Representative Minecraft version $minecraft_version does not map to one Maven artifact." >&2; exit 1; }
            jq -e --arg minecraft_version "$minecraft_version" \
              '[.artifacts[] | select(.gameVersion == $minecraft_version)] | length == 1' \
              build/release/modrinth/manifest.json >/dev/null || { echo "Representative Minecraft version $minecraft_version does not map to one manifest artifact." >&2; exit 1; }
          done
          publication_suffixes=(.pom .module .jar -sources.jar -javadoc.jar)
          signed_content_variants=(base signature)
          checksum_suffixes=(md5 sha1 sha256 sha512)
          github_artifact_variants=(jar signature)
          github_inventory_assets=(SHA256SUMS)
          {
            echo "RELEASE_COORDINATE_COUNT=$coordinate_count"
            echo "RELEASE_MAVEN_INVENTORY=$maven_inventory"
            echo "RELEASE_MAVEN_INVENTORY_SHA256=$(sha256sum "$maven_inventory" | cut -d ' ' -f 1)"
            echo "RELEASE_ARTIFACT_COUNT=$artifact_count"
            echo "EXPECTED_CENTRAL_CONTENT_COUNT=$((coordinate_count * ${#publication_suffixes[@]} * ${#signed_content_variants[@]}))"
            echo "EXPECTED_CENTRAL_CHECKSUM_COUNT=$((coordinate_count * ${#publication_suffixes[@]} * ${#checksum_suffixes[@]}))"
            echo "EXPECTED_CENTRAL_SIGNATURE_COUNT=$((coordinate_count * ${#publication_suffixes[@]}))"
            echo "EXPECTED_GITHUB_ASSET_COUNT=$((artifact_count * ${#github_artifact_variants[@]} + ${#github_inventory_assets[@]}))"
          } >> "$GITHUB_ENV"
      - name: Run representative clients from Maven Local
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          mapfile -t representative_minecraft_versions < <(portable_jq -er '.[]' <<< "$RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS")
          for minecraft_version in "${representative_minecraft_versions[@]}"; do
            task=":integration:minecraft-fabric-$minecraft_version:runPublishedCoordinateClientGameTest"
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache "$task" \
              -Pstrata.releaseRepository="file://$HOME/.m2/repository" \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          done
      - name: Preflight Maven Central and Publisher Portal
        id: central
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            mavenCentralReleasePreflight mavenCentralPortalPreflight \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          public_state="$(jq -r '.state' build/release/maven-central/preflight.json)"
          portal_state="$(jq -r '.state' build/release/maven-central/portal-preflight.json)"
          jq -e --argjson coordinates "$RELEASE_COORDINATE_COUNT" '.coordinateCount == $coordinates' \
            build/release/maven-central/preflight.json >/dev/null || { echo 'Central coordinate count differs.' >&2; exit 1; }
          case "$public_state" in
            absent)
              jq -e '.verifiedFileCount == 0 and .verifiedChecksumCount == 0' build/release/maven-central/preflight.json >/dev/null
              ;;
            exact)
              jq -e --argjson content "$EXPECTED_CENTRAL_CONTENT_COUNT" --argjson checksums "$EXPECTED_CENTRAL_CHECKSUM_COUNT" \
                '.verifiedFileCount == $content and .verifiedChecksumCount == $checksums' build/release/maven-central/preflight.json >/dev/null
              ;;
            *) echo "Unexpected public Central state: $public_state" >&2; exit 1 ;;
          esac
          case "$portal_state" in
            absent)
              jq -e '.verifiedContentFileCount == 0 and .verifiedChecksumCount == 0' build/release/maven-central/portal-preflight.json >/dev/null
              ;;
            exact)
              jq -e --argjson content "$EXPECTED_CENTRAL_CONTENT_COUNT" --argjson checksums "$EXPECTED_CENTRAL_CHECKSUM_COUNT" \
                '.verifiedContentFileCount == $content and .verifiedChecksumCount == $checksums' build/release/maven-central/portal-preflight.json >/dev/null
              ;;
            *) echo "Unexpected Central Portal state: $portal_state" >&2; exit 1 ;;
          esac
          [[ "$public_state" != "exact" || "$portal_state" == "exact" ]] || { echo 'Public Central is exact but the authenticated deployment is absent.' >&2; exit 1; }
          {
            echo "public_state=$public_state"
            echo "portal_state=$portal_state"
          } >> "$GITHUB_OUTPUT"
      - name: Preflight Modrinth without mutation
        id: modrinth_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.current_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.current_object }}
          EXPECTED_PAGES_RECORD: ${{ needs.preflight.outputs.pages_record }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$EXPECTED_CONTROLLER_COMMIT:release/verify-controller-tools.sh" | \
              bash -s -- verify "$EXPECTED_CONTROLLER_COMMIT" "$CONTROLLER_TOOL_DIRECTORY"
          }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/tags/*:refs/tags/*'
          [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" && "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed before Modrinth preflight.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" && "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release commit changed before Modrinth preflight.' >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$EXPECTED_TAG_OBJECT" ]] || { echo 'Release tag object changed before Modrinth preflight.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$PREDECESSOR_TAG^{commit}")" == "$PREDECESSOR_RELEASE_COMMIT" && \
            "$(git rev-parse "refs/tags/$PREDECESSOR_TAG")" == "$PREDECESSOR_RELEASE_OBJECT" ]] || { echo 'Predecessor identity changed before Modrinth preflight.' >&2; exit 1; }
          git merge-base --is-ancestor "$PREDECESSOR_RELEASE_COMMIT" "$EXPECTED_TAG_COMMIT" || { echo 'Predecessor ancestry changed before Modrinth preflight.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source left controller master before Modrinth preflight.' >&2; exit 1; }
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$PREDECESSOR_TAG" "$PREDECESSOR_RELEASE_COMMIT" "$PREDECESSOR_RELEASE_OBJECT" >/dev/null
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh" \
            "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset.json" \
            "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset-receipt.json" >/dev/null
          read -r release_pages_run_id _ _ controller_pages_run_id _ _ <<< "$EXPECTED_PAGES_RECORD"
          verify_controller_tools
          [[ "$(bash "$CONTROLLER_TOOL_DIRECTORY/verify-pages-deployment-source.sh" \
            "$release_pages_run_id" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" \
            "$controller_pages_run_id" "$EXPECTED_CONTROLLER_COMMIT")" == "$EXPECTED_PAGES_RECORD" ]] || { echo 'Protected Pages evidence changed before Modrinth preflight.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed during Modrinth preflight source verification.' >&2; exit 1; }
          project_json="$(mktemp)"
          body="$(mktemp)"
          body_after="$(mktemp)"
          trap 'rm -f -- "$project_json" "$body" "$body_after"' EXIT
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 \
            --proto '=https' --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID" --output "$project_json"
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' "$project_json" > "$body"
          body_sha256="$(sha256sum "$body" | cut -d ' ' -f 1)"
          predecessor_sha256="$(jq -er '.previousBodySha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' release/modrinth-project.json)"
          current_body="$(mktemp)"
          trap 'rm -f -- "$project_json" "$body" "$body_after" "$current_body"' EXIT
          jq --null-input --rawfile body docs/modrinth-project.md --raw-output --join-output \
            '$body | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' > "$current_body"
          current_sha256="$(sha256sum "$current_body" | cut -d ' ' -f 1)"
          recovery_contract="$CONTROLLER_TOOL_DIRECTORY/backlog-recovery.json"
          recovery_sha256=""
          if [[ -f "$recovery_contract" && ! -L "$recovery_contract" ]]; then
            verify_controller_tools
            jq -e \
              --arg current_tag "$RELEASE_TAG" --arg current_commit "$EXPECTED_TAG_COMMIT" --arg current_object "$EXPECTED_TAG_OBJECT" \
              --arg predecessor_tag "$PREDECESSOR_TAG" --arg predecessor_commit "$PREDECESSOR_RELEASE_COMMIT" --arg predecessor_object "$PREDECESSOR_RELEASE_OBJECT" '
                .releaseSource.tag == $current_tag and .releaseSource.commit == $current_commit and .releaseSource.tagObject == $current_object and
                .baselineReleases[-1].tag == $predecessor_tag and .baselineReleases[-1].commit == $predecessor_commit and
                .baselineReleases[-1].tagObject == $predecessor_object
              ' "$recovery_contract" >/dev/null || { echo 'Recovery contract is not bound to the frozen controller identities.' >&2; exit 1; }
            recovery_sha256="$(jq -er '.bodyLineage.backlogSha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' "$recovery_contract")"
          fi
          if [[ -n "$recovery_sha256" && "$body_sha256" == "$recovery_sha256" ]]; then
            body_state=recovery
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/run-publish-controller-recovery.sh" \
              preflight "$recovery_contract" "$PROJECT_ID" "$RELEASE_TAG" \
              "$EXPECTED_TAG_COMMIT" "$EXPECTED_CONTROLLER_COMMIT" "$EXPECTED_PAGES_RECORD"
          elif [[ "$body_sha256" == "$predecessor_sha256" ]]; then
            body_state=predecessor
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleasePreflight \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
          elif [[ "$body_sha256" == "$current_sha256" ]]; then
            body_state=current
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleasePreflight \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
          else
            echo 'Remote Modrinth body is outside the allowed predecessor, current, or identity-bound recovery lineage.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 \
            --proto '=https' --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID" --output "$project_json"
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' "$project_json" > "$body_after"
          [[ "$(sha256sum "$body_after" | cut -d ' ' -f 1)" == "$body_sha256" ]] || { echo 'Modrinth body changed during read-only preflight.' >&2; exit 1; }
          {
            echo "body_sha256=$body_sha256"
            echo "body_state=$body_state"
          } >> "$GITHUB_OUTPUT"
      - name: Preflight GitHub Release without mutation
        shell: bash
        env:
          CENTRAL_STATE: ${{ steps.central.outputs.public_state }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$CENTRAL_STATE" == "exact" ]]; then
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache mavenCentralReleaseVerify githubReleaseBundle \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
          fi
          bash -n release/github-release-preflight.sh
          bash release/github-release-preflight.sh build/release/github
      - name: Publish wholly absent Maven Central release
        if: steps.central.outputs.public_state == 'absent' && steps.central.outputs.portal_state == 'absent'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.current_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.current_object }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$EXPECTED_CONTROLLER_COMMIT:release/verify-controller-tools.sh" | \
              bash -s -- verify "$EXPECTED_CONTROLLER_COMMIT" "$CONTROLLER_TOOL_DIRECTORY"
          }
          revalidate_release_source() {
            git fetch --force origin \
              '+refs/heads/master:refs/remotes/origin/master' \
              '+refs/tags/*:refs/tags/*'
            [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" && "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed before Central publication.' >&2; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" && "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release commit changed before Central publication.' >&2; exit 1; }
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$EXPECTED_TAG_OBJECT" ]] || { echo 'Release tag object changed before Central publication.' >&2; exit 1; }
            [[ "$(git rev-parse --verify "refs/tags/$PREDECESSOR_TAG^{commit}")" == "$PREDECESSOR_RELEASE_COMMIT" && \
              "$(git rev-parse "refs/tags/$PREDECESSOR_TAG")" == "$PREDECESSOR_RELEASE_OBJECT" ]] || { echo 'Predecessor identity changed before Central publication.' >&2; exit 1; }
            git merge-base --is-ancestor "$PREDECESSOR_RELEASE_COMMIT" "$EXPECTED_TAG_COMMIT" || { echo 'Predecessor ancestry changed before Central publication.' >&2; exit 1; }
            git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source left controller master before Central publication.' >&2; exit 1; }
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$PREDECESSOR_TAG" "$PREDECESSOR_RELEASE_COMMIT" "$PREDECESSOR_RELEASE_OBJECT" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-current-controller-release-order.sh" \
              "$CONTROLLER_TOOL_DIRECTORY/current-controller.json" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh" \
              "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset.json" \
              "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset-receipt.json" >/dev/null
            [[ "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed during Central source verification.' >&2; exit 1; }
          }
          verify_release_inventory() {
            [[ "$RELEASE_MAVEN_INVENTORY" == 'build/release/maven-coordinates.txt' || "$RELEASE_MAVEN_INVENTORY" == 'release/maven-coordinates.txt' ]] || { echo 'Maven artifact inventory path escaped the allowed release locations.' >&2; exit 1; }
            [[ -f "$RELEASE_MAVEN_INVENTORY" && ! -L "$RELEASE_MAVEN_INVENTORY" ]] || { echo 'Maven artifact inventory is missing or unsafe before Central publication.' >&2; exit 1; }
            [[ "$(sha256sum "$RELEASE_MAVEN_INVENTORY" | cut -d ' ' -f 1)" == "$RELEASE_MAVEN_INVENTORY_SHA256" ]] || { echo 'Maven artifact inventory changed before Central publication.' >&2; exit 1; }
          }
          revalidate_release_source
          verify_release_inventory
          git diff --quiet -- . || { echo 'Tracked release source changed before Central publication.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Tracked release source changed before Central publication.' >&2; exit 1; }
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            mavenCentralReleasePreflight mavenCentralPortalPreflight \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          jq -e --argjson coordinates "$RELEASE_COORDINATE_COUNT" \
            '.state == "absent" and .coordinateCount == $coordinates and .verifiedFileCount == 0 and .verifiedChecksumCount == 0' \
            build/release/maven-central/preflight.json >/dev/null || { echo 'Fresh public Central preflight is no longer wholly absent.' >&2; exit 1; }
          jq -e '.state == "absent" and .deploymentId == null and .deploymentState == null and .verifiedContentFileCount == 0 and .verifiedChecksumCount == 0' \
            build/release/maven-central/portal-preflight.json >/dev/null || { echo 'Fresh Central Portal preflight is no longer wholly absent.' >&2; exit 1; }
          revalidate_release_source
          verify_release_inventory
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache publishAndReleaseToMavenCentral \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
      - name: Verify Publisher Portal, Central repository, and release bundle
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
