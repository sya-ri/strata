name: Publish release
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Publish prepared artifacts or verify public distributions
        type: choice
        options:
        - release
        - verify
        default: release
        required: true
      tag:
        description: Signed release tag
        type: string
        required: true
      source_commit:
        description: Full product commit matching the signed tag
        type: string
        required: true
      prepared_run_id:
        description: Reuse a successful preparation job (required for verification)
        type: string
      maven_central:
        description: Publish or verify Maven Central artifacts
        type: boolean
        default: true
      github_release:
        description: Publish or verify GitHub Release
        type: boolean
        default: true
      modrinth:
        description: Publish or verify Modrinth versions
        type: boolean
        default: true
      curseforge:
        description: Publish or verify CurseForge files
        type: boolean
        default: true
      hangar:
        description: Publish or verify Hangar plugins
        type: boolean
        default: true
      confirmation:
        description: Operation followed by the exact tag
        type: string
        required: true
run-name: Publish ${{ inputs.operation }} ${{ inputs.tag }} (${{ inputs.source_commit }}) - CurseForge ${{ inputs.curseforge }}
permissions:
  contents: read
concurrency:
  group: strata-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      tag_object: ${{ steps.source.outputs.tag_object }}
      prepared_run_id: ${{ steps.source.outputs.prepared_run_id }}
      destinations: ${{ steps.source.outputs.destinations }}
      has_destinations: ${{ steps.source.outputs.has_destinations }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Validate release source
      run: python3 release/select-prepared-source.py
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_INPUTS: ${{ toJSON(inputs) }}
  prepare:
    name: Prepare release
    needs:
    - source
    - analysis
    if: inputs.operation == 'release' && inputs.prepared_run_id == ''
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SDL_VIDEO_FORCE_EGL: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.source_commit }}
        path: product
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-strata-java
      with:
        directory: product
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Install native dependencies
      run: |-
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libegl1 libegl-mesa0
    - name: Check the tagged product once
      run: bash ./gradlew check -x :integration:docs:check koverHtmlReport koverXmlReport -Pkover -Pstrata.webDemoInstallSystemDependencies=true
      working-directory: product
    - name: Build and verify signed publication inputs
      run: bash ./gradlew verifyPublishedConsumer modrinthReleaseManifest hangarReleaseManifest -Pstrata.sourceRevision="$RELEASE_TAG" -Pstrata.sourceCommit="$SOURCE_COMMIT"
        -Pstrata.modrinthProjectId="$(jq -r .projectId release/modrinth-project.json)"
      working-directory: product
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        SOURCE_COMMIT: ${{ inputs.source_commit }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    - name: Save immutable prepared release
      run: python3 release/prepared-release.py prepare --product product --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --tag-object "$TAG_OBJECT"
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        SOURCE_COMMIT: ${{ inputs.source_commit }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        TAG_OBJECT: ${{ needs.source.outputs.tag_object }}
    - uses: actions/upload-artifact@v7
      with:
        name: prepared-${{ inputs.tag }}-${{ github.run_attempt }}
        path: |-
          build/release-prepared.tar.gz
          build/release-prepared.sha256
        retention-days: 90
        if-no-files-found: error
  central:
    name: Maven Central
    needs:
    - source
    - prepare
    if: always() && inputs.maven_central && needs.source.result == 'success' && (needs.prepare.result == 'success' || (needs.prepare.result == 'skipped' && inputs.prepared_run_id
      != ''))
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/use-prepared-release
      with:
        tag: ${{ inputs.tag }}
        commit: ${{ inputs.source_commit }}
        run-id: ${{ needs.source.outputs.prepared_run_id }}
        token: ${{ github.token }}
    - uses: ./.github/actions/setup-strata-java
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Publish or verify canonical artifacts
      run: |-
        args=()
        if [[ "$ALLOW_UPLOAD" == true ]]; then args+=(--allow-maven-upload); fi
        python3 release/publish-prepared.py central "$OPERATION" --prepared build/prepared "${args[@]}"
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        OPERATION: ${{ inputs.operation }}
        ALLOW_UPLOAD: ${{ inputs.maven_central }}
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: result-central-${{ github.run_attempt }}
        path: build/receipts/*.json
        if-no-files-found: ignore
  publish:
    name: Publish ${{ matrix.destination }}
    needs:
    - source
    - prepare
    if: always() && needs.source.outputs.has_destinations == 'true' && needs.source.result == 'success' && (needs.prepare.result == 'success' || (needs.prepare.result == 'skipped' && inputs.prepared_run_id != ''))
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(needs.source.outputs.destinations) }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/use-prepared-release
      with:
        tag: ${{ inputs.tag }}
        commit: ${{ inputs.source_commit }}
        run-id: ${{ needs.source.outputs.prepared_run_id }}
        token: ${{ github.token }}
    - uses: ./.github/actions/setup-strata-java
      if: matrix.destination == 'hangar' || matrix.destination == 'modrinth'
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-excludes: caches/fabric-loom
      if: matrix.destination == 'hangar' || matrix.destination == 'modrinth'
    - name: Publish selected destination
      run: python3 release/publish-prepared.py "$DESTINATION" "$OPERATION" --prepared build/prepared
      if: matrix.destination != 'curseforge'
      env:
        GH_TOKEN: ${{ github.token }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        DESTINATION: ${{ matrix.destination }}
        OPERATION: ${{ inputs.operation }}
    - name: Stage only missing CurseForge files
      run: python3 release/publish-prepared.py curseforge "$OPERATION" --prepared build/prepared
      if: matrix.destination == 'curseforge'
      env:
        GH_TOKEN: ${{ github.token }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        OPERATION: ${{ inputs.operation }}
    - uses: actions/upload-artifact@v7
      if: always() && matrix.destination == 'curseforge'
      with:
        name: curseforge-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/receipts/curseforge/receipt.json
        retention-days: 90
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: result-${{ matrix.destination }}-${{ github.run_attempt }}
        path: |-
          build/receipts/*.json
          build/receipts/hangar/receipt.json
          build/receipts/curseforge/receipt.json
        if-no-files-found: ignore
  result:
    name: Publication result
    needs:
    - source
    - prepare
    - central
    - publish
    - analysis
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Collect latest destination receipts
      run: python3 release/collect-publication-results.py
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Record publication results
      run: |-
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        inputs = json.loads(os.environ['RELEASE_INPUTS'])
        root = Path('build/release')
        for operation in ('stage', 'verify'):
            source = root / f'modrinth-{operation}.json'
            if source.is_file():
                destination = root / 'modrinth-receipts'
                destination.mkdir(exist_ok=True)
                source.rename(destination / f'{operation}.json')
        request = dict(operation=inputs['operation'], tag=inputs['tag'], sourceCommit=inputs['source_commit'], preparedRunId=int(os.environ['PREPARED_RUN_ID']), destinations={key: inputs[key] for key in ('maven_central', 'github_release', 'modrinth', 'curseforge', 'hangar')})
        os.environ['PUBLICATION_REQUEST'] = json.dumps(request)
        import runpy
        runpy.run_path('release/publication-summary.py', run_name='__main__')
        PY
      if: needs.source.result == 'success'
      env:
        RELEASE_INPUTS: ${{ toJSON(inputs) }}
        PREPARED_RUN_ID: ${{ needs.source.outputs.prepared_run_id }}
        CURSEFORGE_READ_ENABLED: ${{ secrets.CURSEFORGE_API_KEY != '' }}
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: publication-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          build/release/publication-request.json
          build/release/modrinth-receipts/*.json
          build/release/hangar/receipt.json
          build/release/curseforge/receipt.json
        if-no-files-found: ignore
        retention-days: 90
    - name: Summarize publication jobs
      run: |-
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('| Job | Result |\n| --- | --- |\n')
            for name, job in results.items():
                summary.write(f"| {name} | {job['result']} |\n")
        assert all(job['result'] in ('success', 'skipped') for job in results.values())
        PY
      env:
        RESULTS: ${{ toJSON(needs) }}
    - name: Request release documentation separately
      run: gh workflow run pages.yml --ref master -f release_tag="$RELEASE_TAG"
      if: inputs.operation == 'release' && inputs.github_release && needs.publish.result == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      contents: read
      actions: write
  analysis:
    needs: source
    if: inputs.operation == 'release' && inputs.prepared_run_id == ''
    uses: ./.github/workflows/qodana.yml
    with:
      ref: ${{ inputs.source_commit }}
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write
