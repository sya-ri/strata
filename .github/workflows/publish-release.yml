          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache mavenCentralPortalVerify \
            -Pstrata.sourceRevision="$RELEASE_TAG" -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          jq -e --argjson content "$EXPECTED_CENTRAL_CONTENT_COUNT" --argjson checksums "$EXPECTED_CENTRAL_CHECKSUM_COUNT" \
            '.state == "exact" and .deploymentState == "PUBLISHED" and .verifiedContentFileCount == $content and .verifiedChecksumCount == $checksums' \
            build/release/maven-central/portal-verify.json >/dev/null || { echo 'Central Portal verification counts differ.' >&2; exit 1; }
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache mavenCentralReleaseVerify githubReleaseBundle \
            -Pstrata.sourceRevision="$RELEASE_TAG" -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
          jq -e --argjson coordinates "$RELEASE_COORDINATE_COUNT" --argjson content "$EXPECTED_CENTRAL_CONTENT_COUNT" --argjson checksums "$EXPECTED_CENTRAL_CHECKSUM_COUNT" \
            '.state == "exact" and .coordinateCount == $coordinates and .verifiedFileCount == $content and .verifiedChecksumCount == $checksums' \
            build/release/maven-central/verify.json >/dev/null || { echo 'Public Central verification counts differ.' >&2; exit 1; }
          shopt -s nullglob
          assets=(build/release/github/*)
          jars=(build/release/github/*.jar)
          [[ "${#jars[@]}" == "$RELEASE_ARTIFACT_COUNT" && "${#assets[@]}" == "$EXPECTED_GITHUB_ASSET_COUNT" ]] || { echo 'Canonical GitHub bundle inventory differs.' >&2; exit 1; }
      - name: Verify all Central signatures
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf -- "$key_file" "$gnupg_home"' EXIT
          chmod 600 "$key_file"
          chmod 700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf '%s' "$SIGNING_KEY" > "$key_file"
          if ! gpg --batch --quiet --import "$key_file"; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$key_file"
            gpg --batch --quiet --import "$key_file"
          fi
          verified=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            verified=$((verified + 1))
          done < <(find build/release/maven-central/evidence -type f -name '*.asc' -print0)
          [[ "$verified" == "$EXPECTED_CENTRAL_SIGNATURE_COUNT" ]] || { echo "Central signature inventory differs: $verified." >&2; exit 1; }
          for jar in build/release/github/*.jar; do
            gpg --batch --verify "$jar.asc" "$jar"
          done
      - name: Stage only missing Modrinth versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREFLIGHT_BODY_STATE: ${{ steps.modrinth_preflight.outputs.body_state }}
          PREFLIGHT_BODY_SHA256: ${{ steps.modrinth_preflight.outputs.body_sha256 }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.current_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.current_object }}
          EXPECTED_PAGES_RECORD: ${{ needs.preflight.outputs.pages_record }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$EXPECTED_CONTROLLER_COMMIT:release/verify-controller-tools.sh" | \
              bash -s -- verify "$EXPECTED_CONTROLLER_COMMIT" "$CONTROLLER_TOOL_DIRECTORY"
          }
          revalidate_release_source() {
            git fetch --force origin \
              '+refs/heads/master:refs/remotes/origin/master' \
              '+refs/tags/*:refs/tags/*'
            [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" && "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed before Modrinth staging.' >&2; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" && "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release commit changed before Modrinth staging.' >&2; exit 1; }
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$EXPECTED_TAG_OBJECT" ]] || { echo 'Release tag object changed before Modrinth staging.' >&2; exit 1; }
            [[ "$(git rev-parse --verify "refs/tags/$PREDECESSOR_TAG^{commit}")" == "$PREDECESSOR_RELEASE_COMMIT" && \
              "$(git rev-parse "refs/tags/$PREDECESSOR_TAG")" == "$PREDECESSOR_RELEASE_OBJECT" ]] || { echo 'Predecessor identity changed before Modrinth staging.' >&2; exit 1; }
            git merge-base --is-ancestor "$PREDECESSOR_RELEASE_COMMIT" "$EXPECTED_TAG_COMMIT" || { echo 'Predecessor ancestry changed before Modrinth staging.' >&2; exit 1; }
            git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source left controller master before Modrinth staging.' >&2; exit 1; }
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$PREDECESSOR_TAG" "$PREDECESSOR_RELEASE_COMMIT" "$PREDECESSOR_RELEASE_OBJECT" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-current-controller-release-order.sh" \
              "$CONTROLLER_TOOL_DIRECTORY/current-controller.json" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh" \
              "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset.json" \
              "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset-receipt.json" >/dev/null
            read -r release_pages_run_id _ _ controller_pages_run_id _ _ <<< "$EXPECTED_PAGES_RECORD"
            verify_controller_tools
            [[ "$(bash "$CONTROLLER_TOOL_DIRECTORY/verify-pages-deployment-source.sh" \
              "$release_pages_run_id" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" \
              "$controller_pages_run_id" "$EXPECTED_CONTROLLER_COMMIT")" == "$EXPECTED_PAGES_RECORD" ]] || { echo 'Protected Pages evidence changed before Modrinth staging.' >&2; exit 1; }
            [[ "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed during Modrinth source verification.' >&2; exit 1; }
          }
          revalidate_release_source
          git diff --quiet -- . || { echo 'Tracked release source changed before Modrinth staging.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Tracked release source changed before Modrinth staging.' >&2; exit 1; }
          if [[ "$PREFLIGHT_BODY_STATE" == 'recovery' ]]; then
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/run-publish-controller-recovery.sh" \
              stage "$CONTROLLER_TOOL_DIRECTORY/backlog-recovery.json" \
              "$PROJECT_ID" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_CONTROLLER_COMMIT" \
              "$EXPECTED_PAGES_RECORD"
          else
            [[ "$PREFLIGHT_BODY_STATE" == 'predecessor' || "$PREFLIGHT_BODY_STATE" == 'current' ]] || { echo 'Unknown Modrinth preflight body state.' >&2; exit 1; }
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseStage \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
          fi
          jq -e --argjson artifacts "$RELEASE_ARTIFACT_COUNT" '.operation == "stage" and (.absent | length) == 0 and (.listed | length) == $artifacts' \
            build/release/modrinth-receipts/stage.json >/dev/null || { echo 'Modrinth staging receipt differs.' >&2; exit 1; }
          project_json="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f -- "$project_json" "$body"' EXIT
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 \
            --proto '=https' --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID" --output "$project_json"
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' "$project_json" > "$body"
          [[ "$(sha256sum "$body" | cut -d ' ' -f 1)" == "$PREFLIGHT_BODY_SHA256" ]] || { echo 'Modrinth staging changed the shared project body.' >&2; exit 1; }
      - name: Run representative clients from Maven Central
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          mapfile -t representative_minecraft_versions < <(portable_jq -er '.[]' <<< "$RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS")
          for minecraft_version in "${representative_minecraft_versions[@]}"; do
            task=":integration:minecraft-fabric-$minecraft_version:runPublishedCoordinateClientGameTest"
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache "$task" \
              -Pstrata.releaseRepository=https://repo1.maven.org/maven2 \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          done
      - name: Create or verify immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.current_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.current_object }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$EXPECTED_CONTROLLER_COMMIT:release/verify-controller-tools.sh" | \
              bash -s -- verify "$EXPECTED_CONTROLLER_COMMIT" "$CONTROLLER_TOOL_DIRECTORY"
          }
          revalidate_release_source() {
            git fetch --force origin \
              '+refs/heads/master:refs/remotes/origin/master' \
              '+refs/tags/*:refs/tags/*'
            [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" && "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed before GitHub mutation.' >&2; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" && "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release commit changed before GitHub mutation.' >&2; exit 1; }
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$EXPECTED_TAG_OBJECT" ]] || { echo 'Release tag object changed before GitHub mutation.' >&2; exit 1; }
            [[ "$(git rev-parse --verify "refs/tags/$PREDECESSOR_TAG^{commit}")" == "$PREDECESSOR_RELEASE_COMMIT" && \
              "$(git rev-parse "refs/tags/$PREDECESSOR_TAG")" == "$PREDECESSOR_RELEASE_OBJECT" ]] || { echo 'Predecessor identity changed before GitHub mutation.' >&2; exit 1; }
            git merge-base --is-ancestor "$PREDECESSOR_RELEASE_COMMIT" "$EXPECTED_TAG_COMMIT" || { echo 'Predecessor ancestry changed before GitHub mutation.' >&2; exit 1; }
            git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source left controller master before GitHub mutation.' >&2; exit 1; }
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$PREDECESSOR_TAG" "$PREDECESSOR_RELEASE_COMMIT" "$PREDECESSOR_RELEASE_OBJECT" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-current-controller-release-order.sh" \
              "$CONTROLLER_TOOL_DIRECTORY/current-controller.json" >/dev/null
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh" \
              "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset.json" \
              "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset-receipt.json" >/dev/null
            [[ "$(git rev-parse origin/master)" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Controller master changed during GitHub source verification.' >&2; exit 1; }
          }
          git diff --quiet -- . || { echo 'Tracked release source changed before GitHub mutation.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Tracked release source changed before GitHub mutation.' >&2; exit 1; }
          temporary="$(mktemp -d)"
          actual_body="$(mktemp)"
          actual_inventory="$(mktemp)"
          release_probe="$(mktemp)"
          trap 'rm -rf -- "$temporary" "$actual_body" "$actual_inventory" "$release_probe"' EXIT
          expected_title="Strata ${RELEASE_TAG#v}"
          shopt -s nullglob
          assets=(build/release/github/*)
          [[ "${#assets[@]}" == "$EXPECTED_GITHUB_ASSET_COUNT" ]] || { echo "GitHub asset inventory differs: ${#assets[@]}." >&2; exit 1; }
          (cd build/release/github && sha256sum --check SHA256SUMS)
          expected="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          verify_release_contract() {
            local expected_draft="$1"
            local require_complete="$2"
            local release_json
            local remote_inventory
            local unexpected
            local snapshot_directory
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease,assets)"
            [[ "$(jq -r '.tagName' <<< "$release_json")" == "$RELEASE_TAG" && "$(jq -r '.name' <<< "$release_json")" == "$expected_title" ]] || { echo 'GitHub Release identity differs.' >&2; exit 1; }
            jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | if contains("\r") then error("lone carriage return") else @base64 end' <<< "$release_json" | base64 --decode > "$actual_body"
            cmp --silent "docs/releases/$RELEASE_TAG.md" "$actual_body" || { echo 'GitHub Release body differs.' >&2; exit 1; }
            [[ "$(jq -r '.isDraft' <<< "$release_json")" == "$expected_draft" && "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]] || { echo 'GitHub Release lifecycle differs.' >&2; exit 1; }
            remote_inventory="$(jq -r '.assets[].name' <<< "$release_json" | sort)"
            unexpected="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$remote_inventory"))"
            [[ -z "$unexpected" ]] || { echo "GitHub Release contains unexpected assets: $unexpected" >&2; exit 1; }
            if [[ "$require_complete" == "true" ]]; then
              [[ "$remote_inventory" == "$expected" ]] || { echo 'GitHub Release asset inventory is incomplete.' >&2; exit 1; }
            fi
            : > "$actual_inventory"
            if [[ -n "$remote_inventory" ]]; then
              printf '%s\n' "$remote_inventory" > "$actual_inventory"
            fi
            snapshot_directory="$(mktemp -d "$temporary/snapshot.XXXXXX")"
            for asset in "${assets[@]}"; do
              local name
              name="$(basename "$asset")"
              if grep --fixed-strings --line-regexp "$name" "$actual_inventory" >/dev/null; then
                gh release download "$RELEASE_TAG" --pattern "$name" --dir "$snapshot_directory"
                cmp --silent "$asset" "$snapshot_directory/$name" || { echo "GitHub asset differs: $name" >&2; exit 1; }
              fi
            done
          }
          release_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 \
            --proto '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$release_probe" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$release_status" == "200" ]]; then
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$draft" == "true" ]]; then
              verify_release_contract true false
            else
              verify_release_contract false true
            fi
          elif [[ "$release_status" == "404" ]]; then
            revalidate_release_source
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$expected_title" --notes-file "docs/releases/$RELEASE_TAG.md"
            draft=true
            verify_release_contract true false
          else
            echo "GitHub Release lookup failed with HTTP $release_status." >&2
            exit 1
          fi
          missing_assets=()
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if grep --fixed-strings --line-regexp "$name" "$actual_inventory" >/dev/null; then
              :
            else
              [[ "$draft" == "true" ]] || { echo "Published GitHub Release is missing $name." >&2; exit 1; }
              missing_assets+=("$asset")
            fi
          done
          if [[ "${#missing_assets[@]}" != "0" ]]; then
            revalidate_release_source
            verify_release_contract true false
            missing_assets=()
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if grep --fixed-strings --line-regexp "$name" "$actual_inventory" >/dev/null; then
                :
              else
                missing_assets+=("$asset")
              fi
            done
            for asset in "${missing_assets[@]}"; do
              gh release upload "$RELEASE_TAG" "$asset"
            done
            verify_release_contract true true
          fi
          if [[ "$draft" == "true" ]]; then
            revalidate_release_source
            verify_release_contract true true
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          verify_release_contract false true
      - name: Submit or observe Modrinth review
