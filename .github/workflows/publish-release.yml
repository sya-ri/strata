            jq -e --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_TAG_COMMIT" --arg controller "$EXPECTED_CONTROLLER_COMMIT" '
              .operation == "observe" and .releaseTag == $tag and .sourceCommit == $commit and
              .controllerCommit == $controller and (.versionCountAfter | type == "number" and . > 0 and . == floor)
            ' \
              build/release/modrinth-controller-receipts/observe.json >/dev/null || { echo 'Modrinth backlog observation receipt differs.' >&2; exit 1; }
          else
            [[ "$PREFLIGHT_BODY_STATE" == 'predecessor' || "$PREFLIGHT_BODY_STATE" == 'current' ]] || { echo 'Unknown Modrinth preflight body state.' >&2; exit 1; }
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseSubmit \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
          fi
          echo '::notice::Dispatch operation=verify after the project is approved. Processing and approved reruns remain read-only.'
      - name: Clean up release controller tools
        if: always() && steps.controller_tools.outputs.directory != ''
        shell: bash
        env:
          CONTROLLER_TOOL_DIRECTORY: ${{ steps.controller_tools.outputs.directory }}
        run: |
          set -euo pipefail
          directory="$CONTROLLER_TOOL_DIRECTORY"
          [[ "$(dirname -- "$directory")" == "${RUNNER_TEMP%/}" && \
            "$(basename -- "$directory")" =~ ^strata-release-controller-tools\.[A-Za-z0-9]{6}$ ]] || {
            echo 'Release controller tool cleanup path differs.' >&2
            exit 1
          }
          [[ ! -L "$directory" ]] || { echo 'Release controller tool directory became a symlink.' >&2; exit 1; }
          if [[ -d "$directory" ]]; then
            chmod u+w -- "$directory"
            rm -rf -- "$directory"
          elif [[ -e "$directory" ]]; then
            echo 'Release controller tool cleanup target is not a directory.' >&2
            exit 1
          fi
          [[ ! -e "$directory" && ! -L "$directory" ]] || { echo 'Release controller tools remained after cleanup.' >&2; exit 1; }

  public_skills:
    if: inputs.operation == 'verify'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      current_tag: ${{ steps.source.outputs.current_tag }}
      current_commit: ${{ steps.source.outputs.current_commit }}
      current_object: ${{ steps.source.outputs.current_object }}
      representative_minecraft_versions: ${{ steps.source.outputs.representative_minecraft_versions }}
      predecessor_tag: ${{ steps.source.outputs.predecessor_tag }}
      predecessor_commit: ${{ steps.source.outputs.predecessor_commit }}
      predecessor_object: ${{ steps.source.outputs.predecessor_object }}
    steps:
      - name: Fetch immutable public Skill sources without credentials
        id: source
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Public Skill verification must be dispatched from master.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "verify $RELEASE_TAG" ]] || { echo 'Public Skill verification request differs.' >&2; exit 1; }
          for forbidden_secret in GH_TOKEN GITHUB_TOKEN MODRINTH_TOKEN SIGNING_KEY SIGNING_PASSWORD ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword GNUPGHOME; do
            [[ -z "${!forbidden_secret:-}" ]] || { echo "Credential reached the isolated public Skill runner: $forbidden_secret" >&2; exit 1; }
          done
          repository="$RUNNER_TEMP/strata-public-skills-repository"
          predecessor_source="$RUNNER_TEMP/strata-public-skill-predecessor"
          current_source="$RUNNER_TEMP/strata-public-skill-current"
          controller_directory="$RUNNER_TEMP/strata-public-skill-controller"
          [[ ! -e "$repository" && ! -e "$predecessor_source" && ! -e "$current_source" && ! -e "$controller_directory" ]] || { echo 'Public Skill source path already exists.' >&2; exit 1; }
          git init "$repository"
          git -C "$repository" remote add origin https://github.com/sya-ri/strata.git
          git -C "$repository" fetch --force --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          [[ "$(git -C "$repository" rev-parse refs/remotes/origin/master)" == "$GITHUB_SHA" ]] || { echo 'Public Skill controller is not exact master.' >&2; exit 1; }
          mkdir "$controller_directory"
          record="$(git -C "$repository" --no-replace-objects ls-tree --full-tree "$GITHUB_SHA" -- release/verify-controller-tools.sh)"
          read -r mode object_type blob verified_path <<< "$record"
          [[ "$record" != *$'\n'* && "$mode" == "100644" && "$object_type" == "blob" && \
            "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "release/verify-controller-tools.sh" ]] || { echo 'Public Skill controller guard differs.' >&2; exit 1; }
          git -C "$repository" --no-replace-objects cat-file blob "$blob" | \
            (cd "$repository" && bash -s -- materialize "$GITHUB_SHA" "$controller_directory")
          metadata="$controller_directory/current-controller.json"
          current_tag="$(portable_jq -er '.current.tag' "$metadata")"
          current_commit="$(portable_jq -er '.current.commit' "$metadata")"
          current_object="$(portable_jq -er '.current.tagObject' "$metadata")"
          representative_minecraft_versions="$(portable_jq -cer '.current.representativeMinecraftVersions' "$metadata")"
          predecessor_tag="$(portable_jq -er '.predecessor.tag' "$metadata")"
          predecessor_commit="$(portable_jq -er '.predecessor.commit' "$metadata")"
          predecessor_object="$(portable_jq -er '.predecessor.tagObject' "$metadata")"
          [[ "$RELEASE_TAG" == "$current_tag" ]] || { echo 'Requested public Skill tag differs from current-controller metadata.' >&2; exit 1; }
          [[ "$(printf '%s\n' "${predecessor_tag#v}" "${current_tag#v}" | sort -V | head -n 1)" == "${predecessor_tag#v}" && \
            "$predecessor_tag" != "$current_tag" ]] || { echo 'Public Skill predecessor semantic ordering differs.' >&2; exit 1; }
          git -C "$repository" fetch --force --no-tags origin '+refs/tags/*:refs/tags/*'
          [[ "$(git -C "$repository" rev-parse --verify "refs/tags/$predecessor_tag^{commit}")" == "$predecessor_commit" && \
            "$(git -C "$repository" rev-parse "refs/tags/$predecessor_tag")" == "$predecessor_object" ]] || { echo 'Public predecessor Skill identity differs.' >&2; exit 1; }
          [[ "$(git -C "$repository" rev-parse --verify "refs/tags/$current_tag^{commit}")" == "$current_commit" && \
            "$(git -C "$repository" rev-parse "refs/tags/$current_tag")" == "$current_object" ]] || { echo 'Public current Skill identity differs.' >&2; exit 1; }
          [[ "$(git -C "$repository" cat-file -t "refs/tags/$predecessor_tag")" == "tag" && \
            "$(git -C "$repository" cat-file -t "refs/tags/$current_tag")" == "tag" ]] || { echo 'A public Skill release tag is not annotated.' >&2; exit 1; }
          git -C "$repository" --no-replace-objects cat-file blob "$blob" | \
            (cd "$repository" && bash -s -- verify "$GITHUB_SHA" "$controller_directory")
          bash "$controller_directory/verify-current-controller-release-order.sh" "$metadata" "$repository" >/dev/null
          git -C "$repository" merge-base --is-ancestor "$predecessor_commit" "$current_commit" || { echo 'Public Skill predecessor ancestry differs.' >&2; exit 1; }
          git -C "$repository" merge-base --is-ancestor "$current_commit" refs/remotes/origin/master || { echo 'Public current Skill source left master.' >&2; exit 1; }
          for identity in "$predecessor_tag|$predecessor_commit" "$current_tag|$current_commit"; do
            tag="${identity%%|*}"
            commit="${identity#*|}"
            [[ "$(git -C "$repository" show "${commit}:build.gradle.kts" | sed -nE 's/^version = "([^"]+)"$/\1/p')" == "${tag#v}" ]] || { echo "Public Skill root version differs for $tag." >&2; exit 1; }
          done
          while IFS= read -r minecraft_version; do
            for project_kind in runtime integration; do
              project_path="$project_kind/minecraft-fabric-$minecraft_version/build.gradle.kts"
              record="$(git -C "$repository" --no-replace-objects ls-tree --full-tree "$current_commit" -- "$project_path")"
              [[ -n "$record" && "$record" != *$'\n'* ]] || { echo "Public representative Minecraft project is missing or ambiguous: $project_path" >&2; exit 1; }
              read -r mode object_type project_blob verified_path <<< "$record"
              [[ "$mode" == '100644' && "$object_type" == 'blob' && "$project_blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$project_path" ]] || { echo "Public representative Minecraft project is not a regular blob: $project_path" >&2; exit 1; }
            done
          done < <(portable_jq -er '.current.representativeMinecraftVersions[]' "$metadata")
          git -C "$repository" worktree add --detach "$predecessor_source" "$predecessor_commit"
          git -C "$repository" worktree add --detach "$current_source" "$current_commit"
          chmod -R u+w -- "$controller_directory"
          rm -rf -- "$controller_directory"
          {
            echo "PUBLIC_SKILL_REPOSITORY=$repository"
            echo "PUBLIC_SKILL_PREDECESSOR_SOURCE=$predecessor_source"
            echo "PUBLIC_SKILL_CURRENT_SOURCE=$current_source"
            echo "PUBLIC_SKILL_PREDECESSOR_TAG=$predecessor_tag"
            echo "PUBLIC_SKILL_CURRENT_TAG=$current_tag"
            echo "PUBLIC_SKILL_PREDECESSOR_OBJECT=$predecessor_object"
            echo "PUBLIC_SKILL_CURRENT_OBJECT=$current_object"
            echo "PUBLIC_SKILL_REPRESENTATIVE_MINECRAFT_VERSIONS=$representative_minecraft_versions"
          } >> "$GITHUB_ENV"
          {
            echo "current_tag=$current_tag"
            echo "current_commit=$current_commit"
            echo "current_object=$current_object"
            echo "representative_minecraft_versions=$representative_minecraft_versions"
            echo "predecessor_tag=$predecessor_tag"
            echo "predecessor_commit=$predecessor_commit"
            echo "predecessor_object=$predecessor_object"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node without release credentials
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify current and predecessor public Skills on the isolated runner
        shell: bash
        run: |
          set -euo pipefail
          for forbidden_secret in GH_TOKEN GITHUB_TOKEN MODRINTH_TOKEN SIGNING_KEY SIGNING_PASSWORD ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword GNUPGHOME; do
            [[ -z "${!forbidden_secret:-}" ]] || { echo "Credential reached public Skill execution: $forbidden_secret" >&2; exit 1; }
          done
          if ! gh skill --help >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --only-upgrade --yes gh
          fi
          tags=("$PUBLIC_SKILL_PREDECESSOR_TAG" "$PUBLIC_SKILL_CURRENT_TAG")
          sources=("$PUBLIC_SKILL_PREDECESSOR_SOURCE" "$PUBLIC_SKILL_CURRENT_SOURCE")
          objects=("$PUBLIC_SKILL_PREDECESSOR_OBJECT" "$PUBLIC_SKILL_CURRENT_OBJECT")
          for index in "${!tags[@]}"; do
            tag="${tags[$index]}"
            expected_source="${sources[$index]}"
            expected_object="${objects[$index]}"
            remote_object="$(git ls-remote --refs https://github.com/sya-ri/strata.git "refs/tags/$tag" | awk '{print $1}')"
            [[ "$remote_object" == "$expected_object" ]] || { echo "Public Skill tag changed before execution: $tag" >&2; exit 1; }
            gh skill preview sya-ri/strata "skills/strata@$tag" >/dev/null
            install_root="$(mktemp -d "$RUNNER_TEMP/strata-public-skill-install.XXXXXX")"
            (
              cd "$install_root"
              npx --yes skills add "sya-ri/strata@$tag" --skill strata --agent codex --yes --copy
            )
            mapfile -d '' installed < <(find "$install_root" -type f -name SKILL.md -print0)
            [[ "${#installed[@]}" == "1" ]] || { echo "Skills CLI did not install exactly one Skill for $tag." >&2; exit 1; }
            diff --recursive --brief "$expected_source/skills/strata" "$(dirname "${installed[0]}")"
            rm -rf -- "$install_root"
            [[ "$(git ls-remote --refs https://github.com/sya-ri/strata.git "refs/tags/$tag" | awk '{print $1}')" == "$expected_object" ]] || { echo "Public Skill tag changed during execution: $tag" >&2; exit 1; }
          done

  verify:
    if: inputs.operation == 'verify'
    needs: public_skills
    permissions:
      actions: read
      contents: read
      deployments: read
    environment:
      name: release
      url: https://modrinth.com/mod/strata-ui
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.public_skills.outputs.current_commit }}
      - name: Validate final verification source and Pages provenance
        id: controller_tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CURRENT_TAG: ${{ needs.public_skills.outputs.current_tag }}
          EXPECTED_CURRENT_COMMIT: ${{ needs.public_skills.outputs.current_commit }}
          EXPECTED_CURRENT_OBJECT: ${{ needs.public_skills.outputs.current_object }}
          EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS: ${{ needs.public_skills.outputs.representative_minecraft_versions }}
          EXPECTED_PREDECESSOR_TAG: ${{ needs.public_skills.outputs.predecessor_tag }}
          EXPECTED_PREDECESSOR_COMMIT: ${{ needs.public_skills.outputs.predecessor_commit }}
          EXPECTED_PREDECESSOR_OBJECT: ${{ needs.public_skills.outputs.predecessor_object }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Verification must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "$EXPECTED_CURRENT_TAG" && "$CONFIRMATION" == "verify $RELEASE_TAG" ]] || { echo 'Final verification request differs.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/tags/*:refs/tags/*'
          checked_commit="$(git rev-parse HEAD)"
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Verification controller is not the exact master head.' >&2; exit 1; }
          [[ "$checked_commit" == "$EXPECTED_CURRENT_COMMIT" && \
            "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_CURRENT_COMMIT" ]] || { echo 'Checked-out current release identity differs.' >&2; exit 1; }
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          [[ "$tag_object" == "$EXPECTED_CURRENT_OBJECT" ]] || { echo 'Current tag object differs from public Skill preflight.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$EXPECTED_PREDECESSOR_TAG^{commit}")" == "$EXPECTED_PREDECESSOR_COMMIT" && \
            "$(git rev-parse "refs/tags/$EXPECTED_PREDECESSOR_TAG")" == "$EXPECTED_PREDECESSOR_OBJECT" ]] || { echo 'Predecessor identity differs from public Skill preflight.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_PREDECESSOR_COMMIT" "$EXPECTED_CURRENT_COMMIT" || { echo 'Predecessor is not an ancestor of current release.' >&2; exit 1; }
          git merge-base --is-ancestor "$checked_commit" origin/master || { echo 'Release tag is no longer contained in master.' >&2; exit 1; }
          run_controller_tool_guard() {
            local operation="$1"
            local controller_commit="$2"
            local tool_directory="$3"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git --no-replace-objects ls-tree --full-tree "$controller_commit" -- release/verify-controller-tools.sh)"
            [[ "$record" != *$'\n'* ]] || { echo 'The controller tool guard tree entry is ambiguous.' >&2; exit 1; }
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "release/verify-controller-tools.sh" ]] || {
              echo 'The controller tool guard is not the expected regular Git blob.' >&2
              exit 1
            }
            git --no-replace-objects cat-file blob "$blob" | \
              bash -s -- "$operation" "$controller_commit" "$tool_directory"
          }
          controller_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-verify-controller-tools.XXXXXX")"
          [[ -d "$controller_tool_directory" && ! -L "$controller_tool_directory" ]] || {
            echo 'Failed to create a regular verification controller tool directory.' >&2
            exit 1
          }
          echo "CONTROLLER_TOOL_DIRECTORY=$controller_tool_directory" >> "$GITHUB_ENV"
          echo "directory=$controller_tool_directory" >> "$GITHUB_OUTPUT"
          controller_ruleset_verifier="$controller_tool_directory/verify-github-tag-ruleset.sh"
          controller_ruleset_contract="$controller_tool_directory/github-release-tag-ruleset.json"
          controller_ruleset_receipt="$controller_tool_directory/github-release-tag-ruleset-receipt.json"
          controller_pages_verifier="$controller_tool_directory/verify-pages-deployment-source.sh"
          controller_pages_waiter="$controller_tool_directory/wait-for-pages-source-receipt.sh"
          run_controller_tool_guard materialize "$GITHUB_SHA" "$controller_tool_directory"
          jq -e \
            --arg current_tag "$EXPECTED_CURRENT_TAG" --arg current_commit "$EXPECTED_CURRENT_COMMIT" --arg current_object "$EXPECTED_CURRENT_OBJECT" \
            --argjson representative_versions "$EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS" \
            --arg predecessor_tag "$EXPECTED_PREDECESSOR_TAG" --arg predecessor_commit "$EXPECTED_PREDECESSOR_COMMIT" --arg predecessor_object "$EXPECTED_PREDECESSOR_OBJECT" '
              .current == {tag: $current_tag, commit: $current_commit, tagObject: $current_object, representativeMinecraftVersions: $representative_versions} and
              .predecessor == {tag: $predecessor_tag, commit: $predecessor_commit, tagObject: $predecessor_object}
            ' "$controller_tool_directory/current-controller.json" >/dev/null || { echo 'Final controller identities differ from the isolated public Skill outputs.' >&2; exit 1; }
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          bash "$controller_tool_directory/verify-release-tag.sh" "$RELEASE_TAG" "$checked_commit" "$tag_object" >/dev/null
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          bash "$controller_tool_directory/verify-release-tag.sh" "$EXPECTED_PREDECESSOR_TAG" "$EXPECTED_PREDECESSOR_COMMIT" "$EXPECTED_PREDECESSOR_OBJECT" >/dev/null
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          bash "$controller_tool_directory/verify-current-controller-release-order.sh" \
            "$controller_tool_directory/current-controller.json" >/dev/null
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          bash "$controller_ruleset_verifier" "$controller_ruleset_contract" "$controller_ruleset_receipt" >/dev/null
          for identity in \
            "$EXPECTED_CURRENT_TAG|$EXPECTED_CURRENT_COMMIT" \
            "$EXPECTED_PREDECESSOR_TAG|$EXPECTED_PREDECESSOR_COMMIT"; do
            tag="${identity%%|*}"
            commit="${identity#*|}"
            [[ "$(git show "${commit}:build.gradle.kts" | sed -nE 's/^version = "([^"]+)"$/\1/p')" == "${tag#v}" ]] || { echo "Root version differs for $tag." >&2; exit 1; }
          done
          while IFS= read -r minecraft_version; do
            for project_kind in runtime integration; do
              project_path="$project_kind/minecraft-fabric-$minecraft_version/build.gradle.kts"
              record="$(git --no-replace-objects ls-tree --full-tree "$checked_commit" -- "$project_path")"
              [[ -n "$record" && "$record" != *$'\n'* ]] || { echo "Final representative Minecraft project is missing or ambiguous: $project_path" >&2; exit 1; }
              read -r mode object_type project_blob verified_path <<< "$record"
              [[ "$mode" == '100644' && "$object_type" == 'blob' && "$project_blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$project_path" ]] || { echo "Final representative Minecraft project is not a regular blob: $project_path" >&2; exit 1; }
            done
          done < <(portable_jq -er '.[]' <<< "$EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS")
          mapfile -t required_commits < <(printf '%s\n' "$GITHUB_SHA" "$checked_commit" "$EXPECTED_PREDECESSOR_COMMIT" | sort --unique)
          for workflow in jvm.yml qodana.yml; do
            for required_commit in "${required_commits[@]}"; do
              runs="$(gh run list --workflow "$workflow" --commit "$required_commit" --status completed --limit 100 --json conclusion,event,headBranch,headSha)"
              jq -e --arg commit "$required_commit" 'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $commit)' <<< "$runs" >/dev/null || { echo "No successful $workflow run exists for $required_commit." >&2; exit 1; }
            done
          done
          controller_pages_run_id="$(gh run list --workflow pages.yml --commit "$GITHUB_SHA" --event push --status completed --limit 100 --json conclusion,databaseId,event,headBranch,headSha | jq -er --arg sha "$GITHUB_SHA" '[.[] | select(.conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $sha)] | select(length == 1) | .[0].databaseId | tostring')"
          release_pages_run_id="$controller_pages_run_id"
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          pages_record="$(bash "$controller_pages_verifier" \
            "$release_pages_run_id" "$RELEASE_TAG" "$checked_commit" \
              "$controller_pages_run_id" "$GITHUB_SHA")"
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          bash "$controller_pages_waiter" "$RELEASE_TAG" "$checked_commit" "$GITHUB_SHA"
          run_controller_tool_guard verify "$GITHUB_SHA" "$controller_tool_directory"
          [[ "$(bash "$controller_pages_verifier" \
            "$release_pages_run_id" "$RELEASE_TAG" "$checked_commit" \
            "$controller_pages_run_id" "$GITHUB_SHA")" == "$pages_record" ]] || { echo 'Pages provenance changed during final verification.' >&2; exit 1; }
          {
            echo "RELEASE_SOURCE_COMMIT=$checked_commit"
            echo "RELEASE_TAG_OBJECT=$tag_object"
            echo "RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS=$EXPECTED_REPRESENTATIVE_MINECRAFT_VERSIONS"
            echo "PREDECESSOR_TAG=$EXPECTED_PREDECESSOR_TAG"
            echo "PREDECESSOR_RELEASE_COMMIT=$EXPECTED_PREDECESSOR_COMMIT"
            echo "PREDECESSOR_RELEASE_OBJECT=$EXPECTED_PREDECESSOR_OBJECT"
            echo "PAGES_PROVENANCE_RECORD=$pages_record"
          } >> "$GITHUB_ENV"
      - name: Resolve Java toolchains from the release catalog
        id: java
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects cat-file blob "$GITHUB_SHA:release/verify-controller-tools.sh" | \
            bash -s -- verify "$GITHUB_SHA" "$CONTROLLER_TOOL_DIRECTORY"
          {
            echo 'versions<<STRATA_JAVA_TOOLCHAINS'
            bash "$CONTROLLER_TOOL_DIRECTORY/list-java-toolchains.sh" gradle/libs.versions.toml
            echo 'STRATA_JAVA_TOOLCHAINS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.versions }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Resolve final verification credentials
        id: modrinth
        shell: bash
        env:
          REQUESTED_PROJECT_ID: ${{ inputs.modrinth_project_id }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          tracked="$(jq -r '.projectId // empty' release/modrinth-project.json)"
          [[ -n "$tracked" && (-z "$REQUESTED_PROJECT_ID" || "$REQUESTED_PROJECT_ID" == "$tracked") ]] || { echo 'Modrinth project ID differs.' >&2; exit 1; }
          [[ -n "$MODRINTH_TOKEN" && -n "$SIGNING_KEY" && -n "$SIGNING_PASSWORD" ]] || { echo 'Modrinth or signing credentials are missing.' >&2; exit 1; }
          [[ -n "$MAVEN_CENTRAL_USERNAME" && -n "$MAVEN_CENTRAL_PASSWORD" ]] || { echo 'Maven Central credentials are missing.' >&2; exit 1; }
          echo "project_id=$tracked" >> "$GITHUB_OUTPUT"
      - name: Rebuild and verify Central release evidence
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          strata_jq_path="$(type -P jq || true)"
          strata_od_path="$(type -P od || true)"
          strata_tr_path="$(type -P tr || true)"
          if [[ "$strata_jq_path" == /* && -x "$strata_jq_path" && \
            "$strata_od_path" == /* && -x "$strata_od_path" && \
            "$strata_tr_path" == /* && -x "$strata_tr_path" ]]; then
            :
          else
            echo 'Portable jq initialization requires absolute executable jq, od, and tr paths.' >&2
            exit 1
          fi
          readonly strata_jq_path strata_od_path strata_tr_path
          strata_jq_binary_options=()
          if "$strata_jq_path" --binary -n 'null' >/dev/null 2>&1; then
            strata_jq_binary_options=(--binary)
          fi
          readonly -a strata_jq_binary_options
          strata_jq_probe_hex=''
          if strata_jq_probe_hex="$(
            "$strata_jq_path" "${strata_jq_binary_options[@]}" -nr --arg x x "\$x" |
              "$strata_od_path" -An -tx1 |
              "$strata_tr_path" -d '[:space:]'
          )"; then
            :
          else
            echo 'jq output-mode byte probing failed.' >&2
            exit 1
          fi
          if [[ "$strata_jq_probe_hex" == '780a' ]]; then
            unset strata_jq_probe_hex
          else
            echo 'jq output mode does not produce exact LF-delimited bytes.' >&2
            exit 1
          fi
          portable_jq() {
            "$strata_jq_path" "${strata_jq_binary_options[@]}" "$@"
          }
          readonly -f portable_jq
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache verifyPublishedConsumer modrinthReleaseManifest mavenCentralPortalVerify \
            -Pstrata.sourceRevision="$RELEASE_TAG" -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" -Pstrata.modrinthProjectId="$PROJECT_ID"
          maven_inventory=''
          for candidate in build/release/maven-coordinates.txt release/maven-coordinates.txt; do
            if [[ -f "$candidate" && ! -L "$candidate" ]]; then
              [[ -z "$maven_inventory" ]] || { echo 'Multiple final Maven artifact inventories are present.' >&2; exit 1; }
              maven_inventory="$candidate"
            fi
          done
          [[ -n "$maven_inventory" ]] || { echo 'No final Maven artifact inventory was generated or supplied by the immutable release.' >&2; exit 1; }
          coordinate_count="$(grep -cve '^[[:space:]]*$' "$maven_inventory")"
          artifact_count="$(jq -er '.artifacts | length | select(. > 0)' build/release/modrinth/manifest.json)"
          publication_suffixes=(.pom .module .jar -sources.jar -javadoc.jar)
          signed_content_variants=(base signature)
          checksum_suffixes=(md5 sha1 sha256 sha512)
          github_artifact_variants=(jar signature)
          github_inventory_assets=(SHA256SUMS)
          expected_content_count=$((coordinate_count * ${#publication_suffixes[@]} * ${#signed_content_variants[@]}))
          expected_checksum_count=$((coordinate_count * ${#publication_suffixes[@]} * ${#checksum_suffixes[@]}))
          expected_signature_count=$((coordinate_count * ${#publication_suffixes[@]}))
          expected_asset_count=$((artifact_count * ${#github_artifact_variants[@]} + ${#github_inventory_assets[@]}))
          jq -e --argjson content "$expected_content_count" --argjson checksums "$expected_checksum_count" '
            .state == "exact" and .deploymentState == "PUBLISHED" and
            .verifiedContentFileCount == $content and .verifiedChecksumCount == $checksums
          ' build/release/maven-central/portal-verify.json >/dev/null
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache mavenCentralReleaseVerify githubReleaseBundle \
            -Pstrata.sourceRevision="$RELEASE_TAG" -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" -Pstrata.modrinthProjectId="$PROJECT_ID"
          jq -e --argjson coordinates "$coordinate_count" --argjson content "$expected_content_count" --argjson checksums "$expected_checksum_count" '
            .state == "exact" and .coordinateCount == $coordinates and
            .verifiedFileCount == $content and .verifiedChecksumCount == $checksums
          ' build/release/maven-central/verify.json >/dev/null
          jq -e --arg version "${RELEASE_TAG#v}" --argjson artifacts "$artifact_count" '
            .releaseVersion == $version and (.artifacts | length) == $artifacts
          ' build/release/modrinth/manifest.json >/dev/null
          mapfile -t representative_minecraft_versions < <(portable_jq -er '.[]' <<< "$RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS")
          for minecraft_version in "${representative_minecraft_versions[@]}"; do
            artifact="strata-runtime-minecraft-fabric-$minecraft_version"
            inventory_matches="$(awk -F: -v artifact="$artifact" '$2 == artifact { count++ } END { print count + 0 }' "$maven_inventory")"
            [[ "$inventory_matches" == '1' ]] || { echo "Final representative Minecraft version $minecraft_version does not map to one Maven artifact." >&2; exit 1; }
            jq -e --arg minecraft_version "$minecraft_version" \
              '[.artifacts[] | select(.gameVersion == $minecraft_version)] | length == 1' \
              build/release/modrinth/manifest.json >/dev/null || { echo "Final representative Minecraft version $minecraft_version does not map to one manifest artifact." >&2; exit 1; }
          done
          {
            echo "RELEASE_COORDINATE_COUNT=$coordinate_count"
            echo "RELEASE_ARTIFACT_COUNT=$artifact_count"
            echo "EXPECTED_CENTRAL_CONTENT_COUNT=$expected_content_count"
            echo "EXPECTED_CENTRAL_CHECKSUM_COUNT=$expected_checksum_count"
            echo "EXPECTED_CENTRAL_SIGNATURE_COUNT=$expected_signature_count"
            echo "EXPECTED_GITHUB_ASSET_COUNT=$expected_asset_count"
          } >> "$GITHUB_ENV"
      - name: Verify GitHub release assets and all Central signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          downloads="$(mktemp -d)"
          actual_body="$(mktemp)"
          key_file="$(mktemp)"
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf -- "$downloads" "$actual_body" "$key_file" "$gnupg_home"' EXIT
          chmod 600 "$key_file"
          chmod 700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf '%s' "$SIGNING_KEY" > "$key_file"
          if ! gpg --batch --quiet --import "$key_file"; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$key_file"
            gpg --batch --quiet --import "$key_file"
          fi
          verified=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            verified=$((verified + 1))
          done < <(find build/release/maven-central/evidence -type f -name '*.asc' -print0)
          [[ "$verified" == "$EXPECTED_CENTRAL_SIGNATURE_COUNT" ]] || { echo "Central signature inventory differs: $verified." >&2; exit 1; }
          shopt -s nullglob
          assets=(build/release/github/*)
          [[ "${#assets[@]}" == "$EXPECTED_GITHUB_ASSET_COUNT" ]] || { echo 'Canonical GitHub asset count differs.' >&2; exit 1; }
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease)"
          [[ "$(jq -r '.tagName' <<< "$release_json")" == "$RELEASE_TAG" && "$(jq -r '.name' <<< "$release_json")" == "Strata ${RELEASE_TAG#v}" ]] || { echo 'GitHub Release identity differs.' >&2; exit 1; }
          [[ "$(jq -r '.isDraft' <<< "$release_json")" == "false" && "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]] || { echo 'GitHub Release is not published stable.' >&2; exit 1; }
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | @base64' <<< "$release_json" | base64 --decode > "$actual_body"
          cmp --silent "docs/releases/$RELEASE_TAG.md" "$actual_body" || { echo 'GitHub Release body differs.' >&2; exit 1; }
          expected="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected" ]] || { echo 'GitHub Release asset inventory differs.' >&2; exit 1; }
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$downloads"
            cmp --silent "$asset" "$downloads/$name" || { echo "GitHub asset differs: $name" >&2; exit 1; }
          done
          (cd "$downloads" && sha256sum --check SHA256SUMS)
          for jar in "$downloads"/*.jar; do
            gpg --batch --verify "$jar.asc" "$jar"
          done
      - name: Verify public Pages and tagged Skill source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$GITHUB_SHA:release/verify-controller-tools.sh" | \
              bash -s -- verify "$GITHUB_SHA" "$CONTROLLER_TOOL_DIRECTORY"
          }
          pages="$(mktemp)"
          inventory="$(mktemp)"
          revision="$(mktemp)"
          skill="$(mktemp)"
          trap 'rm -f -- "$pages" "$inventory" "$revision" "$skill"' EXIT
          base="https://gh.s7a.dev/strata/releases/${RELEASE_TAG#v}"
          curl --fail --silent --show-error --location --proto '=https' "$base/pages-public-urls.txt" --output "$inventory"
          LC_ALL=C sort --check --unique "$inventory"
          for required in / /index.html /guide/ /guide/components.md /source-receipt.json /source-revision.txt; do
            grep --fixed-strings --line-regexp "$required" "$inventory" >/dev/null
          done
          grep --extended-regexp --line-regexp '/guide/components/[^/]+\.png' "$inventory" >/dev/null
          while IFS= read -r public_path; do
            [[ "$public_path" == /* ]] || { echo "Invalid Pages path: $public_path" >&2; exit 1; }
            curl --fail --silent --show-error --location --proto '=https' "$base$public_path" --output "$pages"
            [[ -s "$pages" ]] || { echo "Empty Pages target: $public_path" >&2; exit 1; }
          done < "$inventory"
          curl --fail --silent --show-error --location --proto '=https' "$base/source-revision.txt" --output "$revision"
          [[ "$(cat "$revision")" == "$RELEASE_TAG" ]] || { echo 'Pages source revision differs.' >&2; exit 1; }
          read -r release_pages_run_id _ _ controller_pages_run_id _ _ <<< "$PAGES_PROVENANCE_RECORD"
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/wait-for-pages-source-receipt.sh" \
            "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$GITHUB_SHA"
          verify_controller_tools
          [[ "$(bash "$CONTROLLER_TOOL_DIRECTORY/verify-pages-deployment-source.sh" \
            "$release_pages_run_id" "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" \
            "$controller_pages_run_id" "$GITHUB_SHA")" == "$PAGES_PROVENANCE_RECORD" ]] || { echo 'Public Pages provenance changed.' >&2; exit 1; }
          curl --fail --silent --show-error --location --proto '=https' "https://raw.githubusercontent.com/sya-ri/strata/$RELEASE_TAG/skills/strata/SKILL.md" --output "$skill"
          cmp --silent skills/strata/SKILL.md "$skill" || { echo 'Public Skill source differs.' >&2; exit 1; }
      - name: Verify complete predecessor release before Modrinth body finalization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$GITHUB_SHA:release/verify-controller-tools.sh" | \
              bash -s -- verify "$GITHUB_SHA" "$CONTROLLER_TOOL_DIRECTORY"
          }
          previous_tag="$PREDECESSOR_TAG"
          expected_previous_commit="$PREDECESSOR_RELEASE_COMMIT"
          expected_previous_object="$PREDECESSOR_RELEASE_OBJECT"
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$previous_tag:refs/tags/$previous_tag"
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Verification controller changed before predecessor verification.' >&2; exit 1; }
          previous_commit="$(git rev-parse --verify "refs/tags/$previous_tag^{commit}")"
          previous_object="$(git rev-parse "refs/tags/$previous_tag")"
          [[ "$previous_commit" == "$expected_previous_commit" ]] || { echo 'The predecessor tag does not point to the frozen release commit.' >&2; exit 1; }
          [[ "$previous_object" == "$expected_previous_object" ]] || { echo 'The predecessor tag object is not the frozen annotated tag object.' >&2; exit 1; }
          git merge-base --is-ancestor "$previous_commit" "$RELEASE_SOURCE_COMMIT" || { echo 'The predecessor release is not an ancestor of current.' >&2; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SOURCE_COMMIT" origin/master || { echo 'The current release left controller master.' >&2; exit 1; }
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$previous_tag" "$previous_commit" "$previous_object" >/dev/null
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh" \
            "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset.json" \
            "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset-receipt.json" >/dev/null
          for workflow in jvm.yml qodana.yml; do
            runs="$(gh run list --workflow "$workflow" --commit "$previous_commit" --status completed --limit 100 \
              --json conclusion,event,headBranch,headSha)"
            jq -e --arg commit "$previous_commit" \
              'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $commit)' \
              <<< "$runs" >/dev/null || { echo "No successful predecessor $workflow run exists for $previous_commit." >&2; exit 1; }
          done

          project_json="$(mktemp)"
          remote_body="$(mktemp)"
          current_body="$(mktemp)"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 \
            --proto '=https' --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID" --output "$project_json"
          jq -e --arg project_id "$PROJECT_ID" \
            '.id == $project_id and .slug == "strata-ui" and .project_type == "mod" and .status == "approved"' \
            "$project_json" >/dev/null || { echo 'Modrinth project identity or approval state differs before predecessor verification.' >&2; exit 1; }
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' \
            "$project_json" > "$remote_body"
          jq --null-input --rawfile body docs/modrinth-project.md --raw-output --join-output \
            '$body | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' > "$current_body"
          remote_body_sha256="$(sha256sum "$remote_body" | cut -d ' ' -f 1)"
          predecessor_body_sha256="$(jq -er '.previousBodySha256' release/modrinth-project.json)"
          current_body_sha256="$(sha256sum "$current_body" | cut -d ' ' -f 1)"
          case "$remote_body_sha256" in
            "$predecessor_body_sha256") modrinth_body_state=predecessor ;;
            "$current_body_sha256") modrinth_body_state=current ;;
            *) echo 'Remote Modrinth body is neither the tracked predecessor nor exact current body.' >&2; exit 1 ;;
          esac

          predecessor_temporary="$(mktemp -d "$RUNNER_TEMP/strata-predecessor-public-evidence.XXXXXX")"
          worktree="$RUNNER_TEMP/strata-predecessor-verification"
          [[ ! -e "$worktree" && ! -L "$worktree" ]] || { echo 'Predecessor worktree path already exists.' >&2; exit 1; }
          cleanup() {
            git worktree remove --force "$worktree" >/dev/null 2>&1 || true
            rm -rf -- "$predecessor_temporary"
            rm -f -- "$project_json" "$remote_body" "$current_body"
          }
          trap cleanup EXIT INT TERM
          git worktree add --detach "$worktree" "$previous_commit"
          (
            cd "$worktree"
            [[ "$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)" == "${previous_tag#v}" ]] || { echo 'Predecessor root version differs.' >&2; exit 1; }
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache verifyPublishedConsumer modrinthReleaseManifest \
              -Pstrata.sourceRevision="$previous_tag" \
              -Pstrata.sourceCommit="$previous_commit" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
            predecessor_artifact_count="$(jq -er '.artifacts | length | select(. > 0)' build/release/modrinth/manifest.json)"
            jq -e --arg version "${previous_tag#v}" --argjson artifacts "$predecessor_artifact_count" \
              '.releaseVersion == $version and (.artifacts | length) == $artifacts' \
              build/release/modrinth/manifest.json >/dev/null || { echo 'Predecessor Modrinth manifest inventory differs.' >&2; exit 1; }
            generated_body="$predecessor_temporary/generated-body"
            jq --raw-output --join-output '.project.body | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' \
              build/release/modrinth/manifest.json > "$generated_body"
            [[ "$(sha256sum "$generated_body" | cut -d ' ' -f 1)" == "$predecessor_body_sha256" ]] || { echo 'The immutable predecessor manifest does not encode the tracked predecessor body.' >&2; exit 1; }
            if [[ "$modrinth_body_state" == "current" ]]; then
              patched_manifest="$predecessor_temporary/current-body-manifest.json"
              manifest_contract_before="$(jq -cS 'del(.project.body)' build/release/modrinth/manifest.json | sha256sum | cut -d ' ' -f 1)"
              jq --rawfile body "$current_body" '.project.body = $body' \
                build/release/modrinth/manifest.json > "$patched_manifest"
              cp "$patched_manifest" build/release/modrinth/manifest.json
              [[ "$(jq -cS 'del(.project.body)' build/release/modrinth/manifest.json | sha256sum | cut -d ' ' -f 1)" == "$manifest_contract_before" ]] || { echo 'Recovery changed the predecessor manifest outside its project body.' >&2; exit 1; }
              jq --raw-output --join-output '.project.body | gsub("\r\n"; "\n") | sub("[[:space:]]+$"; "") + "\n"' \
                build/release/modrinth/manifest.json > "$generated_body"
              [[ "$(sha256sum "$generated_body" | cut -d ' ' -f 1)" == "$current_body_sha256" ]] || { echo 'The recovery manifest does not encode the exact current body.' >&2; exit 1; }
            fi
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseVerify \
              -x modrinthReleaseManifest -x verifyPublishedConsumer \
              -Pstrata.sourceRevision="$previous_tag" \
              -Pstrata.sourceCommit="$previous_commit" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
            jq -e --argjson artifacts "$predecessor_artifact_count" '.operation == "verify" and .projectStatus == "approved" and (.absent | length) == 0 and (.listed | length) == $artifacts' \
              build/release/modrinth-receipts/verify.json >/dev/null

            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
              mavenCentralPortalVerify mavenCentralReleaseVerify githubReleaseBundle \
              -Pstrata.sourceRevision="$previous_tag" \
              -Pstrata.sourceCommit="$previous_commit" \
              -Pstrata.modrinthProjectId="$PROJECT_ID"
            predecessor_maven_inventory=''
            for candidate in build/release/maven-coordinates.txt release/maven-coordinates.txt; do
              if [[ -f "$candidate" && ! -L "$candidate" ]]; then
                [[ -z "$predecessor_maven_inventory" ]] || { echo 'Multiple predecessor Maven artifact inventories are present.' >&2; exit 1; }
                predecessor_maven_inventory="$candidate"
              fi
            done
            [[ -n "$predecessor_maven_inventory" ]] || { echo 'No predecessor Maven artifact inventory was generated or supplied by the immutable release.' >&2; exit 1; }
            predecessor_coordinate_count="$(grep -cve '^[[:space:]]*$' "$predecessor_maven_inventory")"
            publication_suffixes=(.pom .module .jar -sources.jar -javadoc.jar)
            signed_content_variants=(base signature)
            checksum_suffixes=(md5 sha1 sha256 sha512)
            github_artifact_variants=(jar signature)
            github_inventory_assets=(SHA256SUMS)
            predecessor_content_count=$((predecessor_coordinate_count * ${#publication_suffixes[@]} * ${#signed_content_variants[@]}))
            predecessor_checksum_count=$((predecessor_coordinate_count * ${#publication_suffixes[@]} * ${#checksum_suffixes[@]}))
            predecessor_signature_count=$((predecessor_coordinate_count * ${#publication_suffixes[@]}))
            predecessor_asset_count=$((predecessor_artifact_count * ${#github_artifact_variants[@]} + ${#github_inventory_assets[@]}))
            jq -e --argjson content "$predecessor_content_count" --argjson checksums "$predecessor_checksum_count" \
              '.state == "exact" and .deploymentState == "PUBLISHED" and .verifiedContentFileCount == $content and .verifiedChecksumCount == $checksums' \
              build/release/maven-central/portal-verify.json >/dev/null || { echo 'Predecessor Central Portal evidence differs.' >&2; exit 1; }
            jq -e --argjson coordinates "$predecessor_coordinate_count" --argjson content "$predecessor_content_count" --argjson checksums "$predecessor_checksum_count" \
              '.state == "exact" and .coordinateCount == $coordinates and .verifiedFileCount == $content and .verifiedChecksumCount == $checksums' \
              build/release/maven-central/verify.json >/dev/null || { echo 'Predecessor Central release evidence differs.' >&2; exit 1; }

            downloads="$predecessor_temporary/github-downloads"
            gnupg_home="$predecessor_temporary/gnupg"
            key_file="$predecessor_temporary/signing-key"
            actual_release_body="$predecessor_temporary/github-release-body"
            mkdir "$downloads" "$gnupg_home"
            chmod 700 "$gnupg_home"
            export GNUPGHOME="$gnupg_home"
            printf '%s' "$SIGNING_KEY" > "$key_file"
            chmod 600 "$key_file"
            if ! gpg --batch --quiet --import "$key_file"; then
              printf '%s' "$SIGNING_KEY" | base64 --decode > "$key_file"
              gpg --batch --quiet --import "$key_file"
            fi
            verified_signatures=0
            while IFS= read -r -d '' signature; do
              gpg --batch --verify "$signature" "${signature%.asc}"
              verified_signatures=$((verified_signatures + 1))
            done < <(find build/release/maven-central/evidence -type f -name '*.asc' -print0)
            [[ "$verified_signatures" == "$predecessor_signature_count" ]] || { echo "Predecessor Central signature inventory differs: $verified_signatures." >&2; exit 1; }
            shopt -s nullglob
            predecessor_assets=(build/release/github/*)
            [[ "${#predecessor_assets[@]}" == "$predecessor_asset_count" ]] || { echo 'Predecessor GitHub asset count differs.' >&2; exit 1; }
            release_json="$(gh release view "$previous_tag" --json tagName,name,body,isDraft,isPrerelease)"
            [[ "$(jq -r '.tagName' <<< "$release_json")" == "$previous_tag" && \
              "$(jq -r '.name' <<< "$release_json")" == "Strata ${previous_tag#v}" ]] || { echo 'Predecessor GitHub Release identity differs.' >&2; exit 1; }
            [[ "$(jq -r '.isDraft' <<< "$release_json")" == "false" && \
              "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]] || { echo 'Predecessor GitHub Release is not published stable.' >&2; exit 1; }
            jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | if contains("\r") then error("release body contains a lone carriage return") else @base64 end' \
              <<< "$release_json" | base64 --decode > "$actual_release_body"
            cmp --silent "docs/releases/$previous_tag.md" "$actual_release_body" || { echo 'Predecessor GitHub Release body differs.' >&2; exit 1; }
            expected_assets="$(printf '%s\n' "${predecessor_assets[@]##*/}" | sort)"
            actual_assets="$(gh release view "$previous_tag" --json assets --jq '.assets[].name' | sort)"
            [[ "$actual_assets" == "$expected_assets" ]] || { echo 'Predecessor GitHub Release asset inventory differs.' >&2; exit 1; }
            for asset in "${predecessor_assets[@]}"; do
              name="$(basename "$asset")"
              gh release download "$previous_tag" --pattern "$name" --dir "$downloads"
              cmp --silent "$asset" "$downloads/$name" || { echo "Predecessor GitHub asset differs: $name" >&2; exit 1; }
            done
            (cd "$downloads" && sha256sum --check SHA256SUMS)
            for jar in "$downloads"/*.jar; do
              gpg --batch --verify "$jar.asc" "$jar"
            done
          )
          rm -rf -- "$predecessor_temporary/gnupg"
          rm -f -- "$predecessor_temporary/signing-key"
          [[ ! -e "$predecessor_temporary/gnupg" && ! -e "$predecessor_temporary/signing-key" ]] || { echo 'Predecessor signing material remained before public verification.' >&2; exit 1; }
          trap - EXIT INT TERM
          rm -f -- "$project_json" "$remote_body" "$current_body"
          {
            echo "PROVED_PREDECESSOR_COMMIT=$previous_commit"
            echo "PROVED_PREDECESSOR_OBJECT=$previous_object"
            echo "MODRINTH_BODY_STATE=$modrinth_body_state"
            echo "PREDECESSOR_WORKTREE=$worktree"
            echo "PREDECESSOR_TEMPORARY=$predecessor_temporary"
          } >> "$GITHUB_ENV"
      - name: Verify public predecessor services and Pages provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$GITHUB_SHA:release/verify-controller-tools.sh" | \
              bash -s -- verify "$GITHUB_SHA" "$CONTROLLER_TOOL_DIRECTORY"
          }
          previous_tag="$PREDECESSOR_TAG"
          [[ "$PROVED_PREDECESSOR_COMMIT" == "$PREDECESSOR_RELEASE_COMMIT" && \
            "$PROVED_PREDECESSOR_OBJECT" == "$PREDECESSOR_RELEASE_OBJECT" ]] || { echo 'Public predecessor identity differs from frozen metadata.' >&2; exit 1; }
          [[ "$PREDECESSOR_WORKTREE" == "$RUNNER_TEMP/strata-predecessor-verification" ]] || { echo 'Public predecessor worktree path differs.' >&2; exit 1; }
          case "$PREDECESSOR_TEMPORARY" in
            "$RUNNER_TEMP"/strata-predecessor-public-evidence.*) ;;
            *) echo 'Public predecessor temporary path differs.' >&2; exit 1 ;;
          esac
          [[ -d "$PREDECESSOR_WORKTREE" && ! -L "$PREDECESSOR_WORKTREE" && \
            -d "$PREDECESSOR_TEMPORARY" && ! -L "$PREDECESSOR_TEMPORARY" ]] || { echo 'Public predecessor verification paths are not regular directories.' >&2; exit 1; }
          [[ ! -e "$PREDECESSOR_TEMPORARY/gnupg" && ! -e "$PREDECESSOR_TEMPORARY/signing-key" && -z "${GNUPGHOME:-}" ]] || { echo 'Signing material reached public predecessor verification.' >&2; exit 1; }
          for forbidden_secret in MODRINTH_TOKEN SIGNING_KEY SIGNING_PASSWORD ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            [[ -z "${!forbidden_secret:-}" ]] || { echo "Release secret reached public predecessor verification: $forbidden_secret" >&2; exit 1; }
          done
          cleanup() {
            git worktree remove --force "$PREDECESSOR_WORKTREE" >/dev/null 2>&1 || true
            rm -rf -- "$PREDECESSOR_TEMPORARY"
          }
          trap cleanup EXIT INT TERM
          (
            cd "$PREDECESSOR_WORKTREE"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              bash release/verify-public-modrinth.sh build/release/modrinth/manifest.json "$PROJECT_ID" strata-ui

            read -r release_pages_run_id _ _ controller_pages_run_id _ _ <<< "$PAGES_PROVENANCE_RECORD"
            [[ "$controller_pages_run_id" =~ ^[0-9]+$ && "$release_pages_run_id" == "$controller_pages_run_id" ]] || {
              echo 'Controller Pages provenance is malformed.' >&2
              exit 1
            }
            previous_pages_run_id="$controller_pages_run_id"
            verify_controller_tools
            previous_pages_record="$(bash "$CONTROLLER_TOOL_DIRECTORY/verify-pages-deployment-source.sh" \
              "$previous_pages_run_id" "$previous_tag" "$PROVED_PREDECESSOR_COMMIT" \
              "$controller_pages_run_id" "$GITHUB_SHA" "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT")"
            verify_controller_tools
            bash "$CONTROLLER_TOOL_DIRECTORY/wait-for-pages-source-receipt.sh" \
              "$previous_tag" "$PROVED_PREDECESSOR_COMMIT" "$GITHUB_SHA"
            verify_controller_tools
            [[ "$(bash "$CONTROLLER_TOOL_DIRECTORY/verify-pages-deployment-source.sh" \
              "$previous_pages_run_id" "$previous_tag" "$PROVED_PREDECESSOR_COMMIT" \
              "$controller_pages_run_id" "$GITHUB_SHA" "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT")" == "$previous_pages_record" ]] || { echo 'Predecessor Pages provenance changed during verification.' >&2; exit 1; }

            pages_base="https://gh.s7a.dev/strata/releases/${previous_tag#v}"
            pages_inventory="$PREDECESSOR_TEMPORARY/pages-public-urls.txt"
            pages_target="$PREDECESSOR_TEMPORARY/pages-target"
            source_revision="$PREDECESSOR_TEMPORARY/source-revision.txt"
            public_skill="$PREDECESSOR_TEMPORARY/SKILL.md"
            curl --fail --silent --show-error --location --proto '=https' \
              "$pages_base/pages-public-urls.txt" --output "$pages_inventory"
            LC_ALL=C sort --check --unique "$pages_inventory"
            for required in / /index.html /guide/ /guide/components.md /source-receipt.json /source-revision.txt; do
              grep --fixed-strings --line-regexp "$required" "$pages_inventory" >/dev/null
            done
            grep --extended-regexp --line-regexp '/guide/components/[^/]+\.png' "$pages_inventory" >/dev/null
            while IFS= read -r public_path; do
              [[ "$public_path" == /* ]] || { echo "Invalid predecessor Pages path: $public_path" >&2; exit 1; }
              curl --fail --silent --show-error --location --proto '=https' \
                "$pages_base$public_path" --output "$pages_target"
              [[ -s "$pages_target" ]] || { echo "Empty predecessor Pages target: $public_path" >&2; exit 1; }
            done < "$pages_inventory"
            curl --fail --silent --show-error --location --proto '=https' \
              "$pages_base/source-revision.txt" --output "$source_revision"
            [[ "$(cat "$source_revision")" == "$previous_tag" ]] || { echo 'Predecessor Pages source revision differs.' >&2; exit 1; }
            curl --fail --silent --show-error --location --proto '=https' \
              "https://raw.githubusercontent.com/sya-ri/strata/$previous_tag/skills/strata/SKILL.md" --output "$public_skill"
            cmp --silent skills/strata/SKILL.md "$public_skill" || { echo 'Predecessor public Skill source differs.' >&2; exit 1; }
          )
          git worktree remove --force "$PREDECESSOR_WORKTREE"
          rm -rf -- "$PREDECESSOR_TEMPORARY"
          trap - EXIT INT TERM
          [[ ! -e "$PREDECESSOR_WORKTREE" && ! -e "$PREDECESSOR_TEMPORARY" ]] || { echo 'Public predecessor verification paths remained after cleanup.' >&2; exit 1; }
      - name: Finalize current Modrinth body and verify approved release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          verify_controller_tools() {
            git --no-replace-objects cat-file blob "$GITHUB_SHA:release/verify-controller-tools.sh" | \
              bash -s -- verify "$GITHUB_SHA" "$CONTROLLER_TOOL_DIRECTORY"
          }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/tags/*:refs/tags/*'
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Verification controller changed before Modrinth finalization.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SOURCE_COMMIT" && "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_SOURCE_COMMIT" ]] || { echo 'Release commit changed before Modrinth finalization.' >&2; exit 1; }
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          [[ "$tag_object" == "$RELEASE_TAG_OBJECT" ]] || { echo 'Current tag object changed before Modrinth finalization.' >&2; exit 1; }
          [[ "$PROVED_PREDECESSOR_COMMIT" == "$PREDECESSOR_RELEASE_COMMIT" && \
            "$PROVED_PREDECESSOR_OBJECT" == "$PREDECESSOR_RELEASE_OBJECT" ]] || { echo 'Proved predecessor identity differs before Modrinth finalization.' >&2; exit 1; }
          [[ "$MODRINTH_BODY_STATE" == "predecessor" || "$MODRINTH_BODY_STATE" == "current" ]] || { echo 'Proved Modrinth body recovery state differs before finalization.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$PREDECESSOR_TAG^{commit}")" == "$PROVED_PREDECESSOR_COMMIT" && \
            "$(git rev-parse "refs/tags/$PREDECESSOR_TAG")" == "$PROVED_PREDECESSOR_OBJECT" ]] || { echo 'Predecessor tag changed before Modrinth finalization.' >&2; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SOURCE_COMMIT" origin/master || { echo 'Release source left controller master before Modrinth finalization.' >&2; exit 1; }
          git merge-base --is-ancestor "$PROVED_PREDECESSOR_COMMIT" "$RELEASE_SOURCE_COMMIT" || { echo 'Predecessor ancestry changed before Modrinth finalization.' >&2; exit 1; }
          verify_controller_tools
          jq -e \
            --arg current_tag "$RELEASE_TAG" --arg current_commit "$RELEASE_SOURCE_COMMIT" --arg current_object "$tag_object" \
            --argjson representative_versions "$RELEASE_REPRESENTATIVE_MINECRAFT_VERSIONS" \
            --arg predecessor_tag "$PREDECESSOR_TAG" --arg predecessor_commit "$PROVED_PREDECESSOR_COMMIT" --arg predecessor_object "$PROVED_PREDECESSOR_OBJECT" '
              .current == {tag: $current_tag, commit: $current_commit, tagObject: $current_object, representativeMinecraftVersions: $representative_versions} and
              .predecessor == {tag: $predecessor_tag, commit: $predecessor_commit, tagObject: $predecessor_object}
            ' "$CONTROLLER_TOOL_DIRECTORY/current-controller.json" >/dev/null || { echo 'Controller metadata changed before Modrinth finalization.' >&2; exit 1; }
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$tag_object" >/dev/null
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-release-tag.sh" "$PREDECESSOR_TAG" "$PROVED_PREDECESSOR_COMMIT" "$PROVED_PREDECESSOR_OBJECT" >/dev/null
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-current-controller-release-order.sh" \
            "$CONTROLLER_TOOL_DIRECTORY/current-controller.json" >/dev/null
          verify_controller_tools
          bash "$CONTROLLER_TOOL_DIRECTORY/verify-github-tag-ruleset.sh" \
            "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset.json" \
            "$CONTROLLER_TOOL_DIRECTORY/github-release-tag-ruleset-receipt.json" >/dev/null
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Verification controller changed during Modrinth source verification.' >&2; exit 1; }
          git diff --quiet -- . || { echo 'Tracked release source changed before Modrinth finalization.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Tracked release source changed before Modrinth finalization.' >&2; exit 1; }
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseFinalizeProject \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
          jq -e --argjson artifacts "$RELEASE_ARTIFACT_COUNT" '.operation == "finalize-project" and .projectStatus == "approved" and (.absent | length) == 0 and (.listed | length) == $artifacts' \
            build/release/modrinth-receipts/finalize_project.json >/dev/null || { echo 'Modrinth body finalization receipt differs.' >&2; exit 1; }
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseVerify \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
          jq -e --argjson artifacts "$RELEASE_ARTIFACT_COUNT" '.operation == "verify" and .projectStatus == "approved" and (.absent | length) == 0 and (.listed | length) == $artifacts' \
            build/release/modrinth-receipts/verify.json >/dev/null || { echo 'Approved Modrinth verification receipt differs.' >&2; exit 1; }
      - name: Verify public Modrinth inventory and CDN files
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
        run: |
          set -euo pipefail
          bash -n release/verify-public-modrinth.sh
          env -u MODRINTH_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
            bash release/verify-public-modrinth.sh build/release/modrinth/manifest.json "$PROJECT_ID" strata-ui
      - name: Clean up verification controller tools
        if: always() && steps.controller_tools.outputs.directory != ''
        shell: bash
        env:
          CONTROLLER_TOOL_DIRECTORY: ${{ steps.controller_tools.outputs.directory }}
        run: |
          set -euo pipefail
          directory="$CONTROLLER_TOOL_DIRECTORY"
          [[ "$(dirname -- "$directory")" == "${RUNNER_TEMP%/}" && \
            "$(basename -- "$directory")" =~ ^strata-verify-controller-tools\.[A-Za-z0-9]{6}$ ]] || {
            echo 'Verification controller tool cleanup path differs.' >&2
            exit 1
          }
          [[ ! -L "$directory" ]] || { echo 'Verification controller tool directory became a symlink.' >&2; exit 1; }
          if [[ -d "$directory" ]]; then
            chmod u+w -- "$directory"
            rm -rf -- "$directory"
          elif [[ -e "$directory" ]]; then
            echo 'Verification controller tool cleanup target is not a directory.' >&2
            exit 1
          fi
          [[ ! -e "$directory" && ! -L "$directory" ]] || { echo 'Verification controller tools remained after cleanup.' >&2; exit 1; }
