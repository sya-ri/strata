name: JVM checks

on:
  push:
    branches:
      - master
    paths:
      - .github/actions/**
      - .github/workflows/**
      - api/**
      - build-logic/**
      - build.gradle.kts
      - CHANGELOG.md
      - config/**
      - docs/**
      - gradle/**
      - gradle.properties
      - icon.svg
      - icon.png
      - integration/**
      - qodana.yaml
      - quality/**
      - release/**
      - README.md
      - runtime/**
      - settings.gradle.kts
      - skills/**
      - tools/web/**
      - kotlin-js-store/**
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/**
      - api/**
      - build-logic/**
      - build.gradle.kts
      - CHANGELOG.md
      - config/**
      - docs/**
      - gradle/**
      - gradle.properties
      - icon.svg
      - icon.png
      - integration/**
      - qodana.yaml
      - quality/**
      - release/**
      - README.md
      - runtime/**
      - settings.gradle.kts
      - skills/**
      - tools/web/**
      - kotlin-js-store/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-checks:
    name: Workflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Set up Java
        uses: ./.github/actions/setup-strata-java
      - name: Set up Gradle for release fixtures
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: false
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Check release shell syntax
        shell: bash
        run: |
          for script in release/*.sh release/tests/*.sh; do
            bash -n "$script"
          done
      - name: Test release source guards
        shell: bash
        run: |
          for source_guard in release/tests/verify-release*-source.sh; do
            bash "$source_guard"
          done
          bash release/tests/verify-versioned-pages-staging.sh
      - name: Test Java toolchain inventory
        shell: bash
        run: bash release/tests/verify-java-toolchain-inventory.sh
      - name: Test CI project model guards
        run: |
          bash -n gradle/plan-minecraft-ci.sh gradle/verify-minecraft-ci-plan-fixtures.sh gradle/prepare-qodana-idea-model.sh gradle/verify-qodana-model.sh gradle/verify-qodana-model-fixtures.sh gradle/verify-qodana-bootstrap-fixtures.sh
          bash gradle/verify-minecraft-ci-plan-fixtures.sh
          bash gradle/verify-qodana-model-fixtures.sh
          bash gradle/verify-qodana-bootstrap-fixtures.sh

  web:
    name: Web build and browser parity
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: ./.github/actions/setup-strata-java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Verify Web runtime and static build
        run: .\gradlew.bat :runtime:web:check :integration:web:check
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-parity
          path: integration/web/build/parity

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: common
            name: Common checks
            fetch_depth: 0
            gradle_arguments: :check :api:check :integration:api:check :quality:benchmarks:check :quality:detekt-rules:check :runtime:core:check :runtime:headless:check :runtime:minecraft:check :runtime:minecraft-fonts-lwjgl:check
            cache_read_only: false
            coverage: false
          - id: coverage
            name: Coverage
            fetch_depth: 1
            gradle_arguments: :koverJvmTests :koverHtmlReport :koverXmlReport -Pkover
            cache_read_only: true
            coverage: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
      - name: Set up Java
        uses: ./.github/actions/setup-strata-java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ matrix.cache_read_only || github.ref != 'refs/heads/master' }}
          gradle-home-cache-strict-match: ${{ matrix.id != 'coverage' }}
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Run ${{ matrix.name }}
        run: bash ./gradlew ${{ matrix.gradle_arguments }}
      - name: Upload coverage reports
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: kover-reports
          path: build/reports/kover
          if-no-files-found: error

  minecraft-matrix:
    name: Plan Minecraft checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Generate Minecraft matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          bash gradle/plan-minecraft-ci.sh
          matrix="$(< build/github-actions/minecraft-matrix.json)"
          [[ -n "$matrix" ]] || { echo 'The generated Minecraft matrix is empty.' >&2; exit 1; }
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  minecraft:
    name: ${{ matrix.name }}
    needs: minecraft-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.minecraft-matrix.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Java
        uses: ./.github/actions/setup-strata-java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Hash Loom cache inputs
        id: loom_inputs
        shell: bash
        env:
          LOOM_PROJECTS: ${{ matrix.loom_projects }}
        run: bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
      - name: Restore Loom project cache
        id: loom_cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/loom-cache
          # Never fall back by prefix: Loom's generated Minecraft artifacts are valid only for this complete input hash.
          key: loom-${{ runner.os }}-${{ matrix.id }}-${{ steps.loom_inputs.outputs.hash }}
      - name: Run ${{ matrix.name }}
        # Loom's client run tasks select xvfb-run automatically on Linux when CI is true.
        run: bash ./gradlew ${{ matrix.gradle_arguments }}
      - name: Upload loaded-client failure evidence
        # Loaded-client assertions retain their framebuffer PNGs, receipts with GUI scale and lease/frame
        # counters, and the client's crash reports in the build directories; CI keeps them diagnosable.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-failure-evidence-${{ matrix.id }}
          path: |
            integration/*/build/minecraft-verification/
            integration/*/build/minecraft-production-verification/
            integration/*/build/run/*/crash-reports/
            integration/*/build/run/*/logs/latest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Loom project cache
        if: success() && github.ref == 'refs/heads/master' && steps.loom_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .gradle/loom-cache
          key: ${{ steps.loom_cache.outputs.cache-primary-key }}
