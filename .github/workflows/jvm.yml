name: JVM checks
'on':
  pull_request: {}
  workflow_dispatch:
    inputs:
      paired_manifest:
        description: Optional repository-relative frozen paired JVM manifest
        type: string
        default: ''
      minecraft_versions:
        description: Optional comma-separated exact targets for loaded full client verification
        type: string
        default: ''
      minecraft_backend:
        description: Explicit loaded client backend; default preserves full CI
        type: choice
        default: default
        options:
        - default
        - opengl
        - vulkan
      subject_ref:
        description: Full immutable public commit SHA required for selected client verification
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.subject_ref != '' && format('-clients-{0}-{1}-{2}', inputs.subject_ref, inputs.minecraft_backend, inputs.minecraft_versions) || '' }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.plan.outputs.common }}
      web: ${{ steps.plan.outputs.web }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_full: ${{ steps.plan.outputs.docs_full }}
      workflow: ${{ steps.plan.outputs.workflow }}
      qodana: ${{ steps.plan.outputs.qodana }}
      all_minecraft: ${{ steps.plan.outputs.all_minecraft }}
      minecraft: ${{ steps.plan.outputs.minecraft }}
      subject_ref: ${{ steps.plan.outputs.subject_ref }}
      client_backend: ${{ steps.plan.outputs.client_backend }}
      client_matrix: ${{ steps.plan.outputs.client_matrix }}
      paired_manifest: ${{ steps.paired.outputs.paired_manifest }}
      paired_data_ref: ${{ steps.paired.outputs.paired_data_ref }}
      paired_manifest_sha256: ${{ steps.paired.outputs.paired_manifest_sha256 }}
      preflight: ${{ steps.plan.outputs.preflight }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Check selected client admission
      shell: bash
      env:
        VERSIONS: ${{ inputs.minecraft_versions }}
        BACKEND: ${{ inputs.minecraft_backend }}
        SUBJECT: ${{ inputs.subject_ref }}
        MANIFEST: ${{ inputs.paired_manifest }}
      run: |-
        if [[ -n "$VERSIONS$SUBJECT" || ( -n "$BACKEND" && "$BACKEND" != default ) ]]; then
          [[ -z "$MANIFEST" ]] || { echo 'Select paired measurement or loaded client verification separately.' >&2; exit 1; }
          [[ "$SUBJECT" =~ ^[0-9a-f]{40}$ ]] || { echo 'subject_ref must be a full lowercase immutable commit SHA.' >&2; exit 1; }
          [[ -n "$VERSIONS" && ( "$BACKEND" == opengl || "$BACKEND" == vulkan ) ]] || { echo 'Select exact Minecraft versions and an explicit backend.' >&2; exit 1; }
        fi
    - name: Check out immutable client subject
      if: inputs.subject_ref != ''
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.subject_ref }}
        path: subject
        persist-credentials: false
    - uses: ./.github/actions/setup-strata-java
      if: inputs.subject_ref == ''
    - uses: gradle/actions/setup-gradle@v6
      if: inputs.subject_ref == ''
      with:
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Select opt-in paired JVM measurement
      if: inputs.subject_ref == ''
      id: paired
      shell: bash
      env:
        MANIFEST: ${{ inputs.paired_manifest }}
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |-
        args=(--select)
        if [[ -n "$MANIFEST" ]]; then
          args+=(--manifest "$MANIFEST")
        fi
        if [[ "$EVENT" == pull_request ]]; then
          args+=(--base "$BASE" --head "$HEAD")
        fi
        python3 -B gradle/performance/paired-jvm.py "${args[@]}"
    - name: Select changed inputs
      run: |-
        args=(--full)
        if [[ -n "$SUBJECT" ]]; then
          args=(--minecraft-versions "$VERSIONS" --minecraft-backend "$BACKEND" --subject-ref "$SUBJECT")
        fi
        if [[ "$EVENT" == pull_request ]]; then
          args=(--base "$BASE" --head "$HEAD")
          if git diff --no-renames --name-only "$BASE...$HEAD" | grep -Eq '^(runtime|integration)/(shared/|minecraft-fabric-)'; then
            GITHUB_OUTPUT='' python3 gradle/plan-ci.py "${args[@]}" > /dev/null
            if jq --exit-status '.common | not' build/github-actions/ci-plan.json > /dev/null; then
              bash ./gradlew :writeCiSourceModel
              args+=(--model build/github-actions/source-model.json)
            fi
          fi
        elif [[ "$EVENT" == workflow_dispatch && -n "$MANIFEST" ]]; then
          args=(--paired-manifest "$MANIFEST")
        fi
        python3 gradle/plan-ci.py "${args[@]}"
      id: plan
      env:
        MANIFEST: ${{ inputs.paired_manifest }}
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        VERSIONS: ${{ inputs.minecraft_versions }}
        BACKEND: ${{ inputs.minecraft_backend }}
        SUBJECT: ${{ inputs.subject_ref }}
  paired-jvm:
    name: Complete paired runtime measurement
    needs: plan
    if: needs.plan.outputs.paired_manifest != ''
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
    - name: Check out explicit driver revision
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Preserve attempt admission
      shell: pwsh
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        MANIFEST: ${{ needs.plan.outputs.paired_manifest }}
        DATA_REF: ${{ needs.plan.outputs.paired_data_ref }}
        MANIFEST_SHA256: ${{ needs.plan.outputs.paired_manifest_sha256 }}
      run: |
        New-Item -ItemType Directory -Force -Path build/performance-ci > $null
        $actualHead = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actualHead -ne $env:EXPECTED_HEAD) { throw 'Paired checkout differs from the selected driver revision' }
        @{run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; head=$actualHead; event_sha=$env:GITHUB_SHA; manifest=$env:MANIFEST; data_ref=$env:DATA_REF; manifest_sha256=$env:MANIFEST_SHA256; status='pending'; runner=$env:RUNNER_NAME} | ConvertTo-Json | Set-Content build/performance-ci/bootstrap.json
    - name: Install the catalog-backed fixed Java profile
      id: java
      uses: ./.github/actions/setup-strata-java
      with:
        paired: 'true'
    - name: Set up Gradle intermediates
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Verify owned invocation failure and terminal cleanup
      shell: pwsh
      run: python -B gradle/performance/verify-windows-boundary.py --output "build/performance-ci/boundary-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
    - name: Collect and compare the complete frozen pair
      shell: pwsh
      env:
        MANIFEST: ${{ needs.plan.outputs.paired_manifest }}
        DATA_REF: ${{ needs.plan.outputs.paired_data_ref }}
        MANIFEST_SHA256: ${{ needs.plan.outputs.paired_manifest_sha256 }}
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        STRATA_PAIRED_TOOLCHAIN: ${{ steps.java.outputs.toolchain }}
      run: python -B gradle/performance/paired-jvm.py --manifest "$env:MANIFEST" --data-ref "$env:DATA_REF" --manifest-sha256 "$env:MANIFEST_SHA256" --expected-head "$env:EXPECTED_HEAD" --output "build/performance-ci/paired-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
    - name: Upload complete attempt evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: paired-jvm-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/performance-ci/*.zip
          build/performance-ci/bootstrap.json
        if-no-files-found: error
  preflight-qualification:
    name: Qualified compiled fixture controls
    needs: plan
    if: needs.plan.outputs.preflight == 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-strata-java
      id: java
      with:
        paired: 'true'
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Verify real resource refusal and terminal cleanup
      shell: pwsh
      run: python -B gradle/performance/verify-windows-boundary.py --output "build/performance-ci/qualified-boundary-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
    - name: Qualify the real whole control and timing boundary
      shell: pwsh
      env:
        STRATA_PAIRED_TOOLCHAIN: ${{ steps.java.outputs.toolchain }}
      run: python -B gradle/performance/verify-qualified-preflight.py --output "build/performance-ci/qualified-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: qualified-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/performance-ci/*.zip
        if-no-files-found: error
  web-demos:
    name: Web runtime and demos
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v7
    - name: Set up Java
      uses: ./.github/actions/setup-strata-java
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Check browser runtime and production demos
      run: |-
        tasks=(:api:jsTest :runtime:core:jsTest :runtime:web:check :examples:web:check)
        if [[ "$DOCS_FULL" == true ]]; then
          tasks+=(-Pstrata.webOnly=true)
        else
          tasks+=(:integration:docs:checkWebDemos)
        fi
        bash ./gradlew "${tasks[@]}" -Pstrata.webDemoInstallSystemDependencies=true
      env:
        DOCS_FULL: ${{ needs.plan.outputs.docs_full }}
    - name: Upload core Web test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: core-web-test-results
        path: runtime/core/build/test-results/
        if-no-files-found: warn
    - name: Upload fresh demo screenshots
      uses: actions/upload-artifact@v7
      with:
        name: web-demo-screenshots
        path: integration/docs/build/web-demos/evidence
        if-no-files-found: error
      if: needs.plan.outputs.docs_full != 'true'
    needs: plan
    if: needs.plan.outputs.web == 'true'
  workflow-checks:
    name: Workflow checks
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check GitHub Actions workflows
      run: bash .github/check-workflows.sh
    - name: Set up Java
      uses: ./.github/actions/setup-strata-java
    - name: Set up Gradle for release fixtures
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-strict-match: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Check release shell syntax
      shell: bash
      run: |
        for script in release/*.sh release/tests/*.sh; do
          bash -n "$script"
        done
    - name: Test distribution publication
      run: |-
        python3 -B -m unittest discover -s release/tests -p "test_*.py"
        python3 -B -m unittest discover -s gradle/tests -p "test_*.py"
        bash release/tests/verify-github-release-preflight.sh
        bash release/tests/verify-github-release-read.sh
        python3 -B release/tests/verify-fabric-sources.py
    - name: Test Java toolchain inventory
      shell: bash
      run: bash release/tests/verify-java-toolchain-inventory.sh
    - name: Test CI project model guards
      run: |
        bash -n gradle/plan-minecraft-ci.sh gradle/verify-minecraft-ci-plan-fixtures.sh gradle/prepare-qodana-idea-model.sh gradle/verify-qodana-model.sh gradle/verify-qodana-model-fixtures.sh gradle/verify-qodana-bootstrap-fixtures.sh
        bash gradle/verify-minecraft-ci-plan-fixtures.sh
        bash gradle/verify-qodana-model-fixtures.sh
        bash gradle/verify-qodana-bootstrap-fixtures.sh
    - name: Compile isolated publication tools
      run: bash ./gradlew -p release/tools classes -PpreparedRelease=../../build/empty-prepared
    needs: plan
    if: needs.plan.outputs.workflow == 'true' || needs.plan.outputs.common == 'true'
  web:
    name: Web build and browser parity
    runs-on: windows-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v7
    - name: Set up Java
      uses: ./.github/actions/setup-strata-java
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Verify Web runtime and static build
      run: .\gradlew.bat :integration:web:check
    - name: Upload browser evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: web-parity
        path: integration/web/build/parity
    needs: plan
    if: needs.plan.outputs.web == 'true'
  checks:
    name: JVM checks and coverage
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Java
      uses: ./.github/actions/setup-strata-java
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Check JVM modules and generate coverage once
      run: bash ./gradlew :check :quality:benchmarks:check :quality:component-benchmarks:check :quality:remote-benchmarks:check :performance-testkit:check :paper-api:check :velocity-api:check :api:check :examples:paper:check :examples:velocity:check
        :integration:api:check :quality:detekt-rules:check :detekt-rules:check :runtime:core:check :runtime:remote:check :runtime:paper:check :runtime:velocity:check
        :runtime:headless:check :runtime:minecraft:check :runtime:minecraft-fonts-lwjgl:check :koverHtmlReport :koverXmlReport -Pkover
        -x :api:jsBrowserTest -x :api:jsNodeTest -x :runtime:core:jsBrowserTest -x :runtime:core:jsNodeTest
    - name: Upload core JVM test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: core-jvm-test-results
        path: runtime/core/build/test-results/
        if-no-files-found: warn
    - name: Verify scoped JVM collection without fixture registration
      run: python3 -B gradle/verify-jvm-fixture-collection.py
    - name: Upload scoped collection evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: scoped-jvm-fixture
        path: build/fixture-tests/jvm-collection
        if-no-files-found: error
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: kover-reports
        path: build/reports/kover
        if-no-files-found: error
    - name: Upload compiler ABI dumps
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: compiler-abi-dumps
        path: '**/build/kotlin/abi/'
        if-no-files-found: ignore
        retention-days: 7
    needs: plan
    if: needs.plan.outputs.common == 'true'
  minecraft-matrix:
    name: Plan Minecraft checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      docs_version: ${{ steps.matrix.outputs.docs_version }}
    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Generate Minecraft matrix
      id: matrix
      shell: bash
      run: |-
        if [[ -n "$CLIENT_MATRIX" ]]; then
          mkdir -p build/github-actions
          printf '%s\n' "$CLIENT_MATRIX" > build/github-actions/minecraft-matrix.json
          echo "matrix=$CLIENT_MATRIX" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        export STRATA_MC_VERSIONS=all
        if [[ "$ALL_MINECRAFT" != true ]]; then
          STRATA_MC_VERSIONS=$(jq -r 'join(",")' <<< "$SELECTED_VERSIONS")
        fi
        bash gradle/plan-minecraft-ci.sh
        echo "matrix=$(cat build/github-actions/minecraft-matrix.json)" >> "$GITHUB_OUTPUT"
      env:
        SELECTED_VERSIONS: ${{ needs.plan.outputs.minecraft }}
        ALL_MINECRAFT: ${{ needs.plan.outputs.all_minecraft }}
        STRATA_CI_DOCS: ${{ needs.plan.outputs.docs_full }}
        CLIENT_MATRIX: ${{ needs.plan.outputs.client_matrix }}
    needs: plan
    if: needs.plan.outputs.all_minecraft == 'true' || needs.plan.outputs.minecraft != '[]' || needs.plan.outputs.docs_full == 'true'
  minecraft:
    name: ${{ matrix.name }}
    needs:
    - plan
    - minecraft-matrix
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.subject_ref != '' && 90 || 360 }}
    env:
      SDL_VIDEO_FORCE_EGL: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.minecraft-matrix.outputs.matrix) }}
    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.plan.outputs.subject_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Assert immutable client source
      if: needs.plan.outputs.subject_ref != ''
      shell: bash
      env:
        SUBJECT: ${{ needs.plan.outputs.subject_ref }}
        DRIVER: ${{ github.sha }}
        ARGUMENTS: ${{ matrix.gradle_arguments }}
      run: |-
        [[ "$(git rev-parse HEAD)" == "$SUBJECT" ]]
        [[ -z "$(git status --porcelain --untracked-files=no)" ]]
        mkdir -p build/github-actions
        {
          printf 'driver=%s\nsubject=%s\narguments=%s\n' "$DRIVER" "$SUBJECT" "$ARGUMENTS"
          git show --no-patch --format='commit=%H%ntree=%T' HEAD
          git archive --format=tar HEAD | sha256sum
        } | tee build/github-actions/client-source.txt
    - name: Set up Java
      uses: ./.github/actions/setup-strata-java
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true
        gradle-home-cache-strict-match: true
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Hash Loom cache inputs
      id: loom_inputs
      shell: bash
      env:
        LOOM_PROJECTS: ${{ matrix.loom_projects }}
      run: bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
    - name: Restore Loom project cache
      id: loom_cache
      uses: actions/cache/restore@v6
      with:
        path: .gradle/loom-cache
        key: loom-${{ runner.os }}-${{ matrix.id }}-${{ steps.loom_inputs.outputs.hash }}
    - name: Install EGL libraries
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libegl1 libegl-mesa0
    - name: Install software Vulkan support
      if: needs.plan.outputs.client_backend == 'vulkan'
      run: sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
    - name: Record actual Vulkan device and limits
      if: needs.plan.outputs.client_backend == 'vulkan'
      run: xvfb-run -a vulkaninfo > build/github-actions/vulkaninfo.txt
    - name: Run ${{ matrix.name }}
      shell: bash
      run: |-
        args=()
        if [[ "$COMMON_CHECKS" == true ]]; then
          project=":runtime:minecraft-fabric-$MINECRAFT_VERSION"
          if grep -Fxq "$project" gradle/kover-jvm-projects.txt; then args+=(-x "$project:test"); fi
        fi
        mkdir -p build/github-actions
        bash ./gradlew ${{ matrix.gradle_arguments }} "${args[@]}" -Pstrata.webDemoInstallSystemDependencies=true 2>&1 | tee build/github-actions/minecraft-gradle.log
      env:
        COMMON_CHECKS: ${{ needs.plan.outputs.common }}
        MINECRAFT_VERSION: ${{ matrix.version }}
    - name: Record checked archive identities
      if: always() && needs.plan.outputs.subject_ref != ''
      shell: bash
      env:
        SUBJECT: ${{ needs.plan.outputs.subject_ref }}
      run: |-
        mkdir -p build/github-actions
        find api runtime integration performance-testkit -path '*/build/libs/*.jar' -type f -print0 | sort -z | xargs -0 -r sha256sum > build/github-actions/client-archives.sha256
        [[ "$(git rev-parse HEAD)" == "$SUBJECT" ]]
        git diff --exit-code HEAD
    - name: Upload native showcase comparison
      if: success() && matrix.documentation
      uses: actions/upload-artifact@v7
      with:
        name: native-showcase
        path: |
          integration/minecraft-fabric-${{ matrix.version }}/build/minecraft-parity
          integration/docs/build/component-showcase/check
        if-no-files-found: error
        retention-days: 7
    - name: Upload loaded-client evidence for ${{ matrix.id }}
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: minecraft-loaded-client-evidence-${{ matrix.id }}
        path: |
          build/github-actions/
          **/build/libs/*.jar
          **/build/test-results/
          **/build/*-offline*/
          integration/*/build/minecraft-verification/
          integration/*/build/minecraft-production-verification/
          integration/*/build/minecraft-*parity*/
          integration/docs/build/component-showcase/check/
          integration/*/build/run/*/crash-reports/
          integration/*/build/run/*/logs/latest.log
        if-no-files-found: ignore
        retention-days: 7
    - name: Save Loom project cache
      if: success() && steps.loom_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .gradle/loom-cache
        key: ${{ steps.loom_cache.outputs.cache-primary-key }}
  documentation:
    name: Documentation and Dokka
    needs:
    - plan
    - minecraft-matrix
    if: needs.plan.outputs.docs_full == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-strata-java
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Hash documentation Loom inputs
      id: loom_inputs
      shell: bash
      run: |-
        LOOM_PROJECTS="$(find runtime -mindepth 1 -maxdepth 1 -type d -name 'minecraft-fabric-*' | sort)
        integration/minecraft-fabric-$MINECRAFT_VERSION"
        export LOOM_PROJECTS
        bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
      env:
        MINECRAFT_VERSION: ${{ needs.minecraft-matrix.outputs.docs_version }}
    - name: Restore documentation Loom cache
      id: loom_cache
      uses: actions/cache/restore@v6
      with:
        path: .gradle/loom-cache
        key: loom-${{ runner.os }}-documentation-${{ steps.loom_inputs.outputs.hash }}
        restore-keys: |
          loom-${{ runner.os }}-documentation-
          loom-${{ runner.os }}-minecraft-all-
    - name: Generate and check documentation
      run: |-
        args=(-x :integration:docs:checkMinecraftShowcaseParity -x :integration:docs:checkComponentShowcase)
        if [[ "$COMMON_CHECKS" == true ]]; then args+=(-x :integration:docs:test); fi
        bash ./gradlew :integration:docs:check :integration:docs:checkDokkaPagesStaging \
          -Pstrata.minecraftVersions="$MINECRAFT_VERSION" -Pstrata.webDemoInstallSystemDependencies=true "${args[@]}"
      env:
        COMMON_CHECKS: ${{ needs.plan.outputs.common }}
        MINECRAFT_VERSION: ${{ needs.minecraft-matrix.outputs.docs_version }}
    - name: Upload checked documentation
      uses: actions/upload-artifact@v7
      with:
        name: documentation-site
        path: build/dokka/html
        if-no-files-found: error
        retention-days: 7
    - name: Save documentation Loom cache
      if: success() && steps.loom_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .gradle/loom-cache
        key: ${{ steps.loom_cache.outputs.cache-primary-key }}
  docs:
    name: Documentation links
    needs: plan
    if: needs.plan.outputs.docs == 'true' && needs.plan.outputs.docs_full != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-strata-java
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Check reader documentation
      run: bash ./gradlew :integration:docs:checkDocumentationLinks :integration:docs:checkStrataSkill
  result:
    name: CI result
    needs:
    - plan
    - paired-jvm
    - preflight-qualification
    - web-demos
    - workflow-checks
    - web
    - checks
    - minecraft-matrix
    - minecraft
    - documentation
    - docs
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check planned job outcomes
      run: |-
        python3 - <<'PY'
        import json, os
        jobs = json.loads(os.environ['RESULTS'])
        assert jobs['plan']['result'] == 'success', 'CI planning failed'
        p = jobs['plan']['outputs']
        common, web, docs, full_docs, workflow = (p[key] == 'true' for key in ('common', 'web', 'docs', 'docs_full', 'workflow'))
        minecraft = p['all_minecraft'] == 'true' or json.loads(p['minecraft']) != [] or full_docs
        expected = {'checks': common, 'web-demos': web, 'web': web, 'workflow-checks': workflow or common, 'minecraft-matrix': minecraft, 'minecraft': minecraft, 'documentation': full_docs, 'docs': docs and not full_docs}
        expected['paired-jvm'] = p.get('paired_manifest', '') != ''
        expected['preflight-qualification'] = p.get('preflight', 'false') == 'true'
        for job, selected in expected.items():
            required = 'success' if selected else 'skipped'
            assert jobs[job]['result'] == required, f"{job}: expected {required}, got {jobs[job]['result']}"
        PY
      env:
        RESULTS: ${{ toJSON(needs) }}
