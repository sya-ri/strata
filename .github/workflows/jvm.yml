name: JVM checks

on:
  push:
    paths:
      - .github/workflows/jvm.yml
      - api/**
      - build.gradle.kts
      - config/**
      - docs/components/**
      - docs/components.md
      - gradle/**
      - gradle.properties
      - integration/**
      - quality/**
      - README.md
      - runtime/**
      - settings.gradle.kts
  pull_request:
    paths:
      - .github/workflows/jvm.yml
      - api/**
      - build.gradle.kts
      - config/**
      - docs/components/**
      - docs/components.md
      - gradle/**
      - gradle.properties
      - integration/**
      - quality/**
      - README.md
      - runtime/**
      - settings.gradle.kts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: common
            name: Common checks
            gradle_arguments: :check :api:check :integration:api:check :quality:benchmarks:check :quality:detekt-rules:check :runtime:core:check :runtime:headless:check :runtime:minecraft:check
            cache_read_only: false
            loom_cache: false
            coverage: false
          - id: coverage
            name: Coverage
            gradle_arguments: :koverJvmTests :koverHtmlReport :koverXmlReport -Pkover
            cache_read_only: true
            loom_cache: false
            coverage: true
          - id: minecraft-1-20
            name: Minecraft 1.20.x
            gradle_arguments: :ciMinecraftCheck -Pstrata.minecraftVersions=1.20.1,1.20.2,1.20.3,1.20.4,1.20.5,1.20.6
            loom_projects: |-
              runtime/minecraft-fabric-1.20.1
              integration/minecraft-fabric-1.20.1
              runtime/minecraft-fabric-1.20.2
              integration/minecraft-fabric-1.20.2
              runtime/minecraft-fabric-1.20.3
              integration/minecraft-fabric-1.20.3
              runtime/minecraft-fabric-1.20.4
              integration/minecraft-fabric-1.20.4
              runtime/minecraft-fabric-1.20.5
              integration/minecraft-fabric-1.20.5
              runtime/minecraft-fabric-1.20.6
              integration/minecraft-fabric-1.20.6
            cache_read_only: false
            loom_cache: true
            coverage: false
          - id: minecraft-1-21-early
            name: Minecraft 1.21-1.21.4
            gradle_arguments: :ciMinecraftCheck -Pstrata.minecraftVersions=1.21,1.21.1,1.21.2,1.21.3,1.21.4
            loom_projects: |-
              runtime/minecraft-fabric-1.21
              integration/minecraft-fabric-1.21
              runtime/minecraft-fabric-1.21.1
              integration/minecraft-fabric-1.21.1
              runtime/minecraft-fabric-1.21.2
              integration/minecraft-fabric-1.21.2
              runtime/minecraft-fabric-1.21.3
              integration/minecraft-fabric-1.21.3
              runtime/minecraft-fabric-1.21.4
              integration/minecraft-fabric-1.21.4
            cache_read_only: false
            loom_cache: true
            coverage: false
          - id: minecraft-1-21-late
            name: Minecraft 1.21.5-1.21.11
            gradle_arguments: :ciMinecraftCheck -Pstrata.minecraftVersions=1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11
            loom_projects: |-
              runtime/minecraft-fabric-1.21.5
              integration/minecraft-fabric-1.21.5
              runtime/minecraft-fabric-1.21.6
              integration/minecraft-fabric-1.21.6
              runtime/minecraft-fabric-1.21.7
              integration/minecraft-fabric-1.21.7
              runtime/minecraft-fabric-1.21.8
              integration/minecraft-fabric-1.21.8
              runtime/minecraft-fabric-1.21.9
              integration/minecraft-fabric-1.21.9
              runtime/minecraft-fabric-1.21.10
              integration/minecraft-fabric-1.21.10
              runtime/minecraft-fabric-1.21.11
              integration/minecraft-fabric-1.21.11
            cache_read_only: false
            loom_cache: true
            coverage: false
          - id: minecraft-26
            name: Minecraft 26.x and showcase
            gradle_arguments: :ciMinecraftCheck :integration:docs:check -Pstrata.minecraftVersions=26.1,26.2
            loom_projects: |-
              runtime/minecraft-fabric-26.1
              integration/minecraft-fabric-26.1
              runtime/minecraft-fabric-26.2
              integration/minecraft-fabric-26.2
            cache_read_only: false
            loom_cache: true
            coverage: false
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ matrix.cache_read_only || github.ref != 'refs/heads/master' }}
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Hash Loom cache inputs
        if: matrix.loom_cache
        id: loom_inputs
        shell: bash
        env:
          LOOM_PROJECTS: ${{ matrix.loom_projects }}
        run: bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
      - name: Restore Loom project cache
        if: matrix.loom_cache
        id: loom_cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ matrix.id }}-${{ steps.loom_inputs.outputs.hash }}
          restore-keys: |
            loom-${{ runner.os }}-${{ matrix.id }}-
      - name: Run ${{ matrix.name }}
        # Loom's client run tasks select xvfb-run automatically on Linux when CI is true.
        run: bash ./gradlew ${{ matrix.gradle_arguments }}
      - name: Save Loom project cache
        if: success() && matrix.loom_cache && github.ref == 'refs/heads/master' && steps.loom_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .gradle/loom-cache
          key: ${{ steps.loom_cache.outputs.cache-primary-key }}
      - name: Upload coverage reports
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: kover-reports
          path: build/reports/kover
          if-no-files-found: error
