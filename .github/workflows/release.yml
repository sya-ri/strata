name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release once, or run final verification after Modrinth approval
        required: true
        type: choice
        default: release
        options:
          - release
          - verify
      tag:
        description: Exact release tag
        required: true
        type: string
        default: v0.1.0
      modrinth_project_id:
        description: Optional cross-check of the committed immutable Modrinth project ID
        required: false
        type: string
      confirmation:
        description: Type "release v0.1.0" or "verify v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.operation == 'release'
    permissions:
      actions: read
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    outputs:
      controller_commit: ${{ steps.tag.outputs.controller_commit }}
      tag_commit: ${{ steps.tag.outputs.tag_commit }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
      pages_artifact_id: ${{ steps.pages.outputs.pages_artifact_id }}
      pages_deployment_id: ${{ steps.pages.outputs.pages_deployment_id }}
      pages_run_id: ${{ steps.pages.outputs.pages_run_id }}
      pages_controller_artifact_id: ${{ steps.pages.outputs.pages_controller_artifact_id }}
      pages_controller_deployment_id: ${{ steps.pages.outputs.pages_controller_deployment_id }}
      pages_controller_run_id: ${{ steps.pages.outputs.pages_controller_run_id }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate read-only release request
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Release must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v0.1.0" ]] || { echo 'This workflow is pinned to v0.1.0.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "release $RELEASE_TAG" ]] || { echo 'Release confirmation does not match.' >&2; exit 1; }
          bash -n release/verify-github-tag-ruleset.sh
          bash -n release/verify-release-tag.sh
          bash release/verify-github-tag-ruleset.sh >/dev/null
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Checked-out controller differs from the workflow commit.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller SHA is not the exact origin/master head.' >&2; exit 1; }
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          tag_record="$(bash release/verify-release-tag.sh "$RELEASE_TAG" "$tag_commit")"
          read -r tag_object tag_commit <<< "$tag_record"
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed during tag verification.' >&2; exit 1; }
          git merge-base --is-ancestor "$tag_commit" origin/master || { echo 'The release tag is not contained in the controller master.' >&2; exit 1; }
          root_version="$(git show "${tag_commit}:build.gradle.kts" | sed -nE 's/^version = "([^"]+)"$/\1/p')"
          [[ "$root_version" == "${RELEASE_TAG#v}" ]] || { echo "Root version $root_version does not match $RELEASE_TAG." >&2; exit 1; }
          {
            echo "controller_commit=$GITHUB_SHA"
            echo "tag_commit=$tag_commit"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful exact-SHA CI and immutable tagged Pages
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          set -euo pipefail
          mapfile -t required_commits < <(printf '%s\n' "$GITHUB_SHA" "$TAG_COMMIT" | sort --unique)
          for workflow in jvm.yml qodana.yml; do
            for required_commit in "${required_commits[@]}"; do
              runs="$(gh run list --workflow "$workflow" --commit "$required_commit" --status completed --limit 100 --json conclusion,event,headBranch,headSha)"
              jq -e --arg commit "$required_commit" \
                'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $commit)' \
                <<< "$runs" >/dev/null || {
                echo "No successful $workflow run exists for $required_commit." >&2
                exit 1
              }
            done
          done
          pages_runs="$(
            gh run list --workflow pages.yml --commit "$TAG_COMMIT" --event push --status completed --limit 100 \
              --json conclusion,databaseId,event,headBranch,headSha
          )"
          pages_run_id="$(
            jq -er --arg tag "$RELEASE_TAG" --arg sha "$TAG_COMMIT" '
              [
                .[] |
                select(.conclusion == "success" and .event == "push" and .headBranch == $tag and .headSha == $sha)
              ] |
              select(length == 1) |
              .[0].databaseId |
              select(type == "number" and . > 0 and . == floor) |
              tostring
            ' <<< "$pages_runs"
          )" || {
            echo "No successful tag-triggered pages.yml run exists for $RELEASE_TAG at $TAG_COMMIT." >&2
            exit 1
          }
          controller_pages_runs="$(
            gh run list --workflow pages.yml --commit "$GITHUB_SHA" --event push --status completed --limit 100 \
              --json conclusion,databaseId,event,headBranch,headSha
          )"
          controller_pages_run_id="$(
            jq -er --arg sha "$GITHUB_SHA" '
              [
                .[] |
                select(.conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $sha)
              ] |
              select(length == 1) |
              .[0].databaseId |
              select(type == "number" and . > 0 and . == floor) |
              tostring
            ' <<< "$controller_pages_runs"
          )" || {
            echo "No successful master pages.yml run exists for the controller commit $GITHUB_SHA." >&2
            exit 1
          }
          bash -n release/verify-pages-deployment-source.sh
          pages_record="$(bash release/verify-pages-deployment-source.sh \
            "$pages_run_id" "$RELEASE_TAG" "$TAG_COMMIT" "$controller_pages_run_id" "$GITHUB_SHA")"
          read -r \
            verified_run_id \
            pages_artifact_id \
            pages_deployment_id \
            verified_controller_run_id \
            pages_controller_artifact_id \
            pages_controller_deployment_id <<< "$pages_record"
          [[ "$verified_run_id" == "$pages_run_id" ]] || { echo 'Verified Pages run ID differs from the selected run.' >&2; exit 1; }
          [[ "$verified_controller_run_id" == "$controller_pages_run_id" ]] || {
            echo 'Verified controller Pages run ID differs from the selected run.' >&2
            exit 1
          }
          bash -n release/wait-for-pages-source-receipt.sh
          bash release/wait-for-pages-source-receipt.sh "$RELEASE_TAG" "$TAG_COMMIT" "$GITHUB_SHA"
          pages_record_after_poll="$(bash release/verify-pages-deployment-source.sh \
            "$pages_run_id" "$RELEASE_TAG" "$TAG_COMMIT" "$controller_pages_run_id" "$GITHUB_SHA")"
          [[ "$pages_record_after_poll" == "$pages_record" ]] || {
            echo 'Pages provenance changed while polling the public receipts.' >&2
            exit 1
          }
          {
            echo "pages_artifact_id=$pages_artifact_id"
            echo "pages_deployment_id=$pages_deployment_id"
            echo "pages_run_id=$pages_run_id"
            echo "pages_controller_artifact_id=$pages_controller_artifact_id"
            echo "pages_controller_deployment_id=$pages_controller_deployment_id"
            echo "pages_controller_run_id=$controller_pages_run_id"
          } >> "$GITHUB_OUTPUT"

  release:
    if: inputs.operation == 'release'
    needs: preflight
    permissions:
      actions: read
      contents: write
      deployments: read
    environment:
      name: release
      url: https://github.com/sya-ri/strata/releases/tag/${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.tag_commit }}
      - name: Revalidate protected release request and public source receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
          EXPECTED_PAGES_ARTIFACT_ID: ${{ needs.preflight.outputs.pages_artifact_id }}
          EXPECTED_PAGES_DEPLOYMENT_ID: ${{ needs.preflight.outputs.pages_deployment_id }}
          EXPECTED_PAGES_RUN_ID: ${{ needs.preflight.outputs.pages_run_id }}
          EXPECTED_PAGES_CONTROLLER_ARTIFACT_ID: ${{ needs.preflight.outputs.pages_controller_artifact_id }}
          EXPECTED_PAGES_CONTROLLER_DEPLOYMENT_ID: ${{ needs.preflight.outputs.pages_controller_deployment_id }}
          EXPECTED_PAGES_CONTROLLER_RUN_ID: ${{ needs.preflight.outputs.pages_controller_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Release must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v0.1.0" ]] || { echo 'This workflow is pinned to v0.1.0.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "release $RELEASE_TAG" ]] || { echo 'Release confirmation does not match.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$GITHUB_SHA" == "$EXPECTED_CONTROLLER_COMMIT" ]] || { echo 'Protected job controller differs from read-only preflight.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Checked-out release source differs from the preflight tag commit.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller SHA is no longer the exact origin/master head.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'The release tag is no longer contained in controller master.' >&2; exit 1; }
          bash release/verify-github-tag-ruleset.sh >/dev/null
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed during protected tag verification.' >&2; exit 1; }
          root_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)"
          [[ "$root_version" == "${RELEASE_TAG#v}" ]] || { echo "Root version $root_version does not match $RELEASE_TAG." >&2; exit 1; }
          load_controller_script() {
            local source_path="$1"
            local destination="$2"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git ls-tree "$EXPECTED_CONTROLLER_COMMIT" -- "$source_path")"
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$source_path" ]] || {
              echo "The controller script is not the expected regular Git blob: $source_path" >&2
              exit 1
            }
            [[ ! -e "$destination" && ! -L "$destination" ]] || {
              echo "Controller script destination already exists: $destination" >&2
              exit 1
            }
            git cat-file blob "$blob" > "$destination"
            bash -n "$destination"
          }
          pages_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-pages-tools.XXXXXX")"
          [[ -d "$pages_tool_directory" && ! -L "$pages_tool_directory" ]] || {
            echo 'Failed to create a regular Pages tool directory.' >&2
            exit 1
          }
          trap 'rm -rf -- "$pages_tool_directory"' EXIT
          pages_verifier="$pages_tool_directory/verify-pages-deployment-source.sh"
          pages_waiter="$pages_tool_directory/wait-for-pages-source-receipt.sh"
          load_controller_script release/verify-pages-deployment-source.sh "$pages_verifier"
          load_controller_script release/wait-for-pages-source-receipt.sh "$pages_waiter"
          bash -n "$pages_verifier"
          pages_record="$(bash "$pages_verifier" \
            "$EXPECTED_PAGES_RUN_ID" \
            "$RELEASE_TAG" \
            "$EXPECTED_TAG_COMMIT" \
            "$EXPECTED_PAGES_CONTROLLER_RUN_ID" \
            "$EXPECTED_CONTROLLER_COMMIT")"
          expected_pages_record="$EXPECTED_PAGES_RUN_ID $EXPECTED_PAGES_ARTIFACT_ID $EXPECTED_PAGES_DEPLOYMENT_ID"
          expected_pages_record+=" $EXPECTED_PAGES_CONTROLLER_RUN_ID"
          expected_pages_record+=" $EXPECTED_PAGES_CONTROLLER_ARTIFACT_ID $EXPECTED_PAGES_CONTROLLER_DEPLOYMENT_ID"
          [[ "$pages_record" == "$expected_pages_record" ]] || {
            echo 'Protected Pages evidence differs from read-only preflight.' >&2
            exit 1
          }
          bash "$pages_waiter" "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_CONTROLLER_COMMIT"
          pages_record_after_poll="$(bash "$pages_verifier" \
            "$EXPECTED_PAGES_RUN_ID" \
            "$RELEASE_TAG" \
            "$EXPECTED_TAG_COMMIT" \
            "$EXPECTED_PAGES_CONTROLLER_RUN_ID" \
            "$EXPECTED_CONTROLLER_COMMIT")"
          [[ "$pages_record_after_poll" == "$expected_pages_record" ]] || {
            echo 'Protected Pages provenance changed while polling the public receipts.' >&2
            exit 1
          }
          echo "RELEASE_SOURCE_COMMIT=$EXPECTED_TAG_COMMIT" >> "$GITHUB_ENV"
          {
            echo '### Release provenance'
            echo
            echo "- Controller commit: \`$EXPECTED_CONTROLLER_COMMIT\`"
            echo "- Release source commit: \`$EXPECTED_TAG_COMMIT\`"
            echo "- Signed release tag: \`$RELEASE_TAG\`"
            echo "- Signed tag object: \`$EXPECTED_TAG_OBJECT\`"
            echo "- Release Pages run / artifact / deployment: \`$EXPECTED_PAGES_RUN_ID $EXPECTED_PAGES_ARTIFACT_ID $EXPECTED_PAGES_DEPLOYMENT_ID\`"
            echo "- Controller Pages run / artifact / deployment: \`$EXPECTED_PAGES_CONTROLLER_RUN_ID $EXPECTED_PAGES_CONTROLLER_ARTIFACT_ID $EXPECTED_PAGES_CONTROLLER_DEPLOYMENT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Load the audited Modrinth controller overlay
        id: controller_overlay
        shell: bash
        env:
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          overlay_directory="$RUNNER_TEMP/strata-controller-overlay-inputs"
          mkdir -p "$overlay_directory"
          runner="$overlay_directory/run-controller-overlay.sh"
          manifest="$overlay_directory/v0.1.0-modrinth-generic-draft.json"
          patch="$overlay_directory/v0.1.0-modrinth-generic-draft.patch"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/run-controller-overlay.sh" > "$runner"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/controller-overlays/v0.1.0-modrinth-generic-draft.json" > "$manifest"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/controller-overlays/v0.1.0-modrinth-generic-draft.patch" > "$patch"
          bash -n "$runner"
          [[ "$(jq -er '.baseTag' "$manifest")" == "$RELEASE_TAG" ]] || { echo 'Controller overlay tag differs.' >&2; exit 1; }
          [[ "$(jq -er '.baseCommit' "$manifest")" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Controller overlay base commit differs.' >&2; exit 1; }
          patch_sha256="$(sha256sum "$patch" | cut -d ' ' -f 1)"
          [[ "$patch_sha256" == "$(jq -er '.patchSha256' "$manifest")" ]] || { echo 'Controller overlay patch hash differs.' >&2; exit 1; }
          {
            echo "runner=$runner"
            echo "manifest=$manifest"
            echo "patch=$patch"
            echo "directory=$overlay_directory"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Audited release-controller overlay'
            echo
            echo "- Manifest SHA-256: \`$(sha256sum "$manifest" | cut -d ' ' -f 1)\`"
            echo "- Patch SHA-256: \`$patch_sha256\`"
            echo '- Scope: Modrinth preflight and stage only; tagged product artifacts remain immutable.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Load the audited Central controller overlay
        id: central_controller_overlay
        shell: bash
        env:
          EXPECTED_CONTROLLER_COMMIT: ${{ needs.preflight.outputs.controller_commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          overlay_directory="$RUNNER_TEMP/strata-central-controller-overlay-inputs"
          mkdir -p "$overlay_directory"
          runner="$overlay_directory/run-central-controller-overlay.sh"
          manifest="$overlay_directory/v0.1.0-central-signature-checksums.json"
          patch="$overlay_directory/v0.1.0-central-signature-checksums.patch"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/run-central-controller-overlay.sh" > "$runner"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/controller-overlays/v0.1.0-central-signature-checksums.json" > "$manifest"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/controller-overlays/v0.1.0-central-signature-checksums.patch" > "$patch"
          bash -n "$runner"
          [[ "$(jq -er '.baseTag' "$manifest")" == "$RELEASE_TAG" ]] || { echo 'Central controller overlay tag differs.' >&2; exit 1; }
          [[ "$(jq -er '.baseCommit' "$manifest")" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Central controller overlay base commit differs.' >&2; exit 1; }
          patch_sha256="$(sha256sum "$patch" | cut -d ' ' -f 1)"
          [[ "$patch_sha256" == "$(jq -er '.patchSha256' "$manifest")" ]] || { echo 'Central controller overlay patch hash differs.' >&2; exit 1; }
          {
            echo "runner=$runner"
            echo "manifest=$manifest"
            echo "patch=$patch"
            echo "directory=$overlay_directory"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Audited Central release-controller overlay'
            echo
            echo "- Manifest SHA-256: \`$(sha256sum "$manifest" | cut -d ' ' -f 1)\`"
            echo "- Patch SHA-256: \`$patch_sha256\`"
            echo '- Scope: read-only Central preflight and verification only; tagged product artifacts and remote state remain immutable.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve immutable Modrinth project ID
        id: modrinth
        shell: bash
        env:
          REQUESTED_PROJECT_ID: ${{ inputs.modrinth_project_id }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          tracked="$(jq -r '.projectId // empty' release/modrinth-project.json)"
          if [[ -n "$tracked" && -n "$REQUESTED_PROJECT_ID" && "$tracked" != "$REQUESTED_PROJECT_ID" ]]; then
            echo 'Requested Modrinth project ID differs from tracked immutable ID.' >&2
            exit 1
          fi
          project_id="${tracked:-$REQUESTED_PROJECT_ID}"
          [[ -n "$MODRINTH_TOKEN" ]] || { echo 'MODRINTH_TOKEN is required for the complete release.' >&2; exit 1; }
          [[ -n "$tracked" ]] || { echo 'The immutable Modrinth project ID must be committed to release/modrinth-project.json before staging.' >&2; exit 1; }
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      - name: Require release signing credentials
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY" ]] || { echo 'SIGNING_KEY is missing.' >&2; exit 1; }
          [[ -n "$SIGNING_PASSWORD" ]] || { echo 'SIGNING_PASSWORD is missing.' >&2; exit 1; }
      - name: Rerun release quality, documentation, and Skill gates
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            :check :api:check :integration:api:check :integration:docs:check \
            :integration:docs:checkDokkaPagesStaging \
            :quality:benchmarks:check :quality:detekt-rules:check \
            :runtime:core:check :runtime:headless:check :runtime:minecraft:check \
            :koverJvmTests :koverHtmlReport :koverXmlReport -Pkover \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
      - name: Verify generated release-source receipts
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' source_receipts < <(find build/dokka/html -type f -name source-receipt.json -print0)
          [[ "${#source_receipts[@]}" != "0" ]] || { echo 'No generated source receipts were found.' >&2; exit 1; }
          for source_receipt in "${source_receipts[@]}"; do
            jq -e --arg commit "$RELEASE_SOURCE_COMMIT" --arg revision "$RELEASE_TAG" \
              'keys == ["commit", "revision"] and .commit == $commit and .revision == $revision' \
              "$source_receipt" >/dev/null || {
              echo "Generated source receipt differs from the release source: $source_receipt" >&2
              exit 1
            }
          done
      - name: Build deterministic release manifest and verify published-coordinate consumer
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
            verifyReleasePublicationMatrix verifyPublishedConsumer modrinthReleaseManifest \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
      - name: Run representative loaded clients from Maven-local coordinates
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          representative_tasks=(
            :integration:minecraft-fabric-1.20.1:runPublishedCoordinateClientGameTest
            :integration:minecraft-fabric-1.21.11:runPublishedCoordinateClientGameTest
            :integration:minecraft-fabric-26.2:runPublishedCoordinateClientGameTest
          )
          for representative_task in "${representative_tasks[@]}"; do
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
              "$representative_task" \
              -Pstrata.releaseRepository="file://$HOME/.m2/repository" \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          done
      - name: Require the sealed Maven Central release
        id: central
        shell: bash
        env:
          CENTRAL_OVERLAY_RUNNER: ${{ steps.central_controller_overlay.outputs.runner }}
          CENTRAL_OVERLAY_MANIFEST: ${{ steps.central_controller_overlay.outputs.manifest }}
          CENTRAL_OVERLAY_PATCH: ${{ steps.central_controller_overlay.outputs.patch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash "$CENTRAL_OVERLAY_RUNNER" \
            release-preflight "$CENTRAL_OVERLAY_MANIFEST" "$CENTRAL_OVERLAY_PATCH" \
            "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$GITHUB_SHA"
          state="$(jq -r '.state' build/release/maven-central/preflight.json)"
          central_coordinate_count="$(jq -r '.coordinateCount' build/release/maven-central/preflight.json)"
          central_file_count="$(jq -r '.verifiedFileCount' build/release/maven-central/preflight.json)"
          central_checksum_count="$(jq -r '.verifiedChecksumCount' build/release/maven-central/preflight.json)"
          [[ "$central_coordinate_count" == "24" ]] || {
            echo "Central repository coordinate evidence differs: $central_coordinate_count" >&2
            exit 1
          }
          [[ "$state" == "exact" && "$central_file_count" == "240" && "$central_checksum_count" == "480" ]] || {
            echo "The sealed Central release differs: state=$state files=$central_file_count checksums=$central_checksum_count" >&2
            exit 1
          }
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Verify Central and build the canonical GitHub bundle
        shell: bash
        env:
          CENTRAL_OVERLAY_RUNNER: ${{ steps.central_controller_overlay.outputs.runner }}
          CENTRAL_OVERLAY_MANIFEST: ${{ steps.central_controller_overlay.outputs.manifest }}
          CENTRAL_OVERLAY_PATCH: ${{ steps.central_controller_overlay.outputs.patch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash "$CENTRAL_OVERLAY_RUNNER" \
            release-verify "$CENTRAL_OVERLAY_MANIFEST" "$CENTRAL_OVERLAY_PATCH" \
            "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$GITHUB_SHA"
          [[ "$(jq -r '.state' build/release/maven-central/verify.json)" == "exact" \
            && "$(jq -r '.coordinateCount' build/release/maven-central/verify.json)" == "24" \
            && "$(jq -r '.verifiedFileCount' build/release/maven-central/verify.json)" == "240" \
            && "$(jq -r '.verifiedChecksumCount' build/release/maven-central/verify.json)" == "480" ]] || {
            echo 'Existing Central release evidence counts differ.' >&2
            exit 1
          }
      - name: Cryptographically verify canonical Central signatures
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf -- "$key_file" "$gnupg_home"' EXIT
          chmod 600 "$key_file"
          chmod 700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf '%s' "$SIGNING_KEY" > "$key_file"
          if ! gpg --batch --quiet --import "$key_file"; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$key_file"
            gpg --batch --quiet --import "$key_file"
          fi
          verified=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            verified=$((verified + 1))
          done < <(find build/release/maven-central/evidence -type f -name '*.asc' -print0)
          [[ "$verified" == "120" ]] || { echo "Expected 120 verified Central signatures, found $verified." >&2; exit 1; }
          shopt -s nullglob
          jars=(build/release/github/*.jar)
          [[ "${#jars[@]}" == "20" ]] || { echo "Expected 20 signed GitHub JARs, found ${#jars[@]}." >&2; exit 1; }
          for jar in "${jars[@]}"; do
            gpg --batch --verify "$jar.asc" "$jar"
          done
      - name: Preflight all Modrinth versions without mutation
        shell: bash
        env:
          CONTROLLER_OVERLAY_RUNNER: ${{ steps.controller_overlay.outputs.runner }}
          CONTROLLER_OVERLAY_MANIFEST: ${{ steps.controller_overlay.outputs.manifest }}
          CONTROLLER_OVERLAY_PATCH: ${{ steps.controller_overlay.outputs.patch }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash "$CONTROLLER_OVERLAY_RUNNER" \
            preflight "$CONTROLLER_OVERLAY_MANIFEST" "$CONTROLLER_OVERLAY_PATCH" \
            "$PROJECT_ID" "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$GITHUB_SHA"
      - name: Preflight GitHub Release without mutation
        shell: bash
        env:
          CENTRAL_STATE: ${{ steps.central.outputs.state }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          load_controller_script() {
            local source_path="$1"
            local destination="$2"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git ls-tree "$GITHUB_SHA" -- "$source_path")"
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$source_path" ]] || {
              echo "The controller script is not the expected regular Git blob: $source_path" >&2
              exit 1
            }
            [[ ! -e "$destination" && ! -L "$destination" ]] || {
              echo "Controller script destination already exists: $destination" >&2
              exit 1
            }
            git cat-file blob "$blob" > "$destination"
            bash -n "$destination"
          }
          github_release_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-github-release-tools.XXXXXX")"
          [[ -d "$github_release_tool_directory" && ! -L "$github_release_tool_directory" ]] || {
            echo 'Failed to create a regular GitHub Release tool directory.' >&2
            exit 1
          }
          trap 'rm -rf -- "$github_release_tool_directory"' EXIT
          github_release_preflight="$github_release_tool_directory/github-release-preflight.sh"
          load_controller_script release/github-release-preflight.sh "$github_release_preflight"
          bash "$github_release_preflight" build/release/github
      - name: Cryptographically verify all staged Maven Local signatures
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf -- "$key_file" "$gnupg_home"' EXIT
          chmod 600 "$key_file"
          chmod 700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf '%s' "$SIGNING_KEY" > "$key_file"
          if ! gpg --batch --quiet --import "$key_file"; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$key_file"
            gpg --batch --quiet --import "$key_file"
          fi
          verified=0
          while IFS=: read -r group artifact version; do
            [[ -n "$group" && -n "$artifact" && -n "$version" ]] || continue
            group_path="$(tr '.' '/' <<< "$group")"
            directory="$HOME/.m2/repository/$group_path/$artifact/$version"
            for suffix in .pom .module .jar -sources.jar -javadoc.jar; do
              base="$directory/$artifact-$version$suffix"
              signature="$base.asc"
              [[ -s "$base" && -s "$signature" ]] || {
                echo "Staged Maven Local signed file is missing: $base" >&2
                exit 1
              }
              gpg --batch --verify "$signature" "$base"
              verified=$((verified + 1))
            done
          done < release/maven-coordinates.txt
          [[ "$verified" == "120" ]] || { echo "Expected 120 verified Maven Local signatures, found $verified." >&2; exit 1; }
      - name: Stage listed Modrinth versions
        shell: bash
        env:
          CONTROLLER_OVERLAY_RUNNER: ${{ steps.controller_overlay.outputs.runner }}
          CONTROLLER_OVERLAY_MANIFEST: ${{ steps.controller_overlay.outputs.manifest }}
          CONTROLLER_OVERLAY_PATCH: ${{ steps.controller_overlay.outputs.patch }}
          CONTROLLER_OVERLAY_DIRECTORY: ${{ steps.controller_overlay.outputs.directory }}
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          bash release/verify-github-tag-ruleset.sh >/dev/null
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release workspace changed before Modrinth staging.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed before Modrinth staging.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source is no longer contained in controller master.' >&2; exit 1; }
          git diff --quiet -- . || { echo 'Tracked release source changed before Modrinth staging.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Staged release source changed before Modrinth staging.' >&2; exit 1; }
          bash "$CONTROLLER_OVERLAY_RUNNER" \
            stage "$CONTROLLER_OVERLAY_MANIFEST" "$CONTROLLER_OVERLAY_PATCH" \
            "$PROJECT_ID" "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$GITHUB_SHA"
          expected_overlay_directory="$RUNNER_TEMP/strata-controller-overlay-inputs"
          [[ "$CONTROLLER_OVERLAY_DIRECTORY" == "$expected_overlay_directory" ]] || {
            echo 'Controller overlay cleanup target differs from its exact temporary directory.' >&2
            exit 1
          }
          [[ -d "$CONTROLLER_OVERLAY_DIRECTORY" && ! -L "$CONTROLLER_OVERLAY_DIRECTORY" ]] || {
            echo 'Controller overlay cleanup target is not a regular temporary directory.' >&2
            exit 1
          }
          rm -rf -- "$CONTROLLER_OVERLAY_DIRECTORY"
          [[ ! -e "$CONTROLLER_OVERLAY_DIRECTORY" ]] || {
            echo 'Controller overlay inputs remained after successful Modrinth staging.' >&2
            exit 1
          }
      - name: Remove Central controller overlay inputs
        if: always() && steps.central_controller_overlay.outcome == 'success'
        shell: bash
        env:
          CENTRAL_OVERLAY_DIRECTORY: ${{ steps.central_controller_overlay.outputs.directory }}
        run: |
          set -euo pipefail
          expected_overlay_directory="$RUNNER_TEMP/strata-central-controller-overlay-inputs"
          [[ "$CENTRAL_OVERLAY_DIRECTORY" == "$expected_overlay_directory" ]] || {
            echo 'Central controller overlay cleanup target differs from its exact temporary directory.' >&2
            exit 1
          }
          [[ -d "$CENTRAL_OVERLAY_DIRECTORY" && ! -L "$CENTRAL_OVERLAY_DIRECTORY" ]] || {
            echo 'Central controller overlay cleanup target is not a regular temporary directory.' >&2
            exit 1
          }
          rm -rf -- "$CENTRAL_OVERLAY_DIRECTORY"
          [[ ! -e "$CENTRAL_OVERLAY_DIRECTORY" ]] || {
            echo 'Central controller overlay inputs remained after Central verification.' >&2
            exit 1
          }
      - name: Rerun representative loaded clients from Maven Central
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          representative_tasks=(
            :integration:minecraft-fabric-1.20.1:runPublishedCoordinateClientGameTest
            :integration:minecraft-fabric-1.21.11:runPublishedCoordinateClientGameTest
            :integration:minecraft-fabric-26.2:runPublishedCoordinateClientGameTest
          )
          for representative_task in "${representative_tasks[@]}"; do
            bash ./gradlew --no-parallel --max-workers=2 --no-build-cache \
              "$representative_task" \
              -Pstrata.releaseRepository=https://repo1.maven.org/maven2 \
              -Pstrata.sourceRevision="$RELEASE_TAG" \
              -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT"
          done
      - name: Create or verify GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          bash release/verify-github-tag-ruleset.sh >/dev/null
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release workspace changed before GitHub Release mutation.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed before GitHub Release mutation.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source is no longer contained in controller master.' >&2; exit 1; }
          git diff --quiet -- . || { echo 'Tracked release source changed before GitHub Release mutation.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Staged release source changed before GitHub Release mutation.' >&2; exit 1; }
          temporary="$(mktemp -d)"
          verified="$(mktemp -d)"
          actual_body_file="$(mktemp)"
          trap 'rm -rf -- "$temporary" "$verified" "$actual_body_file"' EXIT
          expected_title="Strata ${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease)"
            [[ "$(jq -r '.tagName' <<< "$release_json")" == "$RELEASE_TAG" ]] || { echo 'Existing GitHub release tag differs.' >&2; exit 1; }
            [[ "$(jq -r '.name' <<< "$release_json")" == "$expected_title" ]] || { echo 'Existing GitHub release title differs.' >&2; exit 1; }
            jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | if contains("\r") then error("release body contains a lone carriage return") else @base64 end' <<< "$release_json" |
              base64 --decode > "$actual_body_file"
            cmp --silent "docs/releases/$RELEASE_TAG.md" "$actual_body_file" || { echo 'Existing GitHub release body differs.' >&2; exit 1; }
            [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]] || { echo 'The stable GitHub release must not be a prerelease.' >&2; exit 1; }
            release_draft="$(jq -r '.isDraft' <<< "$release_json")"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Strata ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
            release_draft=true
          fi
          shopt -s nullglob
          (cd build/release/github && sha256sum --check SHA256SUMS)
          assets=(build/release/github/*)
          [[ "${#assets[@]}" == "41" ]] || { echo "Expected 41 GitHub assets, found ${#assets[@]}." >&2; exit 1; }
          expected="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          unexpected="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))"
          [[ -z "$unexpected" ]] || { echo "GitHub release contains unexpected assets: $unexpected" >&2; exit 1; }
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if grep --fixed-strings --line-regexp "$name" <<< "$actual" >/dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$temporary"
              cmp --silent "$asset" "$temporary/$name" || { echo "Existing GitHub asset differs: $name" >&2; exit 1; }
            else
              [[ "$release_draft" == "true" ]] || { echo "Published GitHub release is missing immutable asset: $name" >&2; exit 1; }
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected" ]] || { echo 'GitHub release contains missing or unexpected assets.' >&2; exit 1; }
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$verified"
            cmp --silent "$asset" "$verified/$name" || { echo "Uploaded GitHub asset differs: $name" >&2; exit 1; }
          done
          if [[ "$release_draft" == "true" ]]; then
            bash release/verify-github-tag-ruleset.sh >/dev/null
            bash release/verify-release-tag.sh "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release workspace changed before publishing the GitHub Release.' >&2; exit 1; }
            [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed before publishing the GitHub Release.' >&2; exit 1; }
            git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source is no longer contained in controller master.' >&2; exit 1; }
            git diff --quiet -- . || { echo 'Tracked release source changed before publishing the GitHub Release.' >&2; exit 1; }
            git diff --cached --quiet -- . || { echo 'Staged release source changed before publishing the GitHub Release.' >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease)"
          [[ "$(jq -r '.tagName' <<< "$release_json")" == "$RELEASE_TAG" ]] || { echo 'Published GitHub release tag differs.' >&2; exit 1; }
          [[ "$(jq -r '.name' <<< "$release_json")" == "$expected_title" ]] || { echo 'Published GitHub release title differs.' >&2; exit 1; }
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | if contains("\r") then error("release body contains a lone carriage return") else @base64 end' <<< "$release_json" |
            base64 --decode > "$actual_body_file"
          cmp --silent "docs/releases/$RELEASE_TAG.md" "$actual_body_file" || { echo 'Published GitHub release body differs.' >&2; exit 1; }
          [[ "$(jq -r '.isDraft' <<< "$release_json")" == "false" ]] || { echo 'GitHub release remains a draft.' >&2; exit 1; }
          [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]] || { echo 'GitHub release is unexpectedly a prerelease.' >&2; exit 1; }
      - name: Submit the completely staged Modrinth project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          bash release/verify-github-tag-ruleset.sh >/dev/null
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$EXPECTED_TAG_COMMIT" "$EXPECTED_TAG_OBJECT" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]] || { echo 'Release workspace changed before Modrinth submission.' >&2; exit 1; }
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Controller master changed before Modrinth submission.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" origin/master || { echo 'Release source is no longer contained in controller master.' >&2; exit 1; }
          git diff --quiet -- . || { echo 'Tracked release source changed before Modrinth submission.' >&2; exit 1; }
          git diff --cached --quiet -- . || { echo 'Staged release source changed before Modrinth submission.' >&2; exit 1; }
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseSubmit \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
          echo '::notice::Modrinth submission is processing. Dispatch operation=verify after project approval.'

  verify:
    if: inputs.operation == 'verify'
    permissions:
      actions: read
      contents: read
      deployments: read
    environment:
      name: release
      url: https://modrinth.com/mod/strata-ui
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Validate final verification request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo 'Verification must be dispatched from master.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v0.1.0" ]] || { echo 'This workflow is pinned to v0.1.0.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "verify $RELEASE_TAG" ]] || { echo 'Verification confirmation does not match.' >&2; exit 1; }
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          checked_sha="$(git rev-parse HEAD)"
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Verification controller is not the exact origin/master head.' >&2; exit 1; }
          [[ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$checked_sha" ]] || { echo 'Checked-out tag mismatch.' >&2; exit 1; }
          git merge-base --is-ancestor "$checked_sha" origin/master || { echo 'The release tag is no longer contained in master.' >&2; exit 1; }
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          bash release/verify-github-tag-ruleset.sh >/dev/null
          bash release/verify-release-tag.sh "$RELEASE_TAG" "$checked_sha" "$tag_object" >/dev/null
          [[ "$(git rev-parse origin/master)" == "$GITHUB_SHA" ]] || { echo 'Verification controller changed during tag verification.' >&2; exit 1; }
          root_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)"
          [[ "$root_version" == "${RELEASE_TAG#v}" ]] || { echo "Root version $root_version does not match $RELEASE_TAG." >&2; exit 1; }
          mapfile -t required_commits < <(printf '%s\n' "$GITHUB_SHA" "$checked_sha" | sort --unique)
          for workflow in jvm.yml qodana.yml; do
            for required_commit in "${required_commits[@]}"; do
              runs="$(gh run list --workflow "$workflow" --commit "$required_commit" --status completed --limit 100 --json conclusion,event,headBranch,headSha)"
              jq -e --arg commit "$required_commit" \
                'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $commit)' \
                <<< "$runs" >/dev/null || {
                echo "No successful $workflow run exists for $required_commit." >&2
                exit 1
              }
            done
          done
          pages_runs="$(
            gh run list --workflow pages.yml --commit "$checked_sha" --event push --status completed --limit 100 \
              --json conclusion,databaseId,event,headBranch,headSha
          )"
          pages_run_id="$(
            jq -er --arg tag "$RELEASE_TAG" --arg sha "$checked_sha" '
              [
                .[] |
                select(.conclusion == "success" and .event == "push" and .headBranch == $tag and .headSha == $sha)
              ] |
              select(length == 1) |
              .[0].databaseId |
              select(type == "number" and . > 0 and . == floor) |
              tostring
            ' <<< "$pages_runs"
          )" || {
            echo "No successful tag-triggered pages.yml run exists for $RELEASE_TAG at $checked_sha." >&2
            exit 1
          }
          controller_pages_runs="$(
            gh run list --workflow pages.yml --commit "$GITHUB_SHA" --event push --status completed --limit 100 \
              --json conclusion,databaseId,event,headBranch,headSha
          )"
          controller_pages_run_id="$(
            jq -er --arg sha "$GITHUB_SHA" '
              [
                .[] |
                select(.conclusion == "success" and .event == "push" and .headBranch == "master" and .headSha == $sha)
              ] |
              select(length == 1) |
              .[0].databaseId |
              select(type == "number" and . > 0 and . == floor) |
              tostring
            ' <<< "$controller_pages_runs"
          )" || {
            echo "No successful master pages.yml run exists for the verification controller commit $GITHUB_SHA." >&2
            exit 1
          }
          load_controller_script() {
            local source_path="$1"
            local destination="$2"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git ls-tree "$GITHUB_SHA" -- "$source_path")"
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$source_path" ]] || {
              echo "The controller script is not the expected regular Git blob: $source_path" >&2
              exit 1
            }
            [[ ! -e "$destination" && ! -L "$destination" ]] || {
              echo "Controller script destination already exists: $destination" >&2
              exit 1
            }
            git cat-file blob "$blob" > "$destination"
            bash -n "$destination"
          }
          pages_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-pages-tools.XXXXXX")"
          [[ -d "$pages_tool_directory" && ! -L "$pages_tool_directory" ]] || {
            echo 'Failed to create a regular Pages tool directory.' >&2
            exit 1
          }
          trap 'rm -rf -- "$pages_tool_directory"' EXIT
          pages_verifier="$pages_tool_directory/verify-pages-deployment-source.sh"
          pages_waiter="$pages_tool_directory/wait-for-pages-source-receipt.sh"
          load_controller_script release/verify-pages-deployment-source.sh "$pages_verifier"
          load_controller_script release/wait-for-pages-source-receipt.sh "$pages_waiter"
          pages_record="$(bash "$pages_verifier" \
            "$pages_run_id" "$RELEASE_TAG" "$checked_sha" "$controller_pages_run_id" "$GITHUB_SHA")"
          read -r \
            verified_release_run_id \
            pages_artifact_id \
            pages_deployment_id \
            verified_controller_run_id \
            pages_controller_artifact_id \
            pages_controller_deployment_id <<< "$pages_record"
          [[ "$verified_release_run_id" == "$pages_run_id" && \
            "$verified_controller_run_id" == "$controller_pages_run_id" ]] || {
            echo 'Final Pages evidence differs from the selected release or controller run.' >&2
            exit 1
          }
          bash "$pages_waiter" "$RELEASE_TAG" "$checked_sha" "$GITHUB_SHA"
          pages_record_after_poll="$(bash "$pages_verifier" \
            "$pages_run_id" "$RELEASE_TAG" "$checked_sha" "$controller_pages_run_id" "$GITHUB_SHA")"
          [[ "$pages_record_after_poll" == "$pages_record" ]] || {
            echo 'Final Pages provenance changed while polling the public receipts.' >&2
            exit 1
          }
          echo "RELEASE_SOURCE_COMMIT=$checked_sha" >> "$GITHUB_ENV"
          echo "PAGES_PROVENANCE_RECORD=$pages_record" >> "$GITHUB_ENV"
          {
            echo '### Final release verification provenance'
            echo
            echo "- Controller commit: \`$GITHUB_SHA\`"
            echo "- Release source commit: \`$checked_sha\`"
            echo "- Signed release tag: \`$RELEASE_TAG\`"
            echo "- Signed tag object: \`$tag_object\`"
            echo "- Release Pages run / artifact / deployment: \`$pages_run_id $pages_artifact_id $pages_deployment_id\`"
            echo "- Controller Pages run / artifact / deployment: \`$controller_pages_run_id $pages_controller_artifact_id $pages_controller_deployment_id\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Load the audited Central controller overlay
        id: central_controller_overlay
        shell: bash
        env:
          EXPECTED_CONTROLLER_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          overlay_directory="$RUNNER_TEMP/strata-central-controller-overlay-inputs"
          mkdir -p "$overlay_directory"
          runner="$overlay_directory/run-central-controller-overlay.sh"
          manifest="$overlay_directory/v0.1.0-central-signature-checksums.json"
          patch="$overlay_directory/v0.1.0-central-signature-checksums.patch"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/run-central-controller-overlay.sh" > "$runner"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/controller-overlays/v0.1.0-central-signature-checksums.json" > "$manifest"
          git show "$EXPECTED_CONTROLLER_COMMIT:release/controller-overlays/v0.1.0-central-signature-checksums.patch" > "$patch"
          bash -n "$runner"
          [[ "$(jq -er '.baseTag' "$manifest")" == "$RELEASE_TAG" ]] || { echo 'Central controller overlay tag differs.' >&2; exit 1; }
          [[ "$(jq -er '.baseCommit' "$manifest")" == "$RELEASE_SOURCE_COMMIT" ]] || { echo 'Central controller overlay base commit differs.' >&2; exit 1; }
          patch_sha256="$(sha256sum "$patch" | cut -d ' ' -f 1)"
          [[ "$patch_sha256" == "$(jq -er '.patchSha256' "$manifest")" ]] || { echo 'Central controller overlay patch hash differs.' >&2; exit 1; }
          {
            echo "runner=$runner"
            echo "manifest=$manifest"
            echo "patch=$patch"
            echo "directory=$overlay_directory"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Audited final Central release-controller overlay'
            echo
            echo "- Manifest SHA-256: \`$(sha256sum "$manifest" | cut -d ' ' -f 1)\`"
            echo "- Patch SHA-256: \`$patch_sha256\`"
            echo '- Scope: read-only public Central verification only; tagged product artifacts and remote state remain immutable.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve required Modrinth credentials
        id: modrinth
        shell: bash
        env:
          REQUESTED_PROJECT_ID: ${{ inputs.modrinth_project_id }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          tracked="$(jq -r '.projectId // empty' release/modrinth-project.json)"
          if [[ -n "$tracked" && -n "$REQUESTED_PROJECT_ID" && "$tracked" != "$REQUESTED_PROJECT_ID" ]]; then
            echo 'Requested Modrinth project ID differs from tracked immutable ID.' >&2
            exit 1
          fi
          project_id="${tracked:-$REQUESTED_PROJECT_ID}"
          [[ -n "$MODRINTH_TOKEN" ]] || { echo 'MODRINTH_TOKEN is required for final verification.' >&2; exit 1; }
          [[ -n "$tracked" ]] || { echo 'The immutable Modrinth project ID must be committed before final verification.' >&2; exit 1; }
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      - name: Rebuild deterministic release evidence
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache verifyPublishedConsumer modrinthReleaseManifest \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
      - name: Verify the sealed Maven Central release remains exact
        shell: bash
        env:
          CENTRAL_OVERLAY_RUNNER: ${{ steps.central_controller_overlay.outputs.runner }}
          CENTRAL_OVERLAY_MANIFEST: ${{ steps.central_controller_overlay.outputs.manifest }}
          CENTRAL_OVERLAY_PATCH: ${{ steps.central_controller_overlay.outputs.patch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash "$CENTRAL_OVERLAY_RUNNER" \
            release-verify "$CENTRAL_OVERLAY_MANIFEST" "$CENTRAL_OVERLAY_PATCH" \
            "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" "$GITHUB_SHA"
          [[ "$(jq -r '.state' build/release/maven-central/verify.json)" == "exact" \
            && "$(jq -r '.coordinateCount' build/release/maven-central/verify.json)" == "24" \
            && "$(jq -r '.verifiedFileCount' build/release/maven-central/verify.json)" == "240" \
            && "$(jq -r '.verifiedChecksumCount' build/release/maven-central/verify.json)" == "480" ]] || {
            echo 'Final Central release evidence counts differ.' >&2
            exit 1
          }
      - name: Verify GitHub release assets and signatures remain exact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          actual_body_file="$(mktemp)"
          key_file="$(mktemp)"
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf -- "$temporary" "$actual_body_file" "$key_file" "$gnupg_home"' EXIT
          chmod 600 "$key_file"
          chmod 700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf '%s' "$SIGNING_KEY" > "$key_file"
          if ! gpg --batch --quiet --import "$key_file"; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$key_file"
            gpg --batch --quiet --import "$key_file"
          fi
          verified=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            verified=$((verified + 1))
          done < <(find build/release/maven-central/evidence -type f -name '*.asc' -print0)
          [[ "$verified" == "120" ]] || { echo "Expected 120 verified Central signatures, found $verified." >&2; exit 1; }
          shopt -s nullglob
          assets=(build/release/github/*)
          [[ "${#assets[@]}" == "41" ]] || { echo 'Canonical GitHub asset count differs.' >&2; exit 1; }
          expected_title="Strata ${RELEASE_TAG#v}"
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease)"
          [[ "$(jq -r '.tagName' <<< "$release_json")" == "$RELEASE_TAG" ]] || { echo 'GitHub release tag differs.' >&2; exit 1; }
          [[ "$(jq -r '.name' <<< "$release_json")" == "$expected_title" ]] || { echo 'GitHub release title differs.' >&2; exit 1; }
          jq --raw-output --join-output '(.body // "") | gsub("\r\n"; "\n") | if contains("\r") then error("release body contains a lone carriage return") else @base64 end' <<< "$release_json" |
            base64 --decode > "$actual_body_file"
          cmp --silent "docs/releases/$RELEASE_TAG.md" "$actual_body_file" || { echo 'GitHub release body differs.' >&2; exit 1; }
          [[ "$(jq -r '.isDraft' <<< "$release_json")" == "false" ]] || { echo 'GitHub release remains a draft.' >&2; exit 1; }
          [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]] || { echo 'GitHub release is unexpectedly a prerelease.' >&2; exit 1; }
          expected="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected" ]] || { echo 'GitHub release asset inventory differs.' >&2; exit 1; }
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$temporary"
            cmp --silent "$asset" "$temporary/$name" || { echo "GitHub asset differs: $name" >&2; exit 1; }
          done
          (cd "$temporary" && sha256sum --check SHA256SUMS)
          for jar in "$temporary"/*.jar; do
            gpg --batch --verify "$jar.asc" "$jar"
          done
      - name: Remove final Central controller overlay inputs
        if: always() && steps.central_controller_overlay.outcome == 'success'
        shell: bash
        env:
          CENTRAL_OVERLAY_DIRECTORY: ${{ steps.central_controller_overlay.outputs.directory }}
        run: |
          set -euo pipefail
          expected_overlay_directory="$RUNNER_TEMP/strata-central-controller-overlay-inputs"
          [[ "$CENTRAL_OVERLAY_DIRECTORY" == "$expected_overlay_directory" ]] || {
            echo 'Final Central controller overlay cleanup target differs from its exact temporary directory.' >&2
            exit 1
          }
          [[ -d "$CENTRAL_OVERLAY_DIRECTORY" && ! -L "$CENTRAL_OVERLAY_DIRECTORY" ]] || {
            echo 'Final Central controller overlay cleanup target is not a regular temporary directory.' >&2
            exit 1
          }
          rm -rf -- "$CENTRAL_OVERLAY_DIRECTORY"
          [[ ! -e "$CENTRAL_OVERLAY_DIRECTORY" ]] || {
            echo 'Final Central controller overlay inputs remained after verification.' >&2
            exit 1
          }
      - name: Verify approved Modrinth project and CDN artifacts
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-parallel --max-workers=2 --no-build-cache modrinthReleaseVerify \
            -Pstrata.sourceRevision="$RELEASE_TAG" \
            -Pstrata.sourceCommit="$RELEASE_SOURCE_COMMIT" \
            -Pstrata.modrinthProjectId="$PROJECT_ID"
      - name: Verify unauthenticated Modrinth page and version inventory
        shell: bash
        env:
          PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
        run: |
          set -euo pipefail
          bash -n release/verify-public-modrinth.sh
          env -u MODRINTH_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
            bash release/verify-public-modrinth.sh \
              build/release/modrinth/manifest.json "$PROJECT_ID" strata-ui
      - name: Set up Node for the public Skills CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require current GitHub CLI Skill support
        shell: bash
        run: |
          set -euo pipefail
          if ! gh skill --help >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --only-upgrade --yes gh
          fi
          gh skill --help >/dev/null
      - name: Verify public Pages, tagged Skill source, and preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pages="$(mktemp)"
          pages_inventory="$(mktemp)"
          source_revision="$(mktemp)"
          source_revision_expected="$(mktemp)"
          skill="$(mktemp)"
          trap 'rm -rf -- "$pages" "$pages_inventory" "$source_revision" "$source_revision_expected" "$skill"' EXIT
          release_pages_base="https://gh.s7a.dev/strata/releases/${RELEASE_TAG#v}"
          curl --fail --silent --show-error --location --proto '=https' \
            "$release_pages_base/pages-public-urls.txt" --output "$pages_inventory"
          LC_ALL=C sort --check --unique "$pages_inventory"
          grep --fixed-strings --line-regexp '/' "$pages_inventory" >/dev/null
          grep --fixed-strings --line-regexp '/index.html' "$pages_inventory" >/dev/null
          grep --fixed-strings --line-regexp '/guide/' "$pages_inventory" >/dev/null
          grep --fixed-strings --line-regexp '/guide/components.md' "$pages_inventory" >/dev/null
          grep --extended-regexp --line-regexp '/guide/components/[^/]+\.png' "$pages_inventory" >/dev/null
          grep --fixed-strings --line-regexp '/source-receipt.json' "$pages_inventory" >/dev/null
          grep --fixed-strings --line-regexp '/source-revision.txt' "$pages_inventory" >/dev/null
          while IFS= read -r public_path; do
            [[ "$public_path" == /* ]] || { echo "Invalid public Pages path: $public_path" >&2; exit 1; }
            curl --fail --silent --show-error --location --proto '=https' \
              "$release_pages_base$public_path" --output "$pages"
            [[ -s "$pages" ]] || { echo "Public Pages target is empty: $public_path" >&2; exit 1; }
          done < "$pages_inventory"
          curl --fail --silent --show-error --location --proto '=https' \
            "$release_pages_base/source-revision.txt" --output "$source_revision"
          printf '%s\n' "$RELEASE_TAG" > "$source_revision_expected"
          cmp --silent "$source_revision_expected" "$source_revision" || { echo 'Public Pages source revision differs from the release tag.' >&2; exit 1; }
          checked_commit="$(git rev-parse HEAD)"
          load_controller_script() {
            local source_path="$1"
            local destination="$2"
            local record=""
            local mode=""
            local object_type=""
            local blob=""
            local verified_path=""
            record="$(git ls-tree "$GITHUB_SHA" -- "$source_path")"
            read -r mode object_type blob verified_path <<< "$record"
            [[ "$mode" == "100644" && "$object_type" == "blob" && \
              "$blob" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$verified_path" == "$source_path" ]] || {
              echo "The controller script is not the expected regular Git blob: $source_path" >&2
              exit 1
            }
            [[ ! -e "$destination" && ! -L "$destination" ]] || {
              echo "Controller script destination already exists: $destination" >&2
              exit 1
            }
            git cat-file blob "$blob" > "$destination"
            bash -n "$destination"
          }
          pages_tool_directory="$(mktemp -d "$RUNNER_TEMP/strata-pages-tools.XXXXXX")"
          [[ -d "$pages_tool_directory" && ! -L "$pages_tool_directory" ]] || {
            echo 'Failed to create a regular Pages tool directory.' >&2
            exit 1
          }
          trap 'rm -rf -- "$pages" "$pages_inventory" "$source_revision" "$source_revision_expected" "$skill" "$pages_tool_directory"' EXIT
          pages_verifier="$pages_tool_directory/verify-pages-deployment-source.sh"
          pages_waiter="$pages_tool_directory/wait-for-pages-source-receipt.sh"
          load_controller_script release/verify-pages-deployment-source.sh "$pages_verifier"
          load_controller_script release/wait-for-pages-source-receipt.sh "$pages_waiter"
          bash "$pages_waiter" "$RELEASE_TAG" "$checked_commit" "$GITHUB_SHA"
          read -r \
            pages_run_id \
            _ \
            _ \
            controller_pages_run_id \
            _ \
            _ <<< "$PAGES_PROVENANCE_RECORD"
          pages_record_after_public_poll="$(bash "$pages_verifier" \
            "$pages_run_id" "$RELEASE_TAG" "$checked_commit" "$controller_pages_run_id" "$GITHUB_SHA")"
          [[ "$pages_record_after_public_poll" == "$PAGES_PROVENANCE_RECORD" ]] || {
            echo 'Pages provenance changed during final public verification.' >&2
            exit 1
          }
          curl --fail --silent --show-error --location --proto '=https' \
            "https://raw.githubusercontent.com/sya-ri/strata/$RELEASE_TAG/skills/strata/SKILL.md" --output "$skill"
          cmp --silent skills/strata/SKILL.md "$skill" || { echo 'The publicly installable Skill source differs from the release tag.' >&2; exit 1; }
          gh skill preview sya-ri/strata "skills/strata@$RELEASE_TAG" >/dev/null
      - name: Verify token-free public Skills CLI installation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ -z "${GH_TOKEN:-}" && -z "${GITHUB_TOKEN:-}" ]] || { echo 'The Skills CLI step must not receive a GitHub token.' >&2; exit 1; }
          install_root="$(mktemp -d)"
          trap 'rm -rf -- "$install_root"' EXIT
          (
            cd "$install_root"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              npx --yes skills add "sya-ri/strata@$RELEASE_TAG" --skill strata --agent codex --yes --copy
          )
          mapfile -d '' installed_skill_files < <(find "$install_root" -type f -name SKILL.md -print0)
          [[ "${#installed_skill_files[@]}" == "1" ]] || { echo 'Skills CLI did not install exactly one Strata skill tree.' >&2; exit 1; }
          installed_skill="$(dirname "${installed_skill_files[0]}")"
          diff --recursive --brief skills/strata "$installed_skill"
