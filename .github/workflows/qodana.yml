name: Qodana

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Reclaim analysis disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Compile analysis inputs
        run: bash ./gradlew classes gametestClasses
      - name: Release compiled outputs
        run: |
          bash ./gradlew :clean
          bash ./gradlew --stop
          df -h /
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/qodana/caches
          results-dir: ${{ runner.temp }}/qodana/results
          use-caches: false
          args: >-
            --fail-threshold 0
            --within-docker false
      - name: Release Qodana cache
        if: always()
        run: rm -rf -- "${{ runner.temp }}/qodana/caches"
      - name: Upload Qodana report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: error
