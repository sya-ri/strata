name: Shared Kotlin analysis probe
on:
  workflow_dispatch:
    inputs:
      context:
        description: Declared native project name to inspect; empty runs the small controls
        type: string
        default: ''
permissions:
  contents: read
  checks: write
jobs:
  probe:
    if: inputs.context == '' || inputs.context == 'fixture-copy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.context == 'fixture-copy' && '["combined-copy"]' || '["combined", "single-old", "single-new", "gradle-combined", "gradle-separate"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-strata-java
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Prepare independent compiled variants
        run: |
          python3 -B gradle/probe-shared-kotlin-analysis.py prepare "${{ matrix.mode }}"
          ./gradlew -p qodana-shared-analysis-fixture :old:verifyFixture :new:verifyFixture :old:writeClasspaths :new:writeClasspaths --no-daemon --console=plain
      - name: Export the selected project roots
        id: fixture
        run: python3 -B gradle/probe-shared-kotlin-analysis.py export "${{ matrix.mode }}" >> "$GITHUB_OUTPUT"
      - name: Analyze the diagnostic fixture
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/probe-cache
          results-dir: ${{ runner.temp }}/probe-results
          use-caches: false
          pr-mode: false
          args: >-
            --linter=qodana-jvm-community --within-docker=false
            --project-dir=${{ github.workspace }}/${{ steps.fixture.outputs.project-dir }}
            --config=${{ github.workspace }}/qodana-shared-analysis-fixture/${{ matrix.mode }}.yaml
            --property=intellij.platform.shared.source.support=true
            --property=batch.inspections.inspect.all.code.insight.contexts=true
      - name: Verify real analysis and genuine unused controls
        if: always()
        run: python3 -B gradle/probe-shared-kotlin-analysis.py inspect "${{ matrix.mode }}" "${{ runner.temp }}/probe-results"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-kotlin-probe-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/probe-results
            qodana-shared-analysis-fixture
          include-hidden-files: true
  actual-context:
    if: inputs.context != '' && inputs.context != 'fixture-copy' && inputs.context != 'fixture-sdk' && inputs.context != 'fixture-sdk-shared'
    runs-on: ubuntu-latest
    env:
      STRATA_PROBE_CONTEXT: ${{ inputs.context }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-strata-java
      - uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: false
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Discover the actual full project inventory
        run: bash gradle/plan-minecraft-ci.sh
      - name: Hash complete Loom inputs
        id: loom
        run: |
          LOOM_PROJECTS="$(< build/github-actions/minecraft-loom-projects.txt)"
          export LOOM_PROJECTS
          bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-minecraft-all-${{ steps.loom.outputs.hash }}
          restore-keys: |
            loom-${{ runner.os }}-minecraft-
      - name: Reuse the complete bootstrap and unchanged inspection profile
        run: python3 -B gradle/probe-real-qodana-context.py configure
      - name: Analyze the actual selected native context
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/context-cache
          results-dir: ${{ runner.temp }}/context-results
          use-caches: false
          pr-mode: false
          args: >-
            --linter=qodana-jvm-community --within-docker=false
            --config=build/qodana/probe-context.yaml
            ${{ inputs.context == 'copy-shared-sdk' && format('--property=idea.config.path={0}/build/qodana/probe-ide-config', github.workspace) || '' }}
            --property=intellij.platform.shared.source.support=true
            --property=batch.inspections.inspect.all.code.insight.contexts=true
      - name: Verify original roots, dependencies, source bytes and actual clean analysis
        if: always()
        run: python3 -B gradle/probe-real-qodana-context.py inspect "${{ runner.temp }}/context-results"
      - name: Retain actual context evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-actual-context
          path: |
            ${{ runner.temp }}/context-results
            build/qodana
            .idea
          include-hidden-files: true
  sdk-context:
    if: inputs.context == 'fixture-sdk' || inputs.context == 'fixture-sdk-shared'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.context == 'fixture-sdk-shared' && '["actual", "actual-shared"]' || '["inherited", "actual"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-strata-java
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Compile and execute SDK-specific Kotlin controls
        run: |
          python3 -B gradle/probe-qodana-sdks.py prepare
          ./gradlew -p qodana-sdk-analysis-fixture :old:verifyFixture :new:verifyFixture :old:writeClasspaths :new:writeClasspaths --no-daemon --console=plain
          python3 -B gradle/probe-qodana-sdks.py export "${{ matrix.mode }}"
      - name: Inspect the actual SDK bindings
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/sdk-cache
          results-dir: ${{ runner.temp }}/sdk-results
          use-caches: false
          pr-mode: false
          args: >-
            --linter=qodana-jvm-community --within-docker=false
            --project-dir=${{ github.workspace }}/qodana-sdk-analysis-fixture
            --config=${{ github.workspace }}/qodana-sdk-analysis-fixture/probe.yaml
            --property=idea.config.path=${{ github.workspace }}/qodana-sdk-analysis-fixture/ide-config
            --property=intellij.platform.shared.source.support=true
            --property=batch.inspections.inspect.all.code.insight.contexts=true
      - name: Check real SDK APIs and unused canaries
        if: always()
        run: python3 -B gradle/probe-qodana-sdks.py inspect "${{ matrix.mode }}" "${{ runner.temp }}/sdk-results"
      - name: Retain SDK control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-sdk-control-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/sdk-results
            qodana-sdk-analysis-fixture
          include-hidden-files: true
