name: Qodana

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/**
      - api/**
      - build-logic/**
      - build.gradle.kts
      - CHANGELOG.md
      - config/**
      - docs/**
      - gradle/**
      - gradle.properties
      - icon.svg
      - icon.png
      - integration/**
      - qodana.yaml
      - quality/**
      - README.md
      - release/**
      - runtime/**
      - settings.gradle.kts
      - skills/**
  push:
    branches:
      - master
    paths:
      - .github/actions/**
      - .github/workflows/**
      - api/**
      - build-logic/**
      - build.gradle.kts
      - CHANGELOG.md
      - config/**
      - docs/**
      - gradle/**
      - gradle.properties
      - icon.svg
      - icon.png
      - integration/**
      - qodana.yaml
      - quality/**
      - README.md
      - release/**
      - runtime/**
      - settings.gradle.kts
      - skills/**

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Java
        uses: ./.github/actions/setup-strata-java
      - name: Check analysis disk space
        id: analysis_disk
        shell: bash
        run: |
          available_kib=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo 'Cannot measure analysis disk space.' >&2; exit 1; }
          df -h "$GITHUB_WORKSPACE"
          # Leave room for the complete Loom model and the disposable Qodana IDE cache.
          if (( available_kib < 40 * 1024 * 1024 )); then
            echo 'reclaim=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reclaim=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Reclaim analysis disk space
        if: steps.analysis_disk.outputs.reclaim == 'true'
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: false
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Generate Minecraft cache inventory
        run: bash gradle/plan-minecraft-ci.sh
      - name: Hash all Minecraft Loom cache inputs
        id: loom_inputs
        shell: bash
        run: |
          LOOM_PROJECTS="$(< build/github-actions/minecraft-loom-projects.txt)"
          export LOOM_PROJECTS
          bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
      - name: Restore Minecraft Loom project cache
        id: loom_cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-minecraft-all-${{ steps.loom_inputs.outputs.hash }}
          restore-keys: |
            loom-${{ runner.os }}-minecraft-
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/qodana/caches
          results-dir: ${{ runner.temp }}/qodana/results
          use-caches: false
          # Override the legacy image-valued YAML linter, which otherwise selects Docker even in native mode.
          args: --linter=qodana-jvm-community --within-docker=false
      - name: Verify complete Gradle IDE model
        if: always()
        run: bash gradle/verify-qodana-model.sh "${{ runner.temp }}/qodana/results/projectStructure/Modules.json" "$GITHUB_WORKSPACE" /data/project
      - name: Measure Qodana cache
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          if [[ -d "${{ runner.temp }}/qodana/caches" ]]; then
            du -sh "${{ runner.temp }}/qodana/caches"
          else
            echo 'Qodana did not create an IDE cache directory.'
          fi
      - name: Release Qodana cache
        if: always()
        run: rm -rf -- "${{ runner.temp }}/qodana/caches"
      - name: Upload Qodana report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: error
      - name: Save complete Minecraft Loom project cache
        if: success() && github.ref == 'refs/heads/master' && steps.loom_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .gradle/loom-cache
          key: ${{ steps.loom_cache.outputs.cache-primary-key }}
