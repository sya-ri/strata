name: Qodana

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Assemble analysis dependencies
        run: bash ./gradlew assemble
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: >-
            --fail-threshold 0
            --volume "${{ env.JAVA_HOME_17_X64 }}:/root/.jdks/temurin-17"
            --volume "${{ env.JAVA_HOME_21_X64 }}:/root/.jdks/temurin-21"
          use-caches: false
      - name: Upload Qodana report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: error
