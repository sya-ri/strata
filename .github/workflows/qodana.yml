name: Qodana
'on':
  pull_request: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      qodana: ${{ steps.plan.outputs.qodana }}
      qodana_build_logic: ${{ steps.plan.outputs.qodana_build_logic }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select analysis inputs
      run: |-
        if [[ "$EVENT" == pull_request && -z "$SOURCE_REF" ]]; then
          python3 gradle/plan-ci.py --base "$BASE" --head "$HEAD"
        else
          python3 gradle/plan-ci.py --full
        fi
      id: plan
      env:
        SOURCE_REF: ${{ inputs.ref }}
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
  qodana:
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Set up Java
      uses: ./.github/actions/setup-strata-java
    - name: Check analysis disk space
      id: analysis_disk
      shell: bash
      run: |
        available_kib=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
        [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo 'Cannot measure analysis disk space.' >&2; exit 1; }
        df -h "$GITHUB_WORKSPACE"
        # Leave room for the complete Loom model and the disposable Qodana IDE cache.
        if (( available_kib < 40 * 1024 * 1024 )); then
          echo 'reclaim=true' >> "$GITHUB_OUTPUT"
        else
          echo 'reclaim=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Reclaim analysis disk space
      if: steps.analysis_disk.outputs.reclaim == 'true'
      uses: insightsengineering/disk-space-reclaimer@v1
      with:
        tools-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-strict-match: false
        gradle-home-cache-excludes: caches/fabric-loom
    - name: Generate Minecraft cache inventory
      run: bash gradle/plan-minecraft-ci.sh
    - name: Hash analysis cache inputs
      id: analysis_inputs
      shell: bash
      run: |
        LOOM_PROJECTS="$(< build/github-actions/minecraft-loom-projects.txt)"
        export LOOM_PROJECTS
        bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
        echo "qodana_hash=${{ hashFiles(
          '**/*.gradle.kts', 'gradle/wrapper/**', 'gradle/libs.versions.toml', 'gradle.properties',
          'gradle/kover-jvm-projects.txt', 'gradle/performance-modules.tsv',
          'gradle/java-toolchains.py', 'gradle/plan-minecraft-ci.sh',
          'gradle/prepare-qodana-idea-model.sh', 'gradle/prepare-qodana-project.py',
          'build-logic/src/main/**', 'qodana.yaml', '.github/workflows/qodana.yml',
          '!build-logic/src/test/**'
          ) }}" >> "$GITHUB_OUTPUT"
    - name: Restore Minecraft Loom project cache
      id: loom_cache
      uses: actions/cache/restore@v6
      with:
        path: .gradle/loom-cache
        key: loom-${{ runner.os }}-minecraft-all-${{ steps.analysis_inputs.outputs.hash }}
        restore-keys: |
          loom-${{ runner.os }}-minecraft-
          loom-${{ runner.os }}-documentation-
    - name: Restore Qodana indexes
      id: analysis_cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/qodana/caches
        key: qodana-index-${{ runner.os }}-${{ steps.analysis_inputs.outputs.qodana_hash }}-${{ github.sha }}
        restore-keys: |
          qodana-index-${{ runner.os }}-${{ steps.analysis_inputs.outputs.qodana_hash }}-
    - name: Run Qodana
      uses: JetBrains/qodana-action@v2026.2
      with:
        cache-dir: ${{ runner.temp }}/qodana/caches
        results-dir: ${{ runner.temp }}/qodana/results
        use-caches: false
        pr-mode: false
        args: >-
          --linter=qodana-jvm-community --within-docker=false
          --property=idea.config.path=${{ github.workspace }}/build/qodana/ide-config
    - name: Verify complete Gradle IDE model
      if: always()
      run: bash gradle/verify-qodana-model.sh "${{ runner.temp }}/qodana/results/projectStructure/Modules.json" "$GITHUB_WORKSPACE"
        /data/project
    - name: Measure Qodana cache
      if: always()
      run: |
        df -h "$GITHUB_WORKSPACE"
        if [[ -d "${{ runner.temp }}/qodana/caches" ]]; then
          du -sh "${{ runner.temp }}/qodana/caches"
        else
          echo 'Qodana did not create an IDE cache directory.'
        fi
    - name: Upload declaration and generated model evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: qodana-model-evidence
        path: |-
          build/qodana
          .idea/modules.xml
          .idea/misc.xml
          strata.ipr
          **/*.iml
        if-no-files-found: warn
        include-hidden-files: true
    - name: Upload Qodana report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: qodana-report
        path: ${{ runner.temp }}/qodana/results
        if-no-files-found: error
        include-hidden-files: true
    - name: Save verified Qodana indexes
      if: success() && steps.analysis_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/qodana/caches
        key: ${{ steps.analysis_cache.outputs.cache-primary-key }}
    - name: Save complete Minecraft Loom project cache
      if: success() && steps.loom_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .gradle/loom-cache
        key: ${{ steps.loom_cache.outputs.cache-primary-key }}
    needs: plan
    if: needs.plan.outputs.qodana == 'true'
  build-logic:
    needs: plan
    if: needs.plan.outputs.qodana_build_logic == 'true'
    uses: ./.github/workflows/qodana-build-logic.yml
    with:
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
  result:
    name: Qodana result
    needs:
    - plan
    - qodana
    - build-logic
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Check planned analysis outcomes
      run: python3 gradle/plan-ci.py --check-analysis-results
      env:
        RESULTS: ${{ toJSON(needs) }}
