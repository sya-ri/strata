name: Qodana

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/**
      - api/**
      - build-logic/**
      - build.gradle.kts
      - CHANGELOG.md
      - config/**
      - docs/**
      - gradle/**
      - gradle.properties
      - icon.svg
      - icon.png
      - integration/**
      - qodana.yaml
      - quality/**
      - README.md
      - release/**
      - runtime/**
      - settings.gradle.kts
      - skills/**
  push:
    branches:
      - master
    paths:
      - .github/actions/**
      - .github/workflows/**
      - api/**
      - build-logic/**
      - build.gradle.kts
      - CHANGELOG.md
      - config/**
      - docs/**
      - gradle/**
      - gradle.properties
      - icon.svg
      - icon.png
      - integration/**
      - qodana.yaml
      - quality/**
      - README.md
      - release/**
      - runtime/**
      - settings.gradle.kts
      - skills/**

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Java
        uses: ./.github/actions/setup-strata-java
      - name: Reclaim analysis disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-strict-match: true
          gradle-home-cache-excludes: caches/fabric-loom
      - name: Generate Minecraft cache inventory
        run: bash gradle/plan-minecraft-ci.sh
      - name: Hash all Minecraft Loom cache inputs
        id: loom_inputs
        shell: bash
        run: |
          LOOM_PROJECTS="$(< build/github-actions/minecraft-loom-projects.txt)"
          export LOOM_PROJECTS
          bash gradle/loom-cache-key.sh >> "$GITHUB_OUTPUT"
      - name: Restore Minecraft Loom project cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-minecraft-all-${{ steps.loom_inputs.outputs.hash }}
          restore-keys: |
            loom-${{ runner.os }}-minecraft-
      - name: Compile analysis inputs
        run: bash ./gradlew :api:jar :runtime:core:jar :runtime:headless:jar :runtime:minecraft:jar :runtime:minecraft-fonts-lwjgl:jar classes gametestClasses
      - name: Stop Gradle daemons
        run: |
          bash ./gradlew --stop
          df -h /
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/qodana/caches
          results-dir: ${{ runner.temp }}/qodana/results
          use-caches: false
          args: --within-docker false
      - name: Verify complete Gradle IDE model
        if: always()
        run: bash gradle/verify-qodana-model.sh "${{ runner.temp }}/qodana/results/projectStructure/Modules.json" "$GITHUB_WORKSPACE" /data/project
      - name: Measure Qodana cache
        if: always()
        run: |
          if [[ -d "${{ runner.temp }}/qodana/caches" ]]; then
            du -sh "${{ runner.temp }}/qodana/caches"
          else
            echo 'Qodana did not create an IDE cache directory.'
          fi
      - name: Release Qodana cache
        if: always()
        run: rm -rf -- "${{ runner.temp }}/qodana/caches"
      - name: Upload Qodana report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-report
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: error
