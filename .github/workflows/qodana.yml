name: Multiplatform actual-property probe
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-strata-java
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Compile and execute plain and multiplatform controls
        run: |
          python3 -B gradle/probe-qodana-multiplatform.py prepare
          ./gradlew -p qodana-multiplatform-analysis-fixture :plain:verifyFixture :mpp:verifyFixture :mpp:compileCommonMainKotlinMetadata :mpp:compileKotlinJs --no-daemon --console=plain
          python3 -B gradle/probe-qodana-multiplatform.py export
      - name: Inspect compiler and own-output controls
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/mpp-cache
          results-dir: ${{ runner.temp }}/mpp-results
          use-caches: false
          pr-mode: false
          args: >-
            --linter=qodana-jvm-community --within-docker=false
            --project-dir=${{ github.workspace }}/qodana-multiplatform-analysis-fixture
            --config=${{ github.workspace }}/qodana-multiplatform-analysis-fixture/probe.yaml
            --property=idea.config.path=${{ github.workspace }}/qodana-multiplatform-analysis-fixture/ide-config
      - name: Compare genuine unused canaries and actual-property findings
        if: always()
        run: python3 -B gradle/probe-qodana-multiplatform.py inspect "${{ runner.temp }}/mpp-results"
      - name: Retain compiled, source, model and analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiplatform-property-controls
          path: |
            ${{ runner.temp }}/mpp-results
            qodana-multiplatform-analysis-fixture
          include-hidden-files: true
