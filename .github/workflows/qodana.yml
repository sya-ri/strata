name: Shared Kotlin analysis probe
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [combined, single-old, single-new, gradle-combined, gradle-separate]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-strata-java
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Prepare independent compiled variants
        run: |
          python3 -B gradle/probe-shared-kotlin-analysis.py prepare
          ./gradlew -p qodana-shared-analysis-fixture :old:verifyFixture :new:verifyFixture :old:writeClasspaths :new:writeClasspaths --no-daemon --console=plain
      - name: Export the selected project roots
        id: fixture
        run: python3 -B gradle/probe-shared-kotlin-analysis.py export "${{ matrix.mode }}" >> "$GITHUB_OUTPUT"
      - name: Analyze the diagnostic fixture
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          cache-dir: ${{ runner.temp }}/probe-cache
          results-dir: ${{ runner.temp }}/probe-results
          use-caches: false
          pr-mode: false
          args: >-
            --linter=qodana-jvm-community --within-docker=false
            --project-dir=${{ github.workspace }}/${{ steps.fixture.outputs.project-dir }}
            --config=${{ github.workspace }}/qodana-shared-analysis-fixture/${{ matrix.mode }}.yaml
            --property=intellij.platform.shared.source.support=true
            --property=batch.inspections.inspect.all.code.insight.contexts=true
      - name: Verify real analysis and genuine unused controls
        if: always()
        run: python3 -B gradle/probe-shared-kotlin-analysis.py inspect "${{ matrix.mode }}" "${{ runner.temp }}/probe-results"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qodana-kotlin-probe-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/probe-results
            qodana-shared-analysis-fixture
          include-hidden-files: true
