      - runtime/paper/src/main/kotlin/dev/s7a/strata/runtime/paper/PaperScreens.kt
  # Qodana's Kotlin data-flow pass loses the retained pre-update state across the state replacement even though the compiler and anchor-retention tests preserve it.
