      - runtime/shared/minecraft-fabric/transport/stream-codec/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricRemoteTransport.java
  # Qodana treats the Strata minecraft module as a runtime class source and reports its Kotlin and annotation dependencies as classpath overrides.
  # Exact loaded-client tests exercise these inventory bridges with the owning Minecraft runtime and dependency set.
  # The flattened remote module likewise misattributes the native payloads' compile-time nullability annotations; published remote JARs contain no annotation classes.
  # HUD callbacks return Kotlin Unit from the standard library; common remote/font JARs do not package kotlin/Unit.class.
  - name: ClassOverriddenAtRuntime
    paths:
      - runtime/shared/minecraft-fabric/screen/gui-graphics/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
