version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2
bootstrap: STRATA_QODANA_BOOTSTRAP=true bash gradle/prepare-qodana-idea-model.sh
rootJavaProjects:
  - .idea
profile:
  base:
    name: qodana.recommended
  inspections:
    # Every numeric Fabric integration build uses the same experimental Gradle client-test boundary.
    - inspection: UnstableApiUsage
      ignore:
        - "integration/minecraft-fabric-[0-9]*/build.gradle.kts"
    # These mapped compatibility files require explicit getter syntax in every version owner in which they exist.
    - inspection: UsePropertyAccessSyntax
      ignore:
        - "runtime/minecraft-fabric-[0-9]*/src/font/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftFontCapabilities.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftDynamicTextureFactory.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-pipeline/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftDynamicTextureFactory.kt"
    # These compatibility files are linked or selected by every version owner in which they exist, so one IDEA index cannot retain each owner-specific call graph.
    - inspection: UnusedSymbol
      ignore:
        - "runtime/minecraft-fabric-[0-9]*/src/font/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftFontCapabilities.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftDynamicTextureFactory.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-pipeline/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftDynamicTextureFactory.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftGuiMetadata.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-pipeline/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftGuiMetadata.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSampledImageDrawing.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-type/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSampledImageDrawing.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-pipeline/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSampledImageDrawing.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftTextureBlitter.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-type/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftTextureBlitter.kt"
        - "runtime/shared/minecraft-fabric/rendering/render-pipeline/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftTextureBlitter.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricNativeCanvasPipeline.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/MinecraftResourceLocation.kt"
        - "runtime/minecraft-fabric-[0-9]*/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/MinecraftResourceLocationException.kt"
    # Every version-specific Java skin bridge uses equality to express the repository's no-prefix-negation rule.
    - inspection: PointlessBooleanExpression
      ignore:
        - "runtime/minecraft-fabric-[0-9]*/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSkinBridge.java"
        - "runtime/shared/minecraft-fabric/resources/direct-skin-result/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSkinBridge.java"
        - "runtime/shared/minecraft-fabric/resources/primitive-callbacks/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSkinBridge.java"
        - "runtime/shared/minecraft-fabric/resources/event-callbacks/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftSkinBridge.java"
failThreshold: 0
exclude:
  # Kotlin explicit API mode requires visibility modifiers on declarations that Qodana marks as redundant.
  - name: RedundantVisibilityModifier
  # Dokka validates these links successfully; Qodana misses valid Kotlin/JVM exception tags and cross-module API links.
  - name: KDocUnresolvedReference
  # The Kotlin compiler enforces these custom RequiresOptIn boundaries; Qodana does not recognize every cross-module use.
  - name: UnnecessaryOptInAnnotation
  # UpperCamel names are the intentional declarative component surface.
  - name: FunctionName
    paths:
      - api/src/main/kotlin/dev/s7a/strata/component/CanvasComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/ObserveComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/ObservedComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/ObservedTextComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/ProfileComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/SelectionListComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/TextInputComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/TiledImageComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/UiComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/VirtualListComponents.kt
      - integration/shared/minecraft-fabric/scenarios/gui-extractor/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftProgressExample.kt
  # Gradle's settings model and Fabric's non-versioned client-test and production-run boundaries expose experimental APIs required by their current public integrations.
  - name: UnstableApiUsage
    paths:
      - settings.gradle.kts
      - integration/shared/minecraft-fabric/runner/fabric-client-gametest/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftLegacyClientGameTest.kt
      - integration/shared/minecraft-fabric/screen/gui-extractor/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/InventorySlotSynchronizationGameTest.kt
      - integration/shared/minecraft-fabric/scenarios/gui-extractor/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftProgressParity.kt
      - integration/shared/minecraft-fabric/scenarios/gui-extractor/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/shared/minecraft-fabric/runner/gui-extractor/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
  # These geometry checks keep overflow-explicit comparisons instead of relying on range construction.
  - name: ConvertTwoComparisonsToRangeCheck
    paths:
      - api/src/main/kotlin/dev/s7a/strata/geometry/Constraints.kt
      - api/src/main/kotlin/dev/s7a/strata/geometry/IntRect.kt
