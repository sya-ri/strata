      - runtime/shared/minecraft-fabric/input/screen-field/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/mixin/lifecycle/FabricUiMouseMixin.java
  # These Java interoperability boundaries deliberately validate values that Kotlin's source types consider non-null.
  - name: RedundantRequireNotNullCall
    paths:
      - runtime/headless/src/main/kotlin/dev/s7a/strata/runtime/headless/HeadlessRendering.kt
  # Named concrete facades keep internal coroutine/control state distinct from their exposed CoroutineScope and UiSession contracts.
  - name: ConvertToExplicitBackingFields
    paths:
      - runtime/core/src/main/kotlin/dev/s7a/strata/runtime/UiSession.kt
      - runtime/remote/src/main/kotlin/dev/s7a/strata/runtime/remote/RemoteClientSession.kt
  # Migration changes definition construction and session ownership outside the opening call, so no call-only replacement is valid.
  - name: DeprecatedCallableAddReplaceWith
    paths:
      - api/src/main/kotlin/dev/s7a/strata/screen/Screens.kt
      - runtime/paper/src/main/kotlin/dev/s7a/strata/runtime/paper/PaperScreens.kt
  # Minecraft and its IO executor are client-owned singletons despite implementing AutoCloseable; adapters borrow them and must never close application resources.
  - name: AutoCloseableResource
    paths:
      - runtime/shared/minecraft-fabric/screen/gui-extractor/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
