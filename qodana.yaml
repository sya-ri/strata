      - runtime/minecraft/src/main/kotlin/dev/s7a/strata/runtime/minecraft/MinecraftTextRun.kt
  # The project deliberately reserves const values for external compile-time API requirements.
  - name: MayBeConstant
    paths:
      - api/src/main/kotlin/dev/s7a/strata/input/KeyCode.kt
  # Java has no Boolean.not() equivalent, so these exact Java boundaries use equality instead of the prohibited prefix-negation form.
  - name: PointlessBooleanExpression
    paths:
