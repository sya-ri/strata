version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2
profile:
  name: qodana.recommended
failThreshold: 0
exclude:
  # Kotlin explicit API mode requires visibility modifiers on declarations that Qodana marks as redundant.
  - name: RedundantVisibilityModifier
  # Dokka validates these links successfully; Qodana misses valid Kotlin/JVM exception tags and cross-module API links.
  - name: KDocUnresolvedReference
  # The Kotlin compiler enforces these custom RequiresOptIn boundaries; Qodana does not recognize every cross-module use.
  - name: UnnecessaryOptInAnnotation
  # UpperCamel names are the intentional declarative component surface.
  - name: FunctionName
    paths:
      - api/src/main/kotlin/dev/s7a/strata/component/ProfileComponents.kt
      - api/src/main/kotlin/dev/s7a/strata/component/UiComponents.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftProgressExample.kt
  # Gradle's settings model and the Fabric Client GameTest boundary expose experimental APIs required by their current public integrations.
  - name: UnstableApiUsage
    paths:
      - settings.gradle.kts
      - integration/minecraft-fabric-1.21.10/build.gradle.kts
      - integration/minecraft-fabric-1.21.11/build.gradle.kts
      - integration/minecraft-fabric-26.1/build.gradle.kts
      - integration/minecraft-fabric-26.2/build.gradle.kts
      - integration/minecraft-fabric-1.21-legacy/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftLegacyClientGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/InventorySlotSynchronizationGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftProgressParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
  # These geometry checks keep overflow-explicit comparisons instead of relying on range construction.
  - name: ConvertTwoComparisonsToRangeCheck
    paths:
      - api/src/main/kotlin/dev/s7a/strata/geometry/Constraints.kt
      - api/src/main/kotlin/dev/s7a/strata/geometry/IntRect.kt
      - api/src/main/kotlin/dev/s7a/strata/input/TextInputEvent.kt
      - runtime/minecraft/src/main/kotlin/dev/s7a/strata/runtime/minecraft/MinecraftProfileImplementation.kt
      - runtime/minecraft/src/main/kotlin/dev/s7a/strata/runtime/minecraft/MinecraftScrollElement.kt
  # Named domain records keep source and destination axes explicit; positional destructuring would obscure the scroll and glyph arithmetic.
  - name: DestructuringDeclaration
    paths:
      - runtime/minecraft/src/main/kotlin/dev/s7a/strata/runtime/minecraft/MinecraftScrollElement.kt
      - runtime/minecraft/src/main/kotlin/dev/s7a/strata/runtime/minecraft/MinecraftTextRun.kt
  # Explicit resource lifetime blocks make the GameTest cleanup order and primary-failure ownership auditable.
  - name: ConvertTryFinallyToUseCall
    paths:
      - integration/minecraft-fabric-1.21-legacy/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftLegacyClientGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftProgressParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
  # The project deliberately reserves const values for external compile-time API requirements.
  - name: MayBeConstant
    paths:
      - api/src/main/kotlin/dev/s7a/strata/input/KeyCode.kt
      - integration/minecraft-fabric-1.21-legacy/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftLegacyClientGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
  # Java has no Boolean.not() equivalent, so these exact lifecycle files use equality instead of the prohibited prefix-negation form.
  - name: PointlessBooleanExpression
    paths:
      - runtime/minecraft-fabric-1.21-legacy/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
      - runtime/minecraft-fabric-shared/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftFailures.java
      - runtime/minecraft-fabric-unobfuscated/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
      - runtime/minecraft-fabric-shared/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricScreenLifecycleTransaction.java
  # The Minecraft adapters keep explicit mapped Java getter calls so their authoritative external API mappings remain visible and searchable.
  - name: UsePropertyAccessSyntax
    paths:
      - integration/minecraft-fabric-1.21-legacy/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftLegacyClientGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
      - runtime/minecraft-fabric-shared/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftAssetLoader.kt
      - runtime/minecraft-fabric-shared/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftFontContract.kt
      - runtime/minecraft-fabric-shared/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftProfileFactory.kt
      - runtime/minecraft-fabric-unobfuscated/src/main/kotlin/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftScreen.kt
  # Explicit Minecraft Java SAM and qualifier syntax pins the loaded GameTest boundary instead of relying on Kotlin inference.
  - name: RedundantSamConstructor
    paths:
      - integration/minecraft-fabric-1.21-legacy/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftLegacyClientGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/InventorySlotSynchronizationGameTest.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftProgressParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
  - name: RemoveRedundantQualifierName
    paths:
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/MinecraftSocialParity.kt
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
  # These Java interoperability boundaries deliberately validate values that Kotlin's source types consider non-null.
  - name: RedundantRequireNotNullCall
    paths:
      - integration/minecraft-fabric-unobfuscated/src/gametest/kotlin/dev/s7a/strata/integration/minecraft/fabric/StrataMinecraftClientGameTest.kt
      - runtime/headless/src/main/kotlin/dev/s7a/strata/runtime/headless/HeadlessRendering.kt
  # The named concrete scope facade keeps its replaceable CoroutineContext implementation distinct from the exposed CoroutineScope contract.
  - name: ConvertToExplicitBackingFields
    paths:
      - runtime/core/src/main/kotlin/dev/s7a/strata/runtime/UiSession.kt
  # Reflection-driven inventory control flow is covered by the showcase integration tests.
  - name: KotlinUnreachableCode
    paths:
      - integration/docs/src/main/kotlin/dev/s7a/strata/integration/docs/ShowcaseInventory.kt
  # Dokka resolves these KDoc-only type imports, while the source analyzer sees no executable use.
  - name: KotlinUnusedImport
    paths:
      - integration/docs/src/main/kotlin/dev/s7a/strata/integration/docs/ShowcaseStorage.kt
      - runtime/minecraft/src/main/kotlin/dev/s7a/strata/runtime/minecraft/MinecraftUiProfile.kt
  # Qodana misresolves ByteArray.plus as array string rendering; byte-exact tests verify the replacement operation.
  - name: KotlinArrayToString
    paths:
      - integration/docs/src/main/kotlin/dev/s7a/strata/integration/docs/ShowcaseReadme.kt
  # Minecraft is a client-owned singleton despite implementing AutoCloseable; the Slot bridge must never close the application client.
  - name: AutoCloseableResource
    paths:
      - runtime/minecraft-fabric-unobfuscated/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
      - runtime/minecraft-fabric-1.21-legacy/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
  # Public SPI declarations, including PaintScope drawing operations, are consumed by external clients even when this repository has no call site.
  # Public component configuration and modifier entry points are likewise consumed by downstream Mods rather than every repository fixture.
  # Component evaluation and screen-transfer bridges are cross-module runtime boundaries that the local Kotlin call graph does not resolve reliably.
  # Main functions and JMH benchmark methods are reflection entry points, not Kotlin call graph roots.
  # Fabric Client GameTest classes are discovered from Fabric metadata rather than Kotlin call sites.
  # ShowcaseOutput members are consumed across the storage/markdown generation pipeline.
  # The Minecraft example functions are compiled standalone documentation sources consumed by the showcase generator.
  # Retained element and modifier update callbacks plus screen metadata accessors are exercised through typed factories and integration tests that Qodana's local call graph does not follow.
  # Mapped resource-name aliases are consumed across linked source-root boundaries that Qodana does not model as direct source declarations.
  - name: UnusedSymbol
    paths:
      - api/src/main/kotlin/dev/s7a/strata/geometry/Constraints.kt
      - api/src/main/kotlin/dev/s7a/strata/input/PointerEvent.kt
      - api/src/main/kotlin/dev/s7a/strata/input/KeyCode.kt
