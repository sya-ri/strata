  # Java has no Boolean.not() equivalent, so these exact Java boundaries use equality instead of the prohibited prefix-negation form.
  - name: PointlessBooleanExpression
    paths:
      - runtime/shared/minecraft-fabric/screen/gui-graphics/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftInventoryBridge.java
      - runtime/shared/minecraft-fabric/lifecycle/common/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftFailures.java
      - runtime/shared/minecraft-fabric/resources/common/src/main/java/dev/s7a/strata/runtime/minecraft/fabric/FabricMinecraftProfileCache.java
