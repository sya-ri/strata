// A rehearsal's generated notes live outside the immutable product checkout.
gradle.projectsEvaluated {
    // Init scripts also reach included plugin builds, which do not own release metadata.
    if (gradle.rootProject.projectDir.canonicalFile == new File(System.getenv('STRATA_REHEARSAL_PRODUCT')).canonicalFile) {
        gradle.rootProject.extensions.getByName('strataRelease').releaseNotesFile.set(
            new File(System.getenv('STRATA_REHEARSAL_NOTES'))
        )
    }
}
